function renderQuiz(){if(!Q)return;const box=$('#sheetBody');if(Q.done){box.innerHTML=wrap(quizEnd());return}
const q=Q.qs[Q.i],opts=L(q.o),ord=Q.order[Q.i],n=Q.qs.length;
let h=`<div class="flex items-center justify-between text-[13px] hint font-semibold mb-2"><span>${t('question')} ${Q.i+1} ${t('of')} ${n}</span><span style="color:var(--ok)">✓ ${Q.correct}</span></div><div class="pbar mb-4"><div style="width:${(Q.i+(Q.picked!=null?1:0))/n*100}%"></div></div>`;
if(Q.timer)h+=`<div class="timer"><span>⏳</span><span id="qTimer" style="color:${Q.left<=8?'var(--bad)':'var(--text)'}">${Q.left}</span><span class="hint text-[13px]">s</span></div>`;
h+=`<div class="card p-5 mb-3" style="animation:pop .3s"><div class="text-[17px] font-bold leading-snug" style="font-family:var(--head)">${L(q.q)}</div></div>`;
h+=ord.map(k=>{let c='opt';if(Q.picked!=null){if(k===q.a)c+=' ok';else if(k===Q.picked)c+=' bad';else c+=' dim'}return `<button class="${c}" onclick="App.pick(${k})" ${Q.picked!=null?'disabled':''}>${opts[k]}</button>`}).join('');
if(Q.picked!=null){const ok=Q.picked===q.a;h+=`<div class="expl ${ok?'ok':'bad'}"><b>${Q.picked===-1?'⏰ '+t('timeout'):ok?'✅ '+t('correct'):'❌ '+t('wrong')}</b> ${q.e?L(q.e):''}</div><button class="btn w-full mt-3" onclick="App.next()">${Q.i+1<n?t('next')+' →':t('finish')+' 🏁'}</button>`}
box.innerHTML=wrap(h,false);
if(Q.timer&&Q.picked==null&&Q.tickFor!==Q.i){Q.tickFor=Q.i;Q.left=Q.timer;clearInterval(Q.iv);Q.iv=setInterval(()=>{if(!Q||Q.picked!=null)return;Q.left--;const el=$('#qTimer');if(el){el.textContent=Q.left;el.style.color=Q.left<=8?'var(--bad)':'var(--text)'}if(Q.left<=5&&Q.left>0)Snd.tick();if(Q.left<=0)pick(-1)},1000)}}
function pick(k){if(!Q||Q.picked!=null)return;Q.picked=k;const q=Q.qs[Q.i];if(k===q.a){Q.correct++;Snd.success();notif('success')}else{Snd.error();notif('error')}S.qTotal++;if(k===q.a)S.qCorrect++;save();renderQuiz();setTimeout(()=>{const b=$('#sheetBody');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})},80)}
function next(){if(!Q)return;Q.i++;Q.picked=null;if(Q.i>=Q.qs.length){Q.done=true;clearInterval(Q.iv);finishQuiz()}renderQuiz();$('#sheetBody').scrollTop=0}
function finishQuiz(){const n=Q.qs.length,c=Q.correct,ctx=Q.ctx;let g=0;S.quizzes++;
if(ctx.k==='mod'){const prev=S.qbest[ctx.id]||0;if(c>prev){g+=(c-prev)*10;S.qbest[ctx.id]=c}else if(S.qbest[ctx.id]==null)S.qbest[ctx.id]=c;if(c/n>=.8&&!S.qbonus[ctx.id]){S.qbonus[ctx.id]=1;g+=30}}
else if(ctx.k==='exam'){if(c>S.exam){g+=(c-S.exam)*8;S.exam=c}}
else if(ctx.k==='law'){const prev=S.qbest.law||0;if(c>prev){g+=(c-prev)*10;S.qbest.law=c}else if(S.qbest.law==null)S.qbest.law=c}
Q.gain=g;save();if(c/n>=.8){confetti(90);Snd.level()}else Snd.success();if(g)setTimeout(()=>addXP(g,t('test')),400);else setTimeout(checkAch,300)}
function quizEnd(){const n=Q.qs.length,c=Q.correct,p=c/n;const msg=p>=.8?t('excellent'):p>=.5?t('good'):t('tryMore');
return `<div class="card p-6 text-center" style="animation:pop .4s"><div class="flex justify-center">${ring(p,150,14,Math.round(p*100)+'%')}</div><div class="font-extrabold text-[22px] mt-4" style="font-family:var(--head)">${msg}</div><div class="hint mt-1">${t('result')}: ${c} ${t('of')} ${n}</div>${Q.gain?`<div class="chip acc mt-3 text-[14px]">⭐ ${t('xpGot')}: +${Q.gain}</div>`:''}<div class="grid gap-2 mt-6"><button class="btn" onclick="App.retry()">↻ ${t('retry')}</button>${Q.ctx.k==='mod'?`<button class="btn btn-ghost" onclick="App.sub('case')">💼 ${t('case')} →</button>`:`<button class="btn btn-ghost" onclick="App.closeSheet()">${t('close')}</button>`}</div></div>`}
function retry(){const k=Q?Q.ctx.k:'mod';if(k==='mod')startModQuiz();else if(k==='exam')startExam();else startLawQuiz()}
function openExam(){if(!examReadiness().ready){toast(S.lang==='uz'?'Avval barcha taʼlim bloklarini yakunlang.':'Сначала завершите все учебные блоки.');return}sheetMode='exam';Q=null;showSheet();$('#sheetTitle').textContent=t('trainer');$('#sheetSub').textContent=t('course');$('#sheetTabs').innerHTML='';$('#readBar').style.width='0';Snd.open();
sheetRender=()=>{$('#sheetTitle').textContent=t('trainer');$('#sheetSub').textContent=t('course');if(Q)renderQuiz();else examIntro()};examIntro()}
function examIntro(){const readiness=examReadiness();if(!readiness.ready){$('#sheetBody').innerHTML=wrap(`<div class="card p-6 text-center"><div class="text-5xl">🔒</div><div class="font-extrabold text-[20px] mt-3">${S.lang==='uz'?'Yakuniy imtihon yopiq':'Итоговый экзамен пока закрыт'}</div><p class="hint text-[14px] mt-2">${S.lang==='uz'?'Barcha maʼruzalar, modullar testlari, keyslar va qonunchilik testini yakunlang.':'Сначала завершите все лекции, тесты модулей, кейсы и тест по законодательству. Для допуска требуется не менее 70% в каждом тесте.'}</p><button class="btn w-full mt-5" onclick="App.close()">${S.lang==='uz'?'Davom etish':'Вернуться к обучению'}</button></div>`);return}const pool=examPool();const n=Math.min(50,pool.length);$('#sheetBody').innerHTML=wrap(`<div class="card p-6 text-center"><div class="text-6xl">🧠</div><div class="font-extrabold text-[22px] mt-3" style="font-family:var(--head)">${t('trainer')}</div><p class="hint text-[14px] mt-2 leading-relaxed">${t('examIntro')}</p><div class="flex justify-center flex-wrap gap-2 mt-4">${chip('📝 '+n+' '+t('qs'))}${chip('⏳ 45s')}${chip('📚 '+pool.length+' '+(S.lang==='uz'?'savol banki':'в банке'))}${chip('🏅 '+t('best')+': '+S.exam+'/'+n,'acc')}</div><div class="text-xs hint mt-3">${S.lang==='uz'?'Savollar kurs modullari va qonunchilik testidan olinadi.':'Вопросы формируются из учебных модулей и теста по законодательству.'}</div><button class="btn w-full mt-5" onclick="App.startExam()">${t('start')} →</button></div>`)}
function examPool(){const pool=[];allMods().forEach(m=>m.quiz.forEach(q=>pool.push(q)));(C.laws.quiz||[]).forEach(q=>pool.push(q));return pool}
function startExam(){if(!examReadiness().ready){toast(S.lang==='uz'?'Avval barcha taʼlim bloklarini yakunlang.':'Сначала завершите все учебные блоки.');examIntro();return}const pool=examPool();const n=Math.min(50,pool.length);startQuiz({k:'exam'},shuffle(pool).slice(0,n),45)}
function startLawQuiz(){sheetMode='law';showSheet();$('#sheetTitle').textContent=t('lawQuiz');$('#sheetSub').textContent='ЗРУ-637 · ЗРУ-901';$('#sheetTabs').innerHTML='';$('#readBar').style.width='0';sheetRender=()=>{$('#sheetTitle').textContent=t('lawQuiz');renderQuiz()};startQuiz({k:'law'},C.laws.quiz||[])}

function modCase(m){const cs=m.cs;const sel=caseSel[m.id]!=null?caseSel[m.id]:(S.cases[m.id]!=null?S.cases[m.id]:null);const opts=L(cs.o),fb=L(cs.fb);
let h=`<div class="card p-5 mb-3"><div class="text-[11px] uppercase tracking-wider font-bold gtext">💼 ${t('caseSit')}</div><div class="prose-l mt-2 text-[15.5px]">${L(cs.t)}</div></div><div class="font-bold text-[16px] mb-3 mt-4" style="font-family:var(--head)">${L(cs.q)||t('caseQ')}</div>`;
h+=opts.map((o,k)=>{let c='opt';if(sel!=null){if(k===sel)c+=k===cs.best?' ok':' bad';else c+=' dim'}return `<button class="${c}" onclick="App.pickCase(${k})"><b>${String.fromCharCode(65+k)}.</b> ${o}</button>`}).join('');
if(sel!=null)h+=`<div class="expl ${sel===cs.best?'ok':'bad'} mt-1"><b>${sel===cs.best?'🏆 '+t('caseBest'):'🤔 '+t('casePartial')}</b><br>${fb[sel]}</div>`;
if(sel===cs.best)h+=`<button class="btn w-full mt-4" onclick="App.sub('refl')">💭 ${t('reflection')} →</button>`;
$('#sheetBody').innerHTML=wrap(h,false)}
function pickCase(k){const m=findMod(M.id);caseSel[m.id]=k;if(k===m.cs.best){Snd.success();notif('success');if(S.cases[m.id]==null){S.cases[m.id]=k;save();addXP(25,t('case'))}}else{Snd.error();notif('warning')}modCase(m)}
function modRefl(m){$('#sheetBody').innerHTML=wrap(`<div class="text-[13px] hint mb-3 leading-relaxed">💡 ${t('reflHint')}</div>`+m.rf.map((r,i)=>{const key=m.id+'_'+i,v=S.refl[key]||{};return `<div class="card p-4 mb-3"><div class="font-bold mb-3 leading-snug">💭 ${L(r)}</div><textarea id="rf_${i}" class="ta" rows="5" oninput="App.rIn(${i})">${esc(v.txt||'')}</textarea><div class="flex items-center justify-between mt-2"><span class="text-[12px] hint" id="rfc_${i}">${(v.txt||'').length} ${t('chars')}</span><button class="btn btn-sm" onclick="App.saveRefl(${i})">${v.x?'✓ '+t('saved'):t('save')+' · +15 XP'}</button></div></div>`}).join(''))}
function rIn(i){const el=$('#rf_'+i);$('#rfc_'+i).textContent=el.value.length+' '+t('chars')}
function saveRefl(i){const m=findMod(M.id);const key=m.id+'_'+i;const txt=$('#rf_'+i).value.trim();if(txt.length<60){toast('✍️ '+t('minChars'));Snd.error();return}const v=S.refl[key]||{};const first=!v.x;S.refl[key]={txt,x:1};save();Snd.success();if(first)addXP(15,t('reflection'));else toast('✓ '+t('saved'));modRefl(m)}

function openCert(id){const x=SHOP.find(s=>s.id===id);Snd.open();openModal(`<div class="text-center"><div class="font-extrabold text-[18px] mb-3" style="font-family:var(--head)">${x.icon} ${L(x.t)}</div><div class="rounded-2xl overflow-hidden shadow-lg" style="background:#fffdf6">${certSVG(x)}</div>${!S.name?`<div class="text-[12.5px] hint mt-3">✍️ ${t('namePh')} → ${t('profile')}</div>`:''}<div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-ghost" onclick="App.closeModal()">${t('close')}</button><button class="btn" onclick="App.dlCert('${id}')">⬇️ ${t('download')}</button></div></div>`)}
function dlCert(id){const x=SHOP.find(s=>s.id===id);try{const b=new Blob([certSVG(x)],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='_'+id+'.svg';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);Snd.coin()}catch(e){toast('⚠️ Download error')}}

/* ================= PROFILE VIEW ================= */
function renderProfile(){const i=rankIdx(),nx=RANKS[i+1];const p=nx?(S.xp-RANKS[i][0])/(nx[0]-RANKS[i][0]):1;const acc=S.qTotal?Math.round(S.qCorrect/S.qTotal*100):0;const tests=Object.keys(S.qbest).length;
const nm=S.name||t('student');
$('#view').innerHTML=`
<div class="card p-5 mb-4 text-center"><div class="w-20 h-20 mx-auto rounded-full grad grid place-items-center text-[32px] font-extrabold" style="color:var(--on);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)">${esc(nm.trim().charAt(0).toUpperCase()||'🎓')}</div>
<div class="font-extrabold text-[20px] mt-3" style="font-family:var(--head)">${esc(nm)}</div><div class="mt-1 font-semibold gtext">${RANKS[i][3]} ${rankName(i)}</div>
<div class="mt-4 text-left"><div class="flex justify-between text-[12.5px] hint font-semibold mb-1.5"><span>⭐ ${S.xp} XP</span><span>${nx?(nx[0]-S.xp)+' XP '+t('toNext'):t('maxRank')}</span></div><div class="pbar"><div style="width:${p*100}%"></div></div></div>
<input class="inp mt-4 text-center" placeholder="✍️ ${t('namePh')}" value="${esc(S.name)}" onchange="App.setName(this.value)"></div>
<div class="grid grid-cols-4 gap-2 mb-4">${[['📖',countRead()+'/'+allMods().length,t('readN')],['✅',tests,t('tests')],['🎯',acc+'%',t('accuracy')],['🔥',S.streak,t('streak')]].map(s=>`<div class="card p-3 text-center"><div class="text-xl">${s[0]}</div><div class="font-extrabold text-[16px] mt-1">${s[1]}</div><div class="text-[10.5px] hint font-semibold leading-tight mt-0.5">${s[2]}</div></div>`).join('')}</div>
<div class="card p-5 mb-4"><div class="font-bold mb-3" style="font-family:var(--head)">🏛 ${t('ranks')}</div>${RANKS.map((r,k)=>`<div class="flex items-center gap-3 py-2 ${k?'border-t':''}" style="border-color:var(--sep);opacity:${k<=i?1:.5}"><div class="text-xl w-8 text-center">${r[3]}</div><div class="flex-1 font-semibold text-[14.5px]">${rankName(k)}</div><div class="text-[12px] hint font-semibold">${r[0]} XP</div><div class="w-5 text-center">${k<i?'✅':k===i?'📍':'🔒'}</div></div>`).join('')}</div>
<div class="card p-5 mb-4"><div class="flex items-center justify-between mb-3"><div class="font-bold" style="font-family:var(--head)">🏅 ${t('ach')}</div><span class="chip acc">${S.ach.length}/${ACH.length}</span></div><div class="grid grid-cols-3 sm:grid-cols-4 gap-2">${ACH.map(a=>{const on=S.ach.indexOf(a[0])>=0;return `<div class="card2 p-3 text-center" style="opacity:${on?1:.45}"><div class="text-[28px]" style="filter:${on?'none':'grayscale(1)'}">${a[1]}</div><div class="text-[12px] font-bold mt-1 leading-tight">${L(a[2])}</div><div class="text-[10.5px] hint mt-1 leading-tight">${L(a[3])}</div></div>`}).join('')}</div></div>
<div class="card p-2 mb-4">
${setRow('🔊',t('sound'),`<button class="sw ${S.sound?'on':''}" onclick="App.toggleSound()"></button>`)}
${setRow('🌙',t('dark'),`<button class="sw ${isDark()?'on':''}" onclick="App.mode()"></button>`)}
${setRow('🌐',t('lang'),`<div class="langsw"><button class="${S.lang==='ru'?'on':''}" onclick="App.setLang('ru')">🇷🇺 Русский</button><button class="${S.lang==='uz'?'on':''}" onclick="App.setLang('uz')">🇺🇿 Oʻzbekcha</button></div>`)}
${setRow('🎨',t('cThemes'),`<button class="btn btn-sm btn-ghost" onclick="App.shopCat('theme');App.go('shop')">${L((SHOP.find(s=>s.id===S.skin)||SHOP[0]).t)} →</button>`)}
</div>
<div class="card p-5 mb-4"><div class="font-bold mb-2" style="font-family:var(--head)">ℹ️ ${t('about')}</div><p class="text-[13.5px] hint leading-relaxed">${t('aboutText')}</p><div class="mt-3 pt-3 border-t" style="border-color:var(--sep)"><div class="text-[12px] font-bold mb-2">${S.lang==='uz'?'OʻQUV NATIJALARI':'РЕЗУЛЬТАТЫ ОБУЧЕНИЯ'}</div><ul class="text-[12.5px] leading-relaxed list-disc pl-4 hint"><li>${S.lang==='uz'?'Uzluksiz taʼlim tushunchalari va nazariyalarini izohlash':'Объяснять ключевые понятия и теории непрерывного образования'}</li><li>${S.lang==='uz'?'Taʼlim siyosati va qonunchilikni dalillar asosida tahlil qilish':'Анализировать образовательную политику и нормативные положения на основе доказательств'}</li><li>${S.lang==='uz'?'Keysda muammoni aniqlash, yechimlarni taqqoslash va asoslash':'Выявлять проблему в кейсе, сравнивать решения и аргументировать выбор'}</li><li>${S.lang==='uz'?'Manbalarga tayangan akademik xulosa va refleksiya yozish':'Формулировать академические выводы и рефлексию с опорой на источники'}</li></ul><div class="text-[12px] font-bold mt-3 mb-1">${S.lang==='uz'?'TAVSIYA ETILGAN OʻRGANISH TARTIBI':'РЕКОМЕНДУЕМЫЙ ПОРЯДОК РАБОТЫ'}</div><p class="text-[12.5px] leading-relaxed hint">${S.lang==='uz'?'Maʼruzani oʻqing → atamalarni takrorlang → testni bajaring → keysni tahlil qiling → refleksiya yozing.':'Изучите лекцию → повторите термины → выполните тест → разберите кейс → напишите рефлексию.'}</p><div class="text-[11.5px] hint mt-2">${S.lang==='uz'?'Akademik halollik: manbalarni koʻrsating; SI vositalaridan foydalansangiz, buni ochiq qayd eting.':'Академическая добросовестность: указывайте источники; использование ИИ-инструментов открыто отмечайте.'}</div></div></div>
<button class="btn btn-ghost w-full mb-4" style="color:var(--bad)" onclick="App.reset()">🗑 ${t('reset')}</button>`}
const setRow=(ic,l,c)=>`<div class="flex items-center gap-3 px-3 py-3"><div class="text-xl">${ic}</div><div class="flex-1 font-semibold text-[14.5px]">${l}</div>${c}</div>`;

/* ================= ACTIONS ================= */
function setLang(l){if(S.lang===l)return;S.lang=l;S.langSwitch++;save();Snd.flip();hap('medium');rerender();checkAch()}
function mode(){S.mode=isDark()?'light':'dark';save();Snd.click();rerender()}
function toggleSound(){S.sound=!S.sound;save();if(S.sound)Snd.success();renderProfile()}
function setName(v){S.name=v.trim().slice(0,40);save();renderProfile();toast('✓ '+t('saved'))}
function reset(){if(tg&&tg.initData&&tg.showConfirm){try{tg.showConfirm(t('resetQ'),ok=>{if(ok)doReset()});return}catch(e){}}if(confirm(t('resetQ')))doReset()}
function doReset(){const lang=S.lang;S=JSON.parse(JSON.stringify(DEF));S.lang=lang;S.last=new Date().toISOString().slice(0,10);S.streak=1;save();caseSel={};rerender();toast('↻ OK')}
function daily(){const d=new Date(),today=d.toISOString().slice(0,10);if(S.last===today)return;const y=new Date(d-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=today;S.coins+=10;save();setTimeout(()=>{toast(`🔥 ${t('daily')}: +10 ${t('coins')} · ${t('streak')}: ${S.streak}`);Snd.coin()},900)}

function init(){applyTheme();daily();renderHeader();renderNav();go('lectures',true);
$('#sheetBody').addEventListener('scroll',onSheetScroll,{passive:true});
if(tg){try{tg.ready();tg.expand();if(tg.initData){tg.onEvent('themeChanged',()=>{if(!S.mode)rerender()});tg.BackButton.onClick(back)}const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u&&!S.name){S.name=[u.first_name,u.last_name].filter(Boolean).join(' ');save()}}catch(e){}}
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!S.mode)rerender()})}catch(e){}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,summary,.flip');if(b&&!b.disabled&&!b.classList.contains('opt'))Snd.click()},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')back()});
setTimeout(checkAch,1500)}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();

return{go,open:openModule,sub:setSub,readDone,flip:el=>{el.classList.toggle('on');Snd.flip();hap('light')},startModQuiz,pick,next,retry,openExam,startExam,startLawQuiz,pickCase,rIn,saveRefl,
lawTab:k=>{lawTab=k;lawQ='';renderLaws()},lawSearch:v=>{lawQ=v.trim();renderLawList()},lawOpen,shopCat:c=>{shopCat=c;if(cur==='shop')renderShop()},buy,use,csDone,dlCert,
setLang,mode,toggleSound,setName,reset,closeSheet,closeModal};
})();
</script>
