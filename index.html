title:['Дошкольное, общее среднее и профессиональное образование: состояние, проблемы, пути развития','Maktabgacha, umumiy oʻrta va professional taʼlim: holati, muammolari, rivojlanish yoʻllari'],
sub:['Реформы 2017–2025 гг., концепции до 2030 года, трёхуровневое профессиональное образование, дуальное обучение','2017–2025-yillardagi islohotlar, 2030-yilgacha konsepsiyalar, uch bosqichli professional taʼlim, dual taʼlim'],
sec:[
{h:['Дошкольное образование: фундамент непрерывности','Maktabgacha taʼlim: uzluksizlik poydevori'],b:[`<p>Исследования лауреата Нобелевской премии <b>Джеймса Хекмана</b> показали: инвестиции в раннее детство дают наибольшую экономическую и социальную отдачу («кривая Хекмана»). Именно в 0–6 лет формируются когнитивные, речевые и социально-эмоциональные основы дальнейшего обучения.</p><h4>Реформы в Узбекистане</h4><ul><li><b>2017</b> — создано Министерство дошкольного образования (в 2023 г. функции объединены в Министерстве дошкольного и школьного образования).</li><li><b>2019</b> — принят Закон <b>«О дошкольном образовании и воспитании»</b> и утверждена <b>Концепция развития системы дошкольного образования до 2030 года</b>.</li><li>Внедрена Государственная учебная программа <b>«Илк қадам» («Первый шаг»)</b>, ориентированная на развитие ребёнка через игру и деятельность.</li><li>ЗРУ-637 установил <b>обязательную одногодичную подготовку детей к начальному образованию</b> (с 6 лет).</li><li>Активно развиваются <b>негосударственные ДОО и государственно-частное партнёрство</b>, семейные детские сады.</li></ul><p>Благодаря этим мерам охват детей дошкольным образованием вырос многократно: если в 2017 г. он составлял менее трети детей соответствующего возраста, то к середине 2020-х гг. — по официальным данным — превысил 70%.</p><h4>Проблемы</h4><p>Неравномерность охвата между городом и селом, дефицит квалифицированных воспитателей, вопросы качества в быстро растущем частном секторе, инклюзия детей с особыми потребностями.</p>`,`<p>Nobel mukofoti laureati <b>Jeyms Xekman</b> tadqiqotlari koʻrsatdi: erta bolalikka investitsiyalar eng yuqori iqtisodiy va ijtimoiy qaytim beradi («Xekman egri chizigʻi»). Aynan 0–6 yoshda keyingi taʼlimning kognitiv, nutqiy va ijtimoiy-emotsional asoslari shakllanadi.</p><h4>Oʻzbekistondagi islohotlar</h4><ul><li><b>2017</b> — Maktabgacha taʼlim vazirligi tashkil etildi (2023-yilda vazifalar Maktabgacha va maktab taʼlimi vazirligida birlashtirildi).</li><li><b>2019</b> — <b>«Maktabgacha taʼlim va tarbiya toʻgʻrisida»</b>gi Qonun qabul qilindi va <b>Maktabgacha taʼlim tizimini 2030-yilgacha rivojlantirish konsepsiyasi</b> tasdiqlandi.</li><li>Bolani oʻyin va faoliyat orqali rivojlantirishga yoʻnaltirilgan <b>«Ilk qadam»</b> Davlat oʻquv dasturi joriy etildi.</li><li>OʻRQ-637 <b>bolalarni boshlangʻich taʼlimga majburiy bir yillik tayyorlashni</b> (6 yoshdan) belgiladi.</li><li><b>Nodavlat MTTlar va davlat-xususiy sheriklik</b>, oilaviy bogʻchalar faol rivojlanmoqda.</li></ul><p>Ushbu choralar tufayli bolalarni maktabgacha taʼlim bilan qamrab olish bir necha barobar oshdi: 2017-yilda u tegishli yoshdagi bolalarning uchdan biridan kamini tashkil etgan boʻlsa, 2020-yillar oʻrtasiga kelib — rasmiy maʼlumotlarga koʻra — 70% dan oshdi.</p><h4>Muammolar</h4><p>Shahar va qishloq oʻrtasidagi qamrov notekisligi, malakali tarbiyachilar tanqisligi, tez oʻsayotgan xususiy sektorda sifat masalalari, alohida ehtiyojli bolalar inklyuziyasi.</p>`]},
{h:['Общее среднее образование: модернизация школы','Umumiy oʻrta taʼlim: maktabni modernizatsiya qilish'],b:[`<p>В Узбекистане действует <b>обязательное 11-летнее общее среднее образование</b>, бесплатное в государственных школах. В 2017 г. страна вернулась к модели 11-летней школы, отказавшись от схемы «9 лет школы + 3 года академического лицея/колледжа» как обязательной.</p><h4>Ключевые направления реформ</h4><ul><li><b>Концепция развития системы народного образования до 2030 года</b> (2019) — ориентир на вхождение в число ведущих стран по результатам PISA.</li><li><b>Новая национальная учебная программа</b> и учебники нового поколения с компетентностным подходом, усиление математики, естественных наук, иностранных языков, IT.</li><li>Сеть специализированных школ: <b>Президентские школы</b> (в партнёрстве с Cambridge Assessment International Education), <b>творческие школы</b>, школы имени Мухаммада аль-Хорезми, специализированные школы по углублённому изучению предметов.</li><li><b>Повышение статуса и зарплат учителей</b>, надбавки за международные сертификаты, система аттестации; принятие <b>ЗРУ-901 «О статусе педагога»</b> (2024).</li><li>Участие в международных исследованиях: <b>PIRLS 2021, PISA 2022</b>, TIMSS.</li></ul><h4>Проблемы</h4><ul><li>Переполненность школ и многосменность в быстрорастущих районах;</li><li>Разрыв в качестве между городскими и сельскими школами;</li><li>Дефицит учителей отдельных предметов (математика, физика, информатика, иностранные языки);</li><li>Низкие результаты функциональной грамотности (PISA-2022) — сигнал к переходу от заучивания к применению знаний.</li></ul>`,`<p>Oʻzbekistonda davlat maktablarida bepul boʻlgan <b>majburiy 11 yillik umumiy oʻrta taʼlim</b> amal qiladi. 2017-yilda mamlakat «9 yil maktab + 3 yil akademik litsey/kollej» sxemasini majburiy sifatida bekor qilib, 11 yillik maktab modeliga qaytdi.</p><h4>Islohotlarning asosiy yoʻnalishlari</h4><ul><li><b>Xalq taʼlimi tizimini 2030-yilgacha rivojlantirish konsepsiyasi</b> (2019) — PISA natijalari boʻyicha yetakchi mamlakatlar qatoriga kirishga moʻljal.</li><li>Kompetensiyaviy yondashuvga asoslangan <b>yangi milliy oʻquv dasturi</b> va yangi avlod darsliklari, matematika, tabiiy fanlar, xorijiy tillar, IT ni kuchaytirish.</li><li>Ixtisoslashtirilgan maktablar tarmogʻi: <b>Prezident maktablari</b> (Cambridge Assessment International Education bilan hamkorlikda), <b>ijod maktablari</b>, Muhammad al-Xorazmiy nomidagi maktablar, fanlarni chuqurlashtirib oʻrganishga ixtisoslashgan maktablar.</li><li><b>Oʻqituvchilar maqomi va maoshini oshirish</b>, xalqaro sertifikatlar uchun ustamalar, attestatsiya tizimi; <b>OʻRQ-901 «Pedagog maqomi toʻgʻrisida»</b>gi Qonunning qabul qilinishi (2024).</li><li>Xalqaro tadqiqotlarda ishtirok: <b>PIRLS 2021, PISA 2022</b>, TIMSS.</li></ul><h4>Muammolar</h4><ul><li>Tez oʻsayotgan hududlarda maktablarning gavjumligi va koʻp smenalik;</li><li>Shahar va qishloq maktablari oʻrtasidagi sifat tafovuti;</li><li>Ayrim fanlar (matematika, fizika, informatika, xorijiy tillar) oʻqituvchilari tanqisligi;</li><li>Funksional savodxonlikning past natijalari (PISA-2022) — yodlashdan bilimlarni qoʻllashga oʻtish signali.</li></ul>`]},
{h:['Профессиональное образование: трёхуровневая модель','Professional taʼlim: uch bosqichli model'],b:[`<p>С 2019–2020 гг. в Узбекистане сформирована новая система профессионального образования, закреплённая в ЗРУ-637. Она включает <b>три уровня</b>:</p><div class="kv"><div><b>Начальное профессиональное</b>Профессиональные школы — на базе 9 классов, 2 года, рабочие профессии; бесплатно.</div><div><b>Среднее профессиональное</b>Колледжи — на базе 11 классов, до 2 лет, специалисты среднего звена.</div><div><b>Среднее специальное профессиональное</b>Техникумы — на базе 11 классов, 2–3 года, более сложные квалификации, тесная связь с отраслями.</div></div><h4>Механизмы модернизации</h4><ul><li><b>Дуальное обучение</b> — до 60–80% времени практика на предприятии (по образцу Германии, Швейцарии);</li><li><b>Профессиональные стандарты</b> и <b>Национальная рамка квалификаций</b>;</li><li>Центры профессиональной подготовки и переподготовки безработных («Ishga marhamat» и др.);</li><li>Участие в движении <b>WorldSkills</b>;</li><li>Партнёрство с работодателями при разработке программ и оценке квалификаций;</li><li>Краткосрочные курсы для взрослых — элемент непрерывного образования.</li></ul><h4>Проблемы</h4><p>Низкий престиж рабочих профессий («дипломомания»), устаревшая материально-техническая база части учреждений, недостаточная мотивация работодателей к участию в обучении, нехватка мастеров производственного обучения с актуальным опытом.</p>`,`<p>2019–2020-yillardan boshlab Oʻzbekistonda OʻRQ-637 da mustahkamlangan professional taʼlimning yangi tizimi shakllantirildi. U <b>uch bosqichni</b> oʻz ichiga oladi:</p><div class="kv"><div><b>Boshlangʻich professional</b>Kasb-hunar maktablari — 9-sinf negizida, 2 yil, ishchi kasblar; bepul.</div><div><b>Oʻrta professional</b>Kollejlar — 11-sinf negizida, 2 yilgacha, oʻrta boʻgʻin mutaxassislari.</div><div><b>Oʻrta maxsus professional</b>Texnikumlar — 11-sinf negizida, 2–3 yil, murakkabroq malakalar, tarmoqlar bilan yaqin aloqa.</div></div><h4>Modernizatsiya mexanizmlari</h4><ul><li><b>Dual taʼlim</b> — vaqtning 60–80% gacha korxonada amaliyot (Germaniya, Shveytsariya namunasida);</li><li><b>Kasb standartlari</b> va <b>Milliy malaka ramkasi</b>;</li><li>Ishsizlarni kasbga tayyorlash va qayta tayyorlash markazlari («Ishga marhamat» va boshqalar);</li><li><b>WorldSkills</b> harakatida ishtirok;</li><li>Dasturlarni ishlab chiqish va malakalarni baholashda ish beruvchilar bilan sheriklik;</li><li>Kattalar uchun qisqa muddatli kurslar — uzluksiz taʼlim elementi.</li></ul><h4>Muammolar</h4><p>Ishchi kasblar nufuzining pastligi («diplomomaniya»), ayrim muassasalarning eskirgan moddiy-texnik bazasi, ish beruvchilarning taʼlimda ishtirok etishga motivatsiyasi yetarli emasligi, dolzarb tajribaga ega ishlab chiqarish taʼlimi ustalarining yetishmasligi.</p>`]},
{h:['Мировые тенденции: от раннего детства до профессий будущего','Jahon tendensiyalari: erta bolalikdan kelajak kasblarigacha'],b:[`<ul><li><b>ECEC (Early Childhood Education and Care)</b>: ОЭСР («Starting Strong») и ЕС делают акцент на качестве, а не только на охвате; ключевой фактор — квалификация воспитателей.</li><li><b>STEAM и проектное обучение</b>: интеграция естественных наук, технологий, инженерии, искусства и математики.</li><li><b>Инклюзивное образование</b>: Саламанкская декларация ЮНЕСКО (1994) — обучение детей с особыми потребностями в общих школах.</li><li><b>Опыт Финляндии</b>: начало систематического обучения с 7 лет, высокий статус учителя (обязательная магистратура), минимум тестирования.</li><li><b>Опыт Сингапура и Южной Кореи</b>: высокая требовательность, системная подготовка учителей, ориентация на математику и науку.</li><li><b>Дуальная система Германии и Швейцарии</b>: около половины молодёжи выбирает профессиональный трек, что обеспечивает низкую безработицу среди молодёжи.</li><li><b>Центры профессионального мастерства (CoVE)</b> в ЕС — интеграция колледжей, бизнеса и исследований.</li></ul>`,`<ul><li><b>ECEC (Early Childhood Education and Care)</b>: IHTT («Starting Strong») va YeI faqat qamrovga emas, sifatga urgʻu beradi; asosiy omil — tarbiyachilar malakasi.</li><li><b>STEAM va loyihaviy taʼlim</b>: tabiiy fanlar, texnologiya, muhandislik, sanʼat va matematikani integratsiyalash.</li><li><b>Inklyuziv taʼlim</b>: YUNESKOning Salamanka deklaratsiyasi (1994) — alohida ehtiyojli bolalarni umumiy maktablarda oʻqitish.</li><li><b>Finlyandiya tajribasi</b>: tizimli taʼlim 7 yoshdan boshlanadi, oʻqituvchining yuqori maqomi (majburiy magistratura), testlar minimal.</li><li><b>Singapur va Janubiy Koreya tajribasi</b>: yuqori talabchanlik, oʻqituvchilarni tizimli tayyorlash, matematika va fanga yoʻnalganlik.</li><li><b>Germaniya va Shveytsariyaning dual tizimi</b>: yoshlarning qariyb yarmi professional trekni tanlaydi, bu yoshlar orasida ishsizlik past boʻlishini taʼminlaydi.</li><li>YeIdagi <b>Kasbiy mahorat markazlari (CoVE)</b> — kollejlar, biznes va tadqiqotlar integratsiyasi.</li></ul>`]},
{h:['Пути развития: преемственность ступеней','Rivojlanish yoʻllari: bosqichlar izchilligi'],b:[`<p>Главный вызов для Узбекистана — обеспечить не только рост охвата каждой ступени, но и <b>преемственность между ними</b>, чтобы образовательная траектория человека не имела «разрывов» и «тупиков».</p><ol><li><b>Детский сад → школа</b>: согласование программ «Илк қадам» и начальной школы, обязательная подготовительная группа.</li><li><b>Школа → профессия/вуз</b>: профориентация с 7–8 классов, профильное обучение в старших классах, «мостики» между профшколами, колледжами и вузами.</li><li><b>Профобразование → высшее</b>: зачёт результатов обучения, сокращённые программы бакалавриата для выпускников техникумов.</li><li><b>Образование → рынок труда → переподготовка</b>: Национальная рамка квалификаций, признание неформального обучения, микроквалификации.</li><li><b>Педагог как ключевое звено</b>: непрерывное профессиональное развитие, наставничество для молодых учителей (закреплено в ЗРУ-901).</li></ol><div class="note">🎯 Итог: каждая ступень — это не изолированный «остров», а звено единой цепи непрерывного образования. Слабость одного звена (например, низкое качество дошкольного образования) снижает эффективность всех последующих.</div>`,`<p>Oʻzbekiston uchun asosiy chaqiriq — har bir bosqich qamrovini oshirishgina emas, balki inson taʼlim trayektoriyasida «uzilishlar» va «berk koʻchalar» boʻlmasligi uchun <b>ular oʻrtasidagi izchillikni</b> taʼminlash.</p><ol><li><b>Bogʻcha → maktab</b>: «Ilk qadam» va boshlangʻich maktab dasturlarini muvofiqlashtirish, majburiy tayyorlov guruhi.</li><li><b>Maktab → kasb/OTM</b>: 7–8-sinflardan kasbga yoʻnaltirish, yuqori sinflarda ixtisoslashtirilgan taʼlim, kasb-hunar maktablari, kollejlar va OTMlar oʻrtasida «koʻprikchalar».</li><li><b>Professional taʼlim → oliy taʼlim</b>: taʼlim natijalarini hisobga olish, texnikum bitiruvchilari uchun qisqartirilgan bakalavriat dasturlari.</li><li><b>Taʼlim → mehnat bozori → qayta tayyorlash</b>: Milliy malaka ramkasi, noformal taʼlimni tan olish, mikromalakalar.</li><li><b>Pedagog asosiy boʻgʻin sifatida</b>: uzluksiz kasbiy rivojlanish, yosh oʻqituvchilar uchun ustozlik (OʻRQ-901 da mustahkamlangan).</li></ol><div class="note">🎯 Xulosa: har bir bosqich alohida «orol» emas, balki uzluksiz taʼlimning yagona zanjiridagi halqa. Bitta halqaning zaifligi (masalan, maktabgacha taʼlimning past sifati) keyingi barcha bosqichlar samaradorligini pasaytiradi.</div>`]}
],

cs:{t:[`<p>В быстрорастущем махалле школа на 1 200 мест обучает 2 300 учеников в три смены. Ближайший детский сад охватывает лишь 40% детей. Родители недовольны, учителя перегружены. Хокимият района располагает ограниченным бюджетом, но местный предприниматель готов инвестировать в образование.</p>`,`<p>Tez oʻsayotgan mahallada 1 200 oʻrinli maktab 2 300 oʻquvchini uch smenada oʻqitmoqda. Eng yaqin bogʻcha bolalarning faqat 40 foizini qamrab oladi. Ota-onalar norozi, oʻqituvchilar haddan tashqari band. Tuman hokimligi byudjeti cheklangan, ammo mahalliy tadbirkor taʼlimga sarmoya kiritishga tayyor.</p>`],

best:1,fb:[['Четвёртая смена разрушает режим дня и снижает качество обучения.','Оптимально: ГЧП — ключевой инструмент расширения инфраструктуры в Узбекистане; семейные сады быстро увеличивают охват.','Это создаёт транспортные проблемы и переносит нагрузку на соседей.','Сокращение уроков снижает время обучения и качество.'],['Toʻrtinchi smena kun tartibini buzadi va taʼlim sifatini pasaytiradi.','Eng maqbul: DXSh — Oʻzbekistonda infratuzilmani kengaytirishning asosiy vositasi; oilaviy bogʻchalar qamrovni tez oshiradi.','Bu transport muammolarini keltirib chiqaradi va yukni qoʻshnilarga oʻtkazadi.','Darslarni qisqartirish taʼlim vaqti va sifatini kamaytiradi.']]},

title:['Модернизация высшего образования и Болонский процесс: опыт Германии, Франции и мировая практика','Oliy taʼlimni modernizatsiya qilish va Boloniya jarayoni: Germaniya, Fransiya tajribasi va jahon amaliyoti'],
sub:['ЕПВО, ECTS, три цикла, ESG, Exzellenzstrategie, реформа LMD, рейтинги QS/THE/ARWU, реформы в Узбекистане','YOTM, ECTS, uch sikl, ESG, Exzellenzstrategie, LMD islohoti, QS/THE/ARWU reytinglari, Oʻzbekistondagi islohotlar'],
sec:[
{h:['История Болонского процесса','Boloniya jarayoni tarixi'],b:[`<p><b>Болонский процесс</b> — межправительственный процесс сближения и гармонизации систем высшего образования европейских стран с целью создания единого <b>Европейского пространства высшего образования (ЕПВО, EHEA)</b>.</p><ul><li><b>1988</b> — <b>Великая хартия университетов</b> (Magna Charta Universitatum) в Болонье: академическая свобода и автономия.</li><li><b>1998</b> — <b>Сорбоннская декларация</b> министров Франции, Германии, Италии и Великобритании.</li><li><b>1999</b> — <b>Болонская декларация</b>, подписанная министрами <b>29 стран</b>.</li><li><b>2003, Берлин</b> — докторантура признана <b>третьим циклом</b>.</li><li><b>2005, Берген</b> — приняты Стандарты и рекомендации по обеспечению качества (<b>ESG</b>) и рамка квалификаций ЕПВО.</li><li><b>2010, Будапешт–Вена</b> — официальный запуск ЕПВО.</li><li><b>2015, Ереван</b> — обновлённые ESG; <b>2018, Париж</b>; <b>2020, Рим</b> — акцент на инклюзивность, инновации, взаимосвязанность; <b>2024, Тирана</b>.</li></ul><p>Сегодня в ЕПВО <b>49 стран-участниц</b> (участие России и Беларуси приостановлено в 2022 г.) и Европейская комиссия. Процесс не является наднациональным правом — это добровольное согласование политики.</p>`,`<p><b>Boloniya jarayoni</b> — yagona <b>Yevropa oliy taʼlim makonini (YOTM, EHEA)</b> yaratish maqsadida Yevropa mamlakatlari oliy taʼlim tizimlarini yaqinlashtirish va uygʻunlashtirishning hukumatlararo jarayoni.</p><ul><li><b>1988</b> — Boloniyada <b>Universitetlarning Buyuk xartiyasi</b> (Magna Charta Universitatum): akademik erkinlik va avtonomiya.</li><li><b>1998</b> — Fransiya, Germaniya, Italiya va Buyuk Britaniya vazirlarining <b>Sorbonna deklaratsiyasi</b>.</li><li><b>1999</b> — <b>29 ta mamlakat</b> vazirlari imzolagan <b>Boloniya deklaratsiyasi</b>.</li><li><b>2003, Berlin</b> — doktorantura <b>uchinchi sikl</b> sifatida tan olindi.</li><li><b>2005, Bergen</b> — Sifatni taʼminlash standartlari va tavsiyalari (<b>ESG</b>) hamda YOTM malaka ramkasi qabul qilindi.</li><li><b>2010, Budapesht–Vena</b> — YOTM rasman ishga tushirildi.</li><li><b>2015, Yerevan</b> — yangilangan ESG; <b>2018, Parij</b>; <b>2020, Rim</b> — inklyuzivlik, innovatsiyalar, oʻzaro bogʻliqlikka urgʻu; <b>2024, Tirana</b>.</li></ul><p>Bugungi kunda YOTMda <b>49 ta ishtirokchi mamlakat</b> (Rossiya va Belarus ishtiroki 2022-yilda toʻxtatilgan) va Yevropa komissiyasi bor. Jarayon davlatlardan yuqori huquq emas — bu siyosatni ixtiyoriy muvofiqlashtirish.</p>`]},
{h:['Инструменты Болонского процесса','Boloniya jarayoni vositalari'],b:[`<div class="kv"><div><b>Три цикла</b>Бакалавриат (180–240 ECTS) → магистратура (60–120 ECTS) → докторантура.</div><div><b>ECTS</b>Европейская система перевода и накопления кредитов: 60 кредитов = 1 учебный год; 1 кредит ≈ 25–30 часов работы студента.</div><div><b>Diploma Supplement</b>Приложение к диплому единого европейского образца — облегчает признание.</div><div><b>ESG и EQAR</b>Стандарты качества и реестр агентств по обеспечению качества.</div></div><ul><li><b>Лиссабонская конвенция о признании</b> (1997, Совет Европы и ЮНЕСКО) — правовая основа признания квалификаций.</li><li><b>Рамка квалификаций ЕПВО (QF-EHEA)</b> и <b>дескрипторы Дублина</b> — описание результатов обучения для каждого цикла.</li><li><b>Мобильность</b> — программа ЕС <b>Erasmus+</b>; цель — 20% выпускников с опытом обучения за рубежом.</li><li><b>Студентоцентрированное обучение</b> и ориентация на результаты обучения (learning outcomes).</li><li><b>Социальное измерение</b> — равный доступ к высшему образованию.</li><li><b>Обучение через всю жизнь</b> — признание предшествующего обучения, гибкие траектории.</li></ul>`,`<div class="kv"><div><b>Uch sikl</b>Bakalavriat (180–240 ECTS) → magistratura (60–120 ECTS) → doktorantura.</div><div><b>ECTS</b>Yevropa kreditlarni koʻchirish va toʻplash tizimi: 60 kredit = 1 oʻquv yili; 1 kredit ≈ talabaning 25–30 soatlik ishi.</div><div><b>Diploma Supplement</b>Yagona Yevropa namunasidagi diplom ilovasi — tan olishni osonlashtiradi.</div><div><b>ESG va EQAR</b>Sifat standartlari va sifatni taʼminlash agentliklari reyestri.</div></div><ul><li><b>Tan olish toʻgʻrisidagi Lissabon konvensiyasi</b> (1997, Yevropa Kengashi va YUNESKO) — malakalarni tan olishning huquqiy asosi.</li><li><b>YOTM malaka ramkasi (QF-EHEA)</b> va <b>Dublin deskriptorlari</b> — har bir sikl uchun taʼlim natijalari tavsifi.</li><li><b>Mobillik</b> — YeIning <b>Erasmus+</b> dasturi; maqsad — bitiruvchilarning 20 foizi xorijda oʻqish tajribasiga ega boʻlishi.</li><li><b>Talabaga yoʻnaltirilgan taʼlim</b> va taʼlim natijalariga (learning outcomes) yoʻnalganlik.</li><li><b>Ijtimoiy oʻlchov</b> — oliy taʼlimdan teng foydalanish.</li><li><b>Butun umr davomida taʼlim</b> — oldingi taʼlimni tan olish, moslashuvchan trayektoriyalar.</li></ul>`]},
{h:['Опыт Германии','Germaniya tajribasi'],b:[`<p>Германия — родина <b>гумбольдтовской модели университета</b> (1810, Берлинский университет): единство исследований и преподавания, академическая свобода. Болонские реформы стали для страны глубокой трансформацией.</p><ul><li><b>Переход от Diplom и Magister</b> к двухуровневой системе Bachelor/Master (в основном завершён к 2010-м; государственные экзамены сохранены для медицины, права, педагогики в ряде земель).</li><li><b>Бинарная система</b>: классические <b>университеты</b> (исследовательский профиль, право присуждения докторской степени) и <b>университеты прикладных наук</b> (Fachhochschulen / HAW) с практико-ориентированным обучением.</li><li><b>Инициатива превосходства</b> (Exzellenzinitiative, 2005/06) и с 2019 г. <b>Стратегия превосходства</b> (Exzellenzstrategie): конкурсное финансирование «кластеров превосходства» и статус «университетов превосходства» (TU München, LMU, Heidelberg, RWTH Aachen и др.).</li><li><b>Аккредитация</b> программ и систем качества через Совет по аккредитации (Akkreditierungsrat).</li><li><b>Бесплатное обучение</b> в большинстве государственных вузов (с отдельными исключениями для иностранцев, например, в земле Баден-Вюртемберг).</li><li><b>Duales Studium</b> — дуальные программы бакалавриата с работой в компании.</li></ul><p>Немецкие университеты (TU München, LMU München, Heidelberg) стабильно входят в ТОП-100 рейтингов QS, THE и ARWU.</p>`,`<p>Germaniya — <b>Gumboldt universitet modeli</b>ning vatani (1810, Berlin universiteti): tadqiqot va oʻqitish birligi, akademik erkinlik. Boloniya islohotlari mamlakat uchun chuqur transformatsiya boʻldi.</p><ul><li><b>Diplom va Magisterdan</b> Bachelor/Master ikki bosqichli tizimiga oʻtish (asosan 2010-yillarga kelib yakunlangan; tibbiyot, huquq, ayrim yerlarda pedagogika uchun davlat imtihonlari saqlangan).</li><li><b>Binar tizim</b>: klassik <b>universitetlar</b> (tadqiqot profili, doktorlik darajasini berish huquqi) va amaliyotga yoʻnaltirilgan <b>amaliy fanlar universitetlari</b> (Fachhochschulen / HAW).</li><li><b>Mukammallik tashabbusi</b> (Exzellenzinitiative, 2005/06) va 2019-yildan <b>Mukammallik strategiyasi</b> (Exzellenzstrategie): «mukammallik klasterlari»ni tanlov asosida moliyalashtirish va «mukammallik universitetlari» maqomi (TU München, LMU, Heidelberg, RWTH Aachen va boshqalar).</li><li>Dasturlar va sifat tizimlarini Akkreditatsiya kengashi (Akkreditierungsrat) orqali <b>akkreditatsiya</b> qilish.</li><li>Aksariyat davlat OTMlarida <b>bepul taʼlim</b> (xorijliklar uchun ayrim istisnolar bilan, masalan, Baden-Vyurtemberg yerida).</li><li><b>Duales Studium</b> — kompaniyada ishlash bilan uygʻunlashgan dual bakalavriat dasturlari.</li></ul><p>Nemis universitetlari (TU München, LMU München, Heidelberg) QS, THE va ARWU reytinglarining TOP-100 taligiga barqaror kiradi.</p>`]},
{h:['Опыт Франции','Fransiya tajribasi'],b:[`<ul><li><b>Реформа LMD</b> (Licence — Master — Doctorat, с 2002 г.) — формула <b>«3–5–8»</b>: лиценциат за 3 года, магистр за 5, доктор за 8 лет после бакалавра (школьного выпускного экзамена baccalauréat).</li><li><b>Двойственная система</b>: открытые для всех обладателей baccalauréat <b>университеты</b> и элитные <b>Grandes Écoles</b> (École Polytechnique, École Normale Supérieure, HEC, Sciences Po) с конкурсным отбором после подготовительных классов (classes préparatoires).</li><li><b>Закон об автономии университетов</b> (LRU, «закон Пекресс», 2007) — передача вузам полномочий по бюджету, кадрам и имуществу.</li><li><b>Программы IDEX</b> (Initiatives d'excellence) и <b>слияния</b> для повышения глобальной конкурентоспособности: <b>Université Paris-Saclay</b> вошла в ТОП-20 рейтинга ARWU; объединены Université PSL, Sorbonne Université, Université Paris Cité.</li><li><b>HCERES</b> — Высший совет по оценке исследований и высшего образования, внешняя оценка качества.</li><li>Низкая плата за обучение в государственных университетах; с 2019 г. — повышенные сборы для студентов из стран вне ЕС (с многочисленными исключениями).</li></ul><div class="note">📌 Вывод: Германия и Франция показывают, что Болонские инструменты успешно сочетаются с национальными традициями (гумбольдтовский идеал, система Grandes Écoles), а политика концентрации ресурсов («превосходство», слияния) повышает международную видимость вузов.</div>`,`<ul><li><b>LMD islohoti</b> (Licence — Master — Doctorat, 2002-yildan) — <b>«3–5–8»</b> formulasi: bakalavrdan (maktab bitiruv imtihoni baccalauréat) keyin 3 yilda litsenziat, 5 yilda magistr, 8 yilda doktor.</li><li><b>Ikkiyoqlama tizim</b>: baccalauréat egalari uchun ochiq <b>universitetlar</b> va tayyorlov sinflaridan (classes préparatoires) soʻng tanlov asosida qabul qiluvchi elita <b>Grandes Écoles</b> (École Polytechnique, École Normale Supérieure, HEC, Sciences Po).</li><li><b>Universitetlar avtonomiyasi toʻgʻrisidagi qonun</b> (LRU, «Pekress qonuni», 2007) — byudjet, kadrlar va mulk boʻyicha vakolatlarni OTMlarga topshirish.</li><li>Global raqobatbardoshlikni oshirish uchun <b>IDEX dasturlari</b> (Initiatives d'excellence) va <b>birlashuvlar</b>: <b>Université Paris-Saclay</b> ARWU reytingining TOP-20 taligiga kirdi; Université PSL, Sorbonne Université, Université Paris Cité birlashtirildi.</li><li><b>HCERES</b> — Tadqiqotlar va oliy taʼlimni baholash oliy kengashi, sifatni tashqi baholash.</li><li>Davlat universitetlarida past toʻlov; 2019-yildan — YeIdan tashqari mamlakatlar talabalari uchun oshirilgan toʻlovlar (koʻplab istisnolar bilan).</li></ul><div class="note">📌 Xulosa: Germaniya va Fransiya Boloniya vositalari milliy anʼanalar (Gumboldt ideali, Grandes Écoles tizimi) bilan muvaffaqiyatli uygʻunlashishini, resurslarni jamlash siyosati («mukammallik», birlashuvlar) esa OTMlarning xalqaro koʻrinuvchanligini oshirishini koʻrsatadi.</div>`]},
{h:['Мировые рейтинги и модернизация высшего образования в Узбекистане','Jahon reytinglari va Oʻzbekistonda oliy taʼlimni modernizatsiya qilish'],b:[`<h4>Три ведущих глобальных рейтинга</h4><div class="kv"><div><b>ARWU (Шанхайский, с 2003)</b>Нобелевские премии и Филдсовские медали выпускников и сотрудников, высокоцитируемые учёные, статьи в Nature и Science, публикации в WoS.</div><div><b>QS World University Rankings</b>Академическая репутация (наибольший вес), репутация у работодателей, цитируемость, соотношение студентов и преподавателей, интернационализация, устойчивость, трудоустройство.</div><div><b>THE World University Rankings</b>Преподавание, исследовательская среда, качество исследований, международная открытость, связь с индустрией.</div></div><p>Рейтинги критикуют за перекос в сторону исследований и англоязычных публикаций, однако они стали важным инструментом глобальной конкуренции и ориентиром для образовательной политики.</p><h4>Реформы в Узбекистане</h4><ul><li><b>Концепция развития системы высшего образования до 2030 года</b> (Указ УП-5847 от 08.10.2019): поэтапный переход вузов на <b>кредитно-модульную систему</b>, гармонизированную с ECTS; цель — вхождение ведущих вузов в международные рейтинги.</li><li><b>Резкий рост охвата</b> высшим образованием — с менее 10% в 2016 г. до около 40% в середине 2020-х гг.; стратегия «Узбекистан-2030» ставит цель довести охват до <b>50%</b>.</li><li><b>Академическая и финансовая самостоятельность</b> государственных вузов (закреплена в ЗРУ-637 и последующих указах).</li><li><b>Филиалы зарубежных вузов</b>: Westminster International University in Tashkent, Inha University in Tashkent, Turin Polytechnic University in Tashkent, Webster University, MDIS, Amity и др.; совместные программы с вузами из ТОП-300.</li><li><b>Негосударственные вузы</b>, система <b>HEMIS</b>, рейтинг вузов, международная аккредитация программ.</li><li>Ряд вузов Узбекистана впервые вошёл в рейтинги QS (в т.ч. региональный QS Asia) и THE.</li></ul>`,`<h4>Uchta yetakchi global reyting</h4><div class="kv"><div><b>ARWU (Shanxay, 2003-yildan)</b>Bitiruvchi va xodimlarning Nobel mukofotlari va Filds medallari, yuqori iqtibosli olimlar, Nature va Science dagi maqolalar, WoS dagi nashrlar.</div><div><b>QS World University Rankings</b>Akademik obroʻ (eng katta vazn), ish beruvchilar orasidagi obroʻ, iqtiboslar, talaba va oʻqituvchi nisbati, baynalmilallashuv, barqarorlik, ishga joylashish.</div><div><b>THE World University Rankings</b>Oʻqitish, tadqiqot muhiti, tadqiqot sifati, xalqaro ochiqlik, sanoat bilan aloqa.</div></div><p>Reytinglar tadqiqot va ingliz tilidagi nashrlarga ogʻib ketgani uchun tanqid qilinadi, ammo ular global raqobatning muhim vositasi va taʼlim siyosati uchun moʻljalga aylandi.</p><h4>Oʻzbekistondagi islohotlar</h4><ul><li><b>Oliy taʼlim tizimini 2030-yilgacha rivojlantirish konsepsiyasi</b> (PF-5847, 08.10.2019): OTMlarni ECTS bilan uygʻunlashgan <b>kredit-modul tizimiga</b> bosqichma-bosqich oʻtkazish; maqsad — yetakchi OTMlarning xalqaro reytinglarga kirishi.</li><li>Oliy taʼlim <b>qamrovining keskin oʻsishi</b> — 2016-yildagi 10% dan kamdan 2020-yillar oʻrtasida qariyb 40% gacha; «Oʻzbekiston-2030» strategiyasi qamrovni <b>50%</b> ga yetkazishni maqsad qilgan.</li><li>Davlat OTMlarining <b>akademik va moliyaviy mustaqilligi</b> (OʻRQ-637 va keyingi farmonlarda mustahkamlangan).</li><li><b>Xorijiy OTM filiallari</b>: Toshkentdagi Westminster xalqaro universiteti, Inha universiteti, Turin politexnika universiteti, Webster universiteti, MDIS, Amity va boshqalar; TOP-300 OTMlari bilan qoʻshma dasturlar.</li><li><b>Nodavlat OTMlar</b>, <b>HEMIS</b> tizimi, OTMlar reytingi, dasturlarning xalqaro akkreditatsiyasi.</li><li>Oʻzbekistonning bir qator OTMlari ilk bor QS (jumladan, mintaqaviy QS Asia) va THE reytinglariga kirdi.</li></ul>`]}
],

cs:{t:[`<p>Региональный педагогический университет ставит цель войти в рейтинг QS Asia в течение 5 лет. Ректорат предлагает три идеи: (а) обязать всех преподавателей публиковать по 3 статьи в год в любых журналах, (б) массово привлечь иностранных студентов любой ценой, снизив требования, (в) разработать комплексную стратегию. Вам поручено подготовить рекомендации.</p>`,`<p>Hududiy pedagogika universiteti 5 yil ichida QS Asia reytingiga kirishni maqsad qilgan. Rektorat uchta gʻoyani taklif qilmoqda: (a) barcha oʻqituvchilarni har yili istalgan jurnallarda 3 tadan maqola chop etishga majburlash, (b) talablarni pasaytirib, har qanday narxda xorijiy talabalarni ommaviy jalb qilish, (v) kompleks strategiya ishlab chiqish. Sizga tavsiyalar tayyorlash topshirildi.</p>`],

title:['Послевузовское образование и подготовка научно-педагогических кадров (докторантура)','Oliy taʼlimdan keyingi taʼlim va ilmiy-pedagogik kadrlar tayyorlash (doktorantura)'],
sub:['Третий цикл, Зальцбургские принципы, модели PhD в мире, система PhD/DSc в Узбекистане, академическая карьера','Uchinchi sikl, Zalsburg tamoyillari, dunyodagi PhD modellari, Oʻzbekistonda PhD/DSc tizimi, akademik martaba'],
sec:[
{h:['Сущность и функции послевузовского образования','Oliy taʼlimdan keyingi taʼlimning mohiyati va vazifalari'],b:[`<p><b>Послевузовское образование</b> — уровень образования, направленный на подготовку научных и научно-педагогических кадров высшей квалификации, способных вести самостоятельные исследования и создавать новое знание. По МСКО-2011 это <b>уровень 8</b>, в Болонском процессе — <b>третий цикл</b> (Берлин, 2003).</p><h4>Функции</h4><ul><li><b>Воспроизводство научного потенциала</b> — подготовка исследователей для вузов, НИИ, индустрии;</li><li><b>Обеспечение качества высшего образования</b> — доля преподавателей с учёной степенью — ключевой показатель вуза;</li><li><b>Инновационная функция</b> — создание знаний для экономики и общества;</li><li><b>Интеграция в мировую науку</b> — публикации, международные проекты, мобильность.</li></ul><p>Европейская ассоциация университетов (EUA) в <b>Зальцбургских принципах (2005)</b> и <b>Зальцбург II (2010)</b> определила ключевые подходы: ядро докторской подготовки — <b>оригинальное исследование</b>; докторанты — <b>молодые исследователи</b> (early-stage researchers), а не студенты; важны структурированность программ, качественное научное руководство, междисциплинарность, мобильность и развитие переносимых навыков.</p>`,`<p><b>Oliy taʼlimdan keyingi taʼlim</b> — mustaqil tadqiqot olib borishga va yangi bilim yaratishga qodir oliy malakali ilmiy va ilmiy-pedagogik kadrlarni tayyorlashga qaratilgan taʼlim darajasi. XSTT-2011 boʻyicha bu <b>8-daraja</b>, Boloniya jarayonida — <b>uchinchi sikl</b> (Berlin, 2003).</p><h4>Vazifalari</h4><ul><li><b>Ilmiy salohiyatni qayta tiklash</b> — OTMlar, ITIlar, sanoat uchun tadqiqotchilar tayyorlash;</li><li><b>Oliy taʼlim sifatini taʼminlash</b> — ilmiy darajali oʻqituvchilar ulushi — OTMning asosiy koʻrsatkichi;</li><li><b>Innovatsion vazifa</b> — iqtisodiyot va jamiyat uchun bilim yaratish;</li><li><b>Jahon faniga integratsiya</b> — nashrlar, xalqaro loyihalar, mobillik.</li></ul><p>Yevropa universitetlari assotsiatsiyasi (EUA) <b>Zalsburg tamoyillari (2005)</b> va <b>Zalsburg II (2010)</b> da asosiy yondashuvlarni belgilagan: doktorlik tayyorgarligining yadrosi — <b>original tadqiqot</b>; doktorantlar talabalar emas, <b>yosh tadqiqotchilar</b> (early-stage researchers); dasturlarning tuzilmaviyligi, sifatli ilmiy rahbarlik, fanlararolik, mobillik va koʻchiriladigan koʻnikmalarni rivojlantirish muhim.</p>`]},
{h:['Модели докторской подготовки в мире','Dunyoda doktorlik tayyorgarligi modellari'],b:[`<div class="kv"><div><b>Традиционная («ученическая»)</b>Германия: докторант работает под руководством научного руководителя (Doktorvater/Doktormutter), минимум учебных курсов.</div><div><b>Структурированная</b>США: PhD-программы в graduate schools — курсовая работа (1–2 года), квалификационные экзамены, затем диссертация; в среднем 5–6 лет.</div><div><b>Профессиональная докторантура</b>EdD (доктор образования), DBA, MD — ориентация на решение практических проблем профессии.</div><div><b>Индустриальная и совместная</b>Industrial PhD (с компаниями), cotutelle — совместное руководство двух вузов разных стран, двойная степень.</div></div><p>В ЕС активно развиваются <b>докторские школы</b> (doctoral schools) — структуры, обеспечивающие общие курсы, супервизию, этическую экспертизу и карьерное сопровождение. Программа <b>Marie Skłodowska-Curie Actions</b> финансирует международные докторские сети.</p><p>Ведущие университеты ТОП-300 (Oxford, Cambridge, ETH Zürich, NUS, Tsinghua) отличаются конкурсным отбором докторантов, полноценным финансированием (стипендия или контракт), командами научных руководителей и строгими требованиями к академической честности.</p>`,`<div class="kv"><div><b>Anʼanaviy («shogirdlik»)</b>Germaniya: doktorant ilmiy rahbar (Doktorvater/Doktormutter) rahbarligida ishlaydi, oʻquv kurslari minimal.</div><div><b>Tuzilmaviy</b>AQSh: graduate schoolsdagi PhD dasturlari — kurs ishi (1–2 yil), malaka imtihonlari, soʻng dissertatsiya; oʻrtacha 5–6 yil.</div><div><b>Professional doktorantura</b>EdD (taʼlim doktori), DBA, MD — kasbning amaliy muammolarini hal qilishga yoʻnalganlik.</div><div><b>Sanoat va qoʻshma</b>Industrial PhD (kompaniyalar bilan), cotutelle — turli mamlakatlardagi ikki OTMning qoʻshma rahbarligi, ikki daraja.</div></div><p>YeIda <b>doktorlik maktablari</b> (doctoral schools) faol rivojlanmoqda — umumiy kurslar, supervizya, axloqiy ekspertiza va martaba koʻmagini taʼminlovchi tuzilmalar. <b>Marie Skłodowska-Curie Actions</b> dasturi xalqaro doktorlik tarmoqlarini moliyalashtiradi.</p><p>TOP-300 taligidagi yetakchi universitetlar (Oxford, Cambridge, ETH Zürich, NUS, Tsinghua) doktorantlarni tanlov asosida saralash, toʻliq moliyalashtirish (stipendiya yoki shartnoma), ilmiy rahbarlar jamoalari va akademik halollikka qatʼiy talablar bilan ajralib turadi.</p>`]},
{h:['Система послевузовского образования в Узбекистане','Oʻzbekistonda oliy taʼlimdan keyingi taʼlim tizimi'],b:[`<p>Указом Президента от <b>16 февраля 2017 г. (УП-4958)</b> «О дальнейшем совершенствовании системы послевузовского образования» в Узбекистане введена <b>двухуровневая система</b>, гармонизированная с международной практикой:</p><div class="kv"><div><b>PhD — доктор философии</b>Первая учёная степень; подготовка в <b>базовой докторантуре</b> (как правило, 3 года).</div><div><b>DSc — доктор наук</b>Высшая учёная степень; подготовка в <b>докторантуре</b> (как правило, 3 года) на базе степени PhD.</div></div><p>Законом «Об образовании» (ЗРУ-637) послевузовское образование закреплено как самостоятельный вид образования, осуществляемый в высших образовательных и научных организациях. Предусмотрены формы <b>базовой докторантуры, докторантуры, самостоятельного соискательства</b>, а также целевой подготовки по заказу организаций.</p><h4>Ключевые элементы</h4><ul><li><b>Высшая аттестационная комиссия (ВАК)</b> — присуждение учёных степеней, перечень рецензируемых журналов;</li><li><b>Научные советы</b> по защите диссертаций при вузах и НИИ;</li><li>Требования к публикациям, в т.ч. в изданиях, индексируемых <b>Scopus и Web of Science</b>;</li><li>Обязательная проверка диссертаций на <b>плагиат</b>;</li><li><b>Фонд «Эл-юрт умиди»</b> (2018) — финансирование обучения и стажировок в ведущих зарубежных вузах, включая PhD-программы.</li></ul>`,`<p>Prezidentning <b>2017-yil 16-fevraldagi PF-4958-son</b> «Oliy oʻquv yurtidan keyingi taʼlim tizimini yanada takomillashtirish toʻgʻrisida»gi Farmoni bilan Oʻzbekistonda xalqaro amaliyot bilan uygʻunlashgan <b>ikki bosqichli tizim</b> joriy etildi:</p><div class="kv"><div><b>PhD — falsafa doktori</b>Birinchi ilmiy daraja; <b>tayanch doktoranturada</b> tayyorlash (odatda 3 yil).</div><div><b>DSc — fan doktori</b>Oliy ilmiy daraja; PhD darajasi negizida <b>doktoranturada</b> tayyorlash (odatda 3 yil).</div></div><p>«Taʼlim toʻgʻrisida»gi Qonunda (OʻRQ-637) oliy taʼlimdan keyingi taʼlim oliy taʼlim va ilmiy tashkilotlarda amalga oshiriladigan mustaqil taʼlim turi sifatida mustahkamlangan. <b>Tayanch doktorantura, doktorantura, mustaqil izlanuvchilik</b> shakllari, shuningdek tashkilotlar buyurtmasi boʻyicha maqsadli tayyorlash nazarda tutilgan.</p><h4>Asosiy elementlar</h4><ul><li><b>Oliy attestatsiya komissiyasi (OAK)</b> — ilmiy darajalar berish, taqrizlanadigan jurnallar roʻyxati;</li><li>OTM va ITIlar huzuridagi dissertatsiya himoyasi boʻyicha <b>ilmiy kengashlar</b>;</li><li>Nashrlarga talablar, jumladan <b>Scopus va Web of Science</b>da indekslanadigan nashrlarda;</li><li>Dissertatsiyalarni <b>plagiatga</b> majburiy tekshirish;</li><li><b>«El-yurt umidi» jamgʻarmasi</b> (2018) — yetakchi xorijiy OTMlarda, jumladan PhD dasturlarida oʻqish va stajirovkalarni moliyalashtirish.</li></ul>`]},
{h:['Подготовка научно-педагогических кадров','Ilmiy-pedagogik kadrlar tayyorlash'],b:[`<p>Преподаватель вуза XXI века — это <b>«академик-профессионал»</b>, сочетающий несколько ролей:</p><ul><li><b>Исследователь</b> — ведёт научную работу, публикуется, привлекает гранты;</li><li><b>Педагог</b> — проектирует курсы на основе результатов обучения, применяет активные и цифровые методы;</li><li><b>Наставник</b> — руководит магистрантами и докторантами;</li><li><b>Эксперт и консультант</b> — взаимодействует с обществом и индустрией («третья миссия» университета).</li></ul><p>Во многих странах развита система подготовки к преподаванию в вузе: в Великобритании — рамка <b>UKPSF</b> и сертификация Advance HE (Fellowship), в Скандинавии — обязательные курсы университетской педагогики. Важен <b>постдокторский этап</b> (postdoc) — временные исследовательские позиции после PhD, позволяющие сформировать независимую исследовательскую программу.</p><p>В Узбекистане значимыми механизмами являются повышение квалификации преподавателей вузов (в т.ч. в Главном научно-методическом центре), стажировки за рубежом, программы «Эл-юрт умиди», привлечение зарубежных учёных и создание совместных лабораторий. ЗРУ-901 закрепил право педагога на профессиональное развитие и академическую свободу.</p>`,`<p>XXI asr OTM oʻqituvchisi — bir necha rolni birlashtiruvchi <b>«akademik-professional»</b>:</p><ul><li><b>Tadqiqotchi</b> — ilmiy ish olib boradi, nashr qiladi, grantlar jalb qiladi;</li><li><b>Pedagog</b> — kurslarni taʼlim natijalari asosida loyihalaydi, faol va raqamli metodlarni qoʻllaydi;</li><li><b>Ustoz</b> — magistrantlar va doktorantlarga rahbarlik qiladi;</li><li><b>Ekspert va maslahatchi</b> — jamiyat va sanoat bilan hamkorlik qiladi (universitetning «uchinchi missiyasi»).</li></ul><p>Koʻplab mamlakatlarda OTMda dars berishga tayyorlash tizimi rivojlangan: Buyuk Britaniyada — <b>UKPSF</b> ramkasi va Advance HE sertifikatlash (Fellowship), Skandinaviyada — universitet pedagogikasi boʻyicha majburiy kurslar. <b>Postdoktorlik bosqichi</b> (postdoc) muhim — PhD dan keyingi vaqtinchalik tadqiqot lavozimlari mustaqil tadqiqot dasturini shakllantirish imkonini beradi.</p><p>Oʻzbekistonda OTM oʻqituvchilari malakasini oshirish (jumladan, Bosh ilmiy-metodik markazda), xorijda stajirovkalar, «El-yurt umidi» dasturlari, xorijiy olimlarni jalb qilish va qoʻshma laboratoriyalar yaratish muhim mexanizmlardir. OʻRQ-901 pedagogning kasbiy rivojlanish va akademik erkinlik huquqini mustahkamladi.</p>`]},
{h:['Проблемы и перспективы','Muammolar va istiqbollar'],b:[`<h4>Проблемы</h4><ul><li><b>«Утечка мозгов»</b> — отток талантливых исследователей за рубеж;</li><li><b>Качество диссертаций</b> и риск формального подхода («степень ради должности»);</li><li><b>Плагиат и публикации в «хищнических» журналах</b>;</li><li>Нехватка квалифицированных научных руководителей в ряде областей, высокая нагрузка;</li><li>Недостаточное финансирование исследований и оборудования;</li><li>Низкая доля защит в установленный срок.</li></ul><h4>Перспективы</h4><ul><li>Переход к <b>структурированным докторским программам</b> и докторским школам;</li><li><b>Совместные докторантуры (cotutelle)</b> с вузами ТОП-300 и двойные степени;</li><li>Привлечение «циркуляции мозгов» — возвращение выпускников зарубежных вузов, диаспоральные сети учёных;</li><li><b>Этика исследований</b>: этические комитеты, обучение академическому письму и честности;</li><li>Развитие <b>индустриальных PhD</b> и связи науки с экономикой;</li><li>Открытая наука, репозитории диссертаций, ORCID для всех исследователей.</li></ul><div class="note">🎯 Послевузовское образование — вершина вертикали непрерывного образования и одновременно её «двигатель»: именно здесь готовятся те, кто будет учить следующие поколения.</div>`,`<h4>Muammolar</h4><ul><li><b>«Aql oqib ketishi»</b> — iqtidorli tadqiqotchilarning xorijga ketishi;</li><li><b>Dissertatsiyalar sifati</b> va rasmiyatchilik xavfi («lavozim uchun daraja»);</li><li><b>Plagiat va «yirtqich» jurnallardagi nashrlar</b>;</li><li>Ayrim sohalarda malakali ilmiy rahbarlarning yetishmasligi, yuqori yuklama;</li><li>Tadqiqotlar va jihozlarning yetarli moliyalashtirilmasligi;</li><li>Belgilangan muddatda himoyalar ulushining pastligi.</li></ul><h4>Istiqbollar</h4><ul><li><b>Tuzilmaviy doktorlik dasturlari</b> va doktorlik maktablariga oʻtish;</li><li>TOP-300 OTMlari bilan <b>qoʻshma doktorantura (cotutelle)</b> va ikki daraja;</li><li>«Aqllar aylanishi»ni jalb qilish — xorijiy OTM bitiruvchilarining qaytishi, olimlarning diaspora tarmoqlari;</li><li><b>Tadqiqot etikasi</b>: axloqiy qoʻmitalar, akademik yozuv va halollikka oʻqitish;</li><li><b>Sanoat PhD</b> va fanning iqtisodiyot bilan aloqasini rivojlantirish;</li><li>Ochiq fan, dissertatsiyalar repozitoriylari, barcha tadqiqotchilar uchun ORCID.</li></ul><div class="note">🎯 Oliy taʼlimdan keyingi taʼlim — uzluksiz taʼlim vertikalining choʻqqisi va ayni paytda uning «dvigateli»: aynan shu yerda keyingi avlodlarni oʻqitadiganlar tayyorlanadi.</div>`]}
],

cs:{t:[`<p>Докторант второго года базовой докторантуры (PhD, педагогика) отстаёт от плана: эксперимент не завершён, есть только одна публикация. Научный руководитель перегружен и встречается с ним раз в два месяца. Знакомый предлагает «быстрое решение» — платную публикацию в малоизвестном журнале, обещающем выход статьи через неделю, и «помощь в написании» главы.</p>`,`<p>Tayanch doktoranturaning ikkinchi yil doktoranti (PhD, pedagogika) rejadan orqada qolmoqda: tajriba yakunlanmagan, faqat bitta nashr bor. Ilmiy rahbar juda band va u bilan ikki oyda bir marta uchrashadi. Tanishi «tezkor yechim» taklif qilmoqda — bir haftada maqola chiqarishni vaʼda qiladigan kam maʼlum jurnalda pullik nashr va bobni «yozishda yordam».</p>`],

title:['Оценка и контроль качества образования. Компетентностный подход и международные исследования (PISA, TIMSS, PIRLS)','Taʼlim sifatini baholash va nazorat qilish. Kompetensiyaviy yondashuv va xalqaro tadqiqotlar (PISA, TIMSS, PIRLS)'],
sub:['Концепции качества, DeSeCo, ключевые компетенции, методология и результаты международных исследований, национальная система оценки','Sifat konsepsiyalari, DeSeCo, tayanch kompetensiyalar, xalqaro tadqiqotlar metodologiyasi va natijalari, milliy baholash tizimi'],
sec:[
{h:['Качество образования: многомерное понятие','Taʼlim sifati: koʻp oʻlchovli tushuncha'],b:[`<p>Британские исследователи <b>Л. Харви и Д. Грин</b> в классической статье «Defining Quality» (1993) выделили пять подходов к пониманию качества в высшем образовании:</p><ol><li><b>Качество как исключительность</b> — превосходство, элитарность;</li><li><b>Качество как совершенство (согласованность)</b> — «ноль дефектов», соответствие спецификациям;</li><li><b>Качество как соответствие цели</b> (fitness for purpose) — достижение заявленной миссии;</li><li><b>Качество как ценность за деньги</b> — эффективность и подотчётность;</li><li><b>Качество как трансформация</b> — изменение и развитие обучающегося.</li></ol><p>В Законе «Об образовании» качество связывается с соответствием <b>государственным образовательным стандартам и требованиям</b>, а также потребностям личности, общества и государства.</p><h4>Система обеспечения качества</h4><div class="kv"><div><b>Внутренняя</b>Политика качества вуза/школы, самооценка, обратная связь студентов, мониторинг программ.</div><div><b>Внешняя</b>Лицензирование, аттестация, аккредитация, инспектирование, независимая оценка.</div><div><b>Международная</b>ESG, международная аккредитация, рейтинги, сравнительные исследования.</div></div>`,`<p>Britaniyalik tadqiqotchilar <b>L. Xarvi va D. Grin</b> «Defining Quality» (1993) klassik maqolasida oliy taʼlimda sifatni tushunishga beshta yondashuvni ajratgan:</p><ol><li><b>Sifat istisnoviylik sifatida</b> — ustunlik, elitarlik;</li><li><b>Sifat mukammallik (izchillik) sifatida</b> — «nol nuqson», spetsifikatsiyalarga muvofiqlik;</li><li><b>Sifat maqsadga muvofiqlik sifatida</b> (fitness for purpose) — eʼlon qilingan missiyaga erishish;</li><li><b>Sifat pulga yarasha qiymat sifatida</b> — samaradorlik va hisobdorlik;</li><li><b>Sifat transformatsiya sifatida</b> — taʼlim oluvchining oʻzgarishi va rivojlanishi.</li></ol><p>«Taʼlim toʻgʻrisida»gi Qonunda sifat <b>davlat taʼlim standartlari va talablariga</b>, shuningdek shaxs, jamiyat va davlat ehtiyojlariga muvofiqlik bilan bogʻlanadi.</p><h4>Sifatni taʼminlash tizimi</h4><div class="kv"><div><b>Ichki</b>OTM/maktab sifat siyosati, oʻzini oʻzi baholash, talabalar fikr-mulohazasi, dasturlar monitoringi.</div><div><b>Tashqi</b>Litsenziyalash, attestatsiya, akkreditatsiya, inspeksiya, mustaqil baholash.</div><div><b>Xalqaro</b>ESG, xalqaro akkreditatsiya, reytinglar, qiyosiy tadqiqotlar.</div></div>`]},
{h:['Компетентностный подход','Kompetensiyaviy yondashuv'],b:[`<p><b>Компетенция</b> — интегральная способность мобилизовать знания, умения, отношения и ценности для успешного решения задач в определённом контексте. Компетентностный подход смещает акцент <i>с того, что преподаватель передал, на то, что обучающийся способен делать</i>.</p><h4>Международные рамки</h4><ul><li><b>Проект ОЭСР DeSeCo</b> (Definition and Selection of Competencies, 1997–2003) выделил три категории ключевых компетенций: <b>интерактивное использование инструментов</b> (язык, информация, технологии); <b>взаимодействие в разнородных группах</b>; <b>автономное действие</b>.</li><li><b>Ключевые компетенции ЕС для обучения через всю жизнь</b> (2006, обновлены в 2018) — 8 компетенций: грамотность; многоязычие; математическая и естественнонаучная, технологическая, инженерная; цифровая; личностная, социальная и «умение учиться»; гражданская; предпринимательская; культурная осведомлённость и самовыражение.</li><li><b>Модель «4К»</b>: критическое мышление, креативность, коммуникация, кооперация.</li><li><b>OECD Learning Compass 2030</b> — «компас обучения» с акцентом на благополучие и агентность (student agency).</li><li><b>Проект Tuning</b> — общие (generic) и предметно-специфические компетенции для вузовских программ.</li></ul><p>Компетентностный подход требует изменения <b>оценивания</b>: от проверки воспроизведения знаний — к аутентичным заданиям, кейсам, проектам, портфолио, рубрикам (критериальному оцениванию) и формирующему оцениванию (assessment for learning).</p>`,`<p><b>Kompetensiya</b> — muayyan kontekstda vazifalarni muvaffaqiyatli hal qilish uchun bilim, koʻnikma, munosabat va qadriyatlarni safarbar qilishning integral qobiliyati. Kompetensiyaviy yondashuv urgʻuni <i>oʻqituvchi nimani bergani</i>dan <i>taʼlim oluvchi nima qila olishi</i>ga koʻchiradi.</p><h4>Xalqaro ramkalar</h4><ul><li><b>IHTTning DeSeCo loyihasi</b> (Definition and Selection of Competencies, 1997–2003) tayanch kompetensiyalarning uchta toifasini ajratgan: <b>vositalardan interaktiv foydalanish</b> (til, axborot, texnologiyalar); <b>turli guruhlarda oʻzaro hamkorlik</b>; <b>avtonom harakat</b>.</li><li><b>YeIning butun umr taʼlimi uchun tayanch kompetensiyalari</b> (2006, 2018-yilda yangilangan) — 8 kompetensiya: savodxonlik; koʻptillilik; matematik va tabiiy-ilmiy, texnologik, muhandislik; raqamli; shaxsiy, ijtimoiy va «oʻrganishni oʻrganish»; fuqarolik; tadbirkorlik; madaniy xabardorlik va oʻzini ifodalash.</li><li><b>«4K» modeli</b>: tanqidiy fikrlash, kreativlik, kommunikatsiya, kooperatsiya.</li><li><b>OECD Learning Compass 2030</b> — farovonlik va agentlikka (student agency) urgʻu beruvchi «taʼlim kompasi».</li><li><b>Tuning loyihasi</b> — OTM dasturlari uchun umumiy (generic) va fanga xos kompetensiyalar.</li></ul><p>Kompetensiyaviy yondashuv <b>baholashni</b> oʻzgartirishni talab qiladi: bilimlarni qayta aytib berishni tekshirishdan — autentik topshiriqlar, keyslar, loyihalar, portfolio, rubrikalar (mezonli baholash) va shakllantiruvchi baholashga (assessment for learning).</p>`]},
{h:['PISA: оценка функциональной грамотности','PISA: funksional savodxonlikni baholash'],b:[`<p><b>PISA (Programme for International Student Assessment)</b> — программа ОЭСР, проводимая с <b>2000 г.</b> каждые <b>3 года</b> (цикл 2021 г. перенесён на 2022 г. из-за пандемии). Оценивает <b>15-летних</b> учащихся по трём основным областям: <b>читательская, математическая и естественнонаучная грамотность</b>; в каждом цикле одна область — приоритетная, добавляются инновационные домены (в 2022 г. — <b>креативное мышление</b>, в 2025 г. — обучение в цифровом мире).</p><p>Особенность PISA — оценка не усвоения школьной программы, а <b>способности применять знания в реальных жизненных ситуациях</b>. Помимо тестов, собираются анкеты учащихся, школ, родителей, что позволяет анализировать факторы успеха (социально-экономический статус, школьный климат, ИКТ и др.).</p><h4>Узбекистан в PISA-2022</h4><p>Узбекистан впервые принял участие в PISA в цикле 2022 г. (81 страна и экономика). Результаты: <b>математика — 364</b>, <b>чтение — 336</b>, <b>естественные науки — 355</b> балла при средних по ОЭСР 472, 476 и 485 соответственно. Лидеры — Сингапур, Макао, Тайвань, Гонконг, Япония, Корея, Эстония.</p><div class="note">📌 Результаты стали важным диагностическим сигналом: ключевая задача — переход от репродуктивного обучения к развитию функциональной грамотности, усиление подготовки учителей и обновление учебных программ.</div>`,`<p><b>PISA (Programme for International Student Assessment)</b> — IHTT dasturi, <b>2000-yildan</b> boshlab har <b>3 yilda</b> oʻtkaziladi (2021-yil sikli pandemiya sababli 2022-yilga koʻchirilgan). <b>15 yoshli</b> oʻquvchilarni uchta asosiy soha boʻyicha baholaydi: <b>oʻqish, matematik va tabiiy-ilmiy savodxonlik</b>; har bir siklda bitta soha ustuvor, innovatsion domenlar qoʻshiladi (2022-yilda — <b>kreativ fikrlash</b>, 2025-yilda — raqamli dunyoda oʻrganish).</p><p>PISA ning oʻziga xosligi — maktab dasturini oʻzlashtirishni emas, balki <b>bilimlarni real hayotiy vaziyatlarda qoʻllash qobiliyatini</b> baholash. Testlardan tashqari oʻquvchilar, maktablar, ota-onalar soʻrovnomalari yigʻiladi, bu muvaffaqiyat omillarini (ijtimoiy-iqtisodiy maqom, maktab muhiti, AKT va boshqalar) tahlil qilish imkonini beradi.</p><h4>PISA-2022 da Oʻzbekiston</h4><p>Oʻzbekiston PISA da ilk bor 2022-yilgi siklda (81 mamlakat va iqtisodiyot) ishtirok etdi. Natijalar: <b>matematika — 364</b>, <b>oʻqish — 336</b>, <b>tabiiy fanlar — 355</b> ball, IHTT oʻrtachasi mos ravishda 472, 476 va 485. Yetakchilar — Singapur, Makao, Tayvan, Gonkong, Yaponiya, Koreya, Estoniya.</p><div class="note">📌 Natijalar muhim diagnostik signal boʻldi: asosiy vazifa — reproduktiv taʼlimdan funksional savodxonlikni rivojlantirishga oʻtish, oʻqituvchilar tayyorgarligini kuchaytirish va oʻquv dasturlarini yangilash.</div>`]},
{h:['TIMSS и PIRLS: исследования IEA','TIMSS va PIRLS: IEA tadqiqotlari'],b:[`<p>Международная ассоциация по оценке учебных достижений (<b>IEA</b>, Амстердам) проводит исследования, ориентированные на <b>школьные программы</b> (curriculum-based):</p><div class="kv"><div><b>TIMSS</b>Trends in International Mathematics and Science Study. С 1995 г., каждые 4 года; 4-й и 8-й классы; математика и естественные науки.</div><div><b>PIRLS</b>Progress in International Reading Literacy Study. С 2001 г., каждые 5 лет; 4-й класс; читательская грамотность.</div></div><p>Шкалы TIMSS и PIRLS имеют центральную точку <b>500 баллов</b> и международные эталоны (benchmarks): продвинутый (625), высокий (550), средний (475), низкий (400).</p><h4>Узбекистан в PIRLS-2021</h4><p>Узбекистан впервые участвовал в PIRLS в цикле 2021 г.; средний балл четвероклассников составил <b>437</b> (при центральной точке шкалы 500). Страна также присоединилась к исследованию <b>TIMSS</b> (цикл 2023 г.).</p><h4>Другие международные исследования</h4><ul><li><b>TALIS</b> (ОЭСР) — исследование учителей и директоров школ;</li><li><b>PIAAC</b> (ОЭСР) — оценка компетенций взрослых (16–65 лет) — важна для LLL;</li><li><b>ICILS</b> (IEA) — компьютерная и информационная грамотность;</li><li><b>ICCS</b> (IEA) — гражданское образование.</li></ul>`,`<p>Oʻquv yutuqlarini baholash xalqaro assotsiatsiyasi (<b>IEA</b>, Amsterdam) <b>maktab dasturlariga</b> yoʻnaltirilgan (curriculum-based) tadqiqotlar oʻtkazadi:</p><div class="kv"><div><b>TIMSS</b>Trends in International Mathematics and Science Study. 1995-yildan, har 4 yilda; 4- va 8-sinflar; matematika va tabiiy fanlar.</div><div><b>PIRLS</b>Progress in International Reading Literacy Study. 2001-yildan, har 5 yilda; 4-sinf; oʻqish savodxonligi.</div></div><p>TIMSS va PIRLS shkalalarining markaziy nuqtasi <b>500 ball</b> va xalqaro etalonlari (benchmarks) bor: ilgʻor (625), yuqori (550), oʻrta (475), past (400).</p><h4>PIRLS-2021 da Oʻzbekiston</h4><p>Oʻzbekiston PIRLS da ilk bor 2021-yilgi siklda ishtirok etdi; toʻrtinchi sinf oʻquvchilarining oʻrtacha bali <b>437</b> ni tashkil etdi (shkala markaziy nuqtasi 500). Mamlakat <b>TIMSS</b> tadqiqotiga ham qoʻshildi (2023-yil sikli).</p><h4>Boshqa xalqaro tadqiqotlar</h4><ul><li><b>TALIS</b> (IHTT) — oʻqituvchilar va maktab direktorlari tadqiqoti;</li><li><b>PIAAC</b> (IHTT) — kattalar (16–65 yosh) kompetensiyalarini baholash — LLL uchun muhim;</li><li><b>ICILS</b> (IEA) — kompyuter va axborot savodxonligi;</li><li><b>ICCS</b> (IEA) — fuqarolik taʼlimi.</li></ul>`]},
{h:['Национальная система оценки качества и риски','Milliy sifatni baholash tizimi va xavflar'],b:[`<p>В Узбекистане сформирована институциональная система контроля качества образования:</p><ul><li>Уполномоченный государственный орган по <b>надзору за качеством образования</b> (инспекция/агентство), осуществляющий аттестацию и аккредитацию образовательных организаций, контроль соблюдения стандартов;</li><li><b>Национальный центр по внедрению международных исследований оценки качества образования</b> — координация участия в PISA, PIRLS, TIMSS, TALIS;</li><li><b>Агентство по оценке знаний и навыков</b> — вступительные испытания в вузы, национальные сертификаты по языкам и предметам;</li><li><b>Рейтинговая оценка</b> вузов и школ, электронные системы мониторинга (HEMIS и др.).</li></ul><h4>Риски «тестовой культуры»</h4><ul><li><b>Закон Кэмпбелла</b>: чем больше количественный показатель используется для принятия решений, тем сильнее он подвержен искажению и тем сильнее искажает процесс, который призван отслеживать.</li><li><b>«Натаскивание на тест»</b> (teaching to the test) и сужение учебной программы;</li><li>Стигматизация «слабых» школ, рост тревожности учащихся.</li></ul><div class="note">🎯 Ключевой принцип: оценка должна служить <b>улучшению обучения</b>, а не только контролю. Международные исследования ценны прежде всего как инструмент анализа причин и принятия решений на основе данных.</div>`,`<p>Oʻzbekistonda taʼlim sifatini nazorat qilishning institutsional tizimi shakllantirilgan:</p><ul><li>Taʼlim tashkilotlarini attestatsiya va akkreditatsiya qiluvchi, standartlarga rioya etilishini nazorat qiluvchi <b>taʼlim sifati ustidan nazorat</b> boʻyicha vakolatli davlat organi (inspeksiya/agentlik);</li><li><b>Taʼlim sifatini baholash boʻyicha xalqaro tadqiqotlarni joriy etish milliy markazi</b> — PISA, PIRLS, TIMSS, TALIS da ishtirokni muvofiqlashtirish;</li><li><b>Bilim va malakalarni baholash agentligi</b> — OTMlarga kirish imtihonlari, tillar va fanlar boʻyicha milliy sertifikatlar;</li><li>OTMlar va maktablarning <b>reyting bahosi</b>, elektron monitoring tizimlari (HEMIS va boshqalar).</li></ul><h4>«Test madaniyati» xavflari</h4><ul><li><b>Kempbell qonuni</b>: miqdoriy koʻrsatkich qaror qabul qilishda qanchalik koʻp ishlatilsa, u shunchalik buzilishga moyil boʻladi va kuzatishi lozim boʻlgan jarayonni shunchalik buzadi.</li><li><b>«Testga moslab oʻqitish»</b> (teaching to the test) va oʻquv dasturining torayishi;</li><li>«Zaif» maktablarning stigmatizatsiyasi, oʻquvchilar xavotirining ortishi.</li></ul><div class="note">🎯 Asosiy tamoyil: baholash faqat nazoratga emas, <b>taʼlimni yaxshilashga</b> xizmat qilishi kerak. Xalqaro tadqiqotlar eng avvalo sabablarni tahlil qilish va maʼlumotlarga asoslangan qarorlar qabul qilish vositasi sifatida qimmatli.</div>`]}
],

cs:{t:[`<p>После публикации результатов PISA-2022 руководство одного из районов предлагает: ввести еженедельные пробные тесты в формате PISA для всех 8–9-классников, составить рейтинг школ по результатам и лишить премий учителей «отстающих» школ.</p>`,`<p>PISA-2022 natijalari eʼlon qilingandan soʻng tumanlardan birining rahbariyati quyidagilarni taklif qilmoqda: barcha 8–9-sinf oʻquvchilari uchun PISA formatida haftalik sinov testlarini joriy etish, natijalar boʻyicha maktablar reytingini tuzish va «orqada qolayotgan» maktablar oʻqituvchilarini mukofotlardan mahrum qilish.</p>`],

o:[['Поддержать полностью — тесты повысят баллы','Отклонить: риск закона Кэмпбелла и «натаскивания». Предложить: обучение учителей методикам развития функциональной грамотности, контекстные задачи в уроках, формирующее оценивание, адресную поддержку школ с низкими результатами','Отменить всё оценивание в школах','Перевести сильных учеников в одну школу'],['Toʻliq qoʻllab-quvvatlash — testlar ballarni oshiradi','Rad etish: Kempbell qonuni va «testga moslab oʻqitish» xavfi. Taklif: oʻqituvchilarni funksional savodxonlikni rivojlantirish metodikalariga oʻqitish, darslarda kontekstli topshiriqlar, shakllantiruvchi baholash, past natijali maktablarga manzilli yordam','Maktablarda barcha baholashni bekor qilish','Kuchli oʻquvchilarni bitta maktabga oʻtkazish']],
best:1,fb:[['Еженедельные тесты и санкции ведут к «натаскиванию», стрессу и искажению данных, не улучшая реальную грамотность.','Оптимально: PISA — инструмент диагностики; улучшение достигается через изменение практики преподавания и поддержку.','Отказ от оценивания лишает систему обратной связи.','Сегрегация усиливает неравенство и не повышает средний уровень.'],['Haftalik testlar va sanksiyalar real savodxonlikni yaxshilamasdan «testga moslab oʻqitish», stress va maʼlumotlar buzilishiga olib keladi.','Eng maqbul: PISA — diagnostika vositasi; yaxshilanishga oʻqitish amaliyotini oʻzgartirish va qoʻllab-quvvatlash orqali erishiladi.','Baholashdan voz kechish tizimni fikr-mulohazadan mahrum qiladi.','Segregatsiya tengsizlikni kuchaytiradi va oʻrtacha darajani oshirmaydi.']]},

title:['Модернизация законодательства в сфере образования: ЗРУ-637, ЗРУ-901 и международный опыт кодификации','Taʼlim sohasidagi qonunchilikni modernizatsiya qilish: OʻRQ-637, OʻRQ-901 va kodifikatsiyaning xalqaro tajribasi'],
sub:['Конституционные основы, новеллы Закона «Об образовании», статус педагога, кодексы об образовании в мире','Konstitutsiyaviy asoslar, «Taʼlim toʻgʻrisida»gi Qonun yangiliklari, pedagog maqomi, dunyodagi taʼlim kodekslari'],
sec:[
{h:['Право как инструмент развития образования','Huquq taʼlimni rivojlantirish vositasi sifatida'],b:[`<p><b>Образовательное право</b> — комплексная отрасль законодательства, регулирующая отношения в сфере образования: права и обязанности участников, статус образовательных организаций, гарантии государства, управление, финансирование и качество.</p><h4>Иерархия источников образовательного права Узбекистана</h4><ol><li><b>Конституция Республики Узбекистан</b> (в редакции, принятой на референдуме 30 апреля 2023 г.) — закрепляет право каждого на образование, гарантирует бесплатное общее среднее образование, устанавливает обязательность общего среднего образования;</li><li><b>Международные договоры</b> (Конвенция ООН о правах ребёнка, Международный пакт об экономических, социальных и культурных правах и др.);</li><li><b>Законы</b>: «Об образовании» (ЗРУ-637), «О статусе педагога» (ЗРУ-901), «О дошкольном образовании и воспитании», «О науке и научной деятельности» и др.;</li><li><b>Указы и постановления Президента</b> (концепции, стратегии);</li><li><b>Постановления Кабинета Министров</b> и <b>ведомственные акты</b> (положения, стандарты).</li></ol><p>Модернизация законодательства — необходимое условие реформ: без правовой основы невозможно обеспечить академическую свободу, финансовую самостоятельность вузов, защиту прав педагогов и обучающихся.</p>`,`<p><b>Taʼlim huquqi</b> — taʼlim sohasidagi munosabatlarni tartibga soluvchi kompleks qonunchilik tarmogʻi: ishtirokchilarning huquq va majburiyatlari, taʼlim tashkilotlari maqomi, davlat kafolatlari, boshqaruv, moliyalashtirish va sifat.</p><h4>Oʻzbekiston taʼlim huquqi manbalari ierarxiyasi</h4><ol><li><b>Oʻzbekiston Respublikasi Konstitutsiyasi</b> (2023-yil 30-apreldagi referendumda qabul qilingan tahrirda) — har kimning taʼlim olish huquqini mustahkamlaydi, bepul umumiy oʻrta taʼlimni kafolatlaydi, umumiy oʻrta taʼlimning majburiyligini belgilaydi;</li><li><b>Xalqaro shartnomalar</b> (BMTning Bola huquqlari toʻgʻrisidagi konvensiyasi, Iqtisodiy, ijtimoiy va madaniy huquqlar toʻgʻrisidagi xalqaro pakt va boshqalar);</li><li><b>Qonunlar</b>: «Taʼlim toʻgʻrisida» (OʻRQ-637), «Pedagog maqomi toʻgʻrisida» (OʻRQ-901), «Maktabgacha taʼlim va tarbiya toʻgʻrisida», «Fan va ilmiy faoliyat toʻgʻrisida» va boshqalar;</li><li><b>Prezident farmonlari va qarorlari</b> (konsepsiyalar, strategiyalar);</li><li><b>Vazirlar Mahkamasi qarorlari</b> va <b>idoraviy hujjatlar</b> (nizomlar, standartlar).</li></ol><p>Qonunchilikni modernizatsiya qilish islohotlarning zarur sharti: huquqiy asossiz akademik erkinlik, OTMlarning moliyaviy mustaqilligi, pedagoglar va taʼlim oluvchilar huquqlarini himoya qilishni taʼminlab boʻlmaydi.</p>`]},
{h:['Закон «Об образовании» (ЗРУ-637): новеллы','«Taʼlim toʻgʻrisida»gi Qonun (OʻRQ-637): yangiliklar'],b:[`<p>Закон <b>№ ЗРУ-637 от 23 сентября 2020 г.</b> заменил Закон «Об образовании» 1997 г., который вместе с «Национальной программой по подготовке кадров» (1997) более двух десятилетий определял модель образования страны.</p><h4>Ключевые новеллы</h4><ul><li><b>Обновлённые принципы</b> госполитики: гуманистический, демократический характер, непрерывность и преемственность, инклюзивность, светский характер, общедоступность, приоритет общечеловеческих ценностей, признание и поддержка таланта, академическая свобода.</li><li><b>Новая структура видов образования</b>, включая профессиональное образование трёх уровней и послевузовское образование.</li><li><b>Расширение форм обучения</b>: очная, заочная (с отрывом и без отрыва), вечерняя, <b>дистанционная</b>, <b>дуальная</b>, <b>семейное образование и самообразование</b>, экстернат, инклюзивное образование, обучение для взрослых.</li><li><b>Академическая и организационно-управленческая самостоятельность</b> вузов, право на разработку собственных образовательных программ.</li><li><b>Сетевая форма</b> реализации программ и <b>академическая мобильность</b>.</li><li>Расширение роли <b>негосударственных образовательных организаций</b> и государственно-частного партнёрства.</li><li>Закрепление <b>прав обучающихся и педагогов</b>, обязательств родителей.</li></ul>`,`<p><b>2020-yil 23-sentabrdagi OʻRQ-637-son</b> Qonun 1997-yilgi «Taʼlim toʻgʻrisida»gi Qonun oʻrnini egalladi; u «Kadrlar tayyorlash milliy dasturi» (1997) bilan birga yigirma yildan ortiq mamlakat taʼlim modelini belgilab kelgan edi.</p><h4>Asosiy yangiliklar</h4><ul><li>Davlat siyosatining <b>yangilangan tamoyillari</b>: insonparvarlik, demokratik xususiyat, uzluksizlik va izchillik, inklyuzivlik, dunyoviylik, ommaboplik, umuminsoniy qadriyatlar ustuvorligi, iqtidorni eʼtirof etish va qoʻllab-quvvatlash, akademik erkinlik.</li><li>Uch bosqichli professional taʼlim va oliy taʼlimdan keyingi taʼlimni oʻz ichiga olgan <b>taʼlim turlarining yangi tuzilmasi</b>.</li><li><b>Taʼlim shakllarining kengayishi</b>: kunduzgi, sirtqi (ishdan ajralgan va ajralmagan holda), kechki, <b>masofaviy</b>, <b>dual</b>, <b>oilaviy taʼlim va mustaqil taʼlim</b>, eksternat, inklyuziv taʼlim, kattalar taʼlimi.</li><li>OTMlarning <b>akademik va tashkiliy-boshqaruv mustaqilligi</b>, oʻz taʼlim dasturlarini ishlab chiqish huquqi.</li><li>Dasturlarni amalga oshirishning <b>tarmoq shakli</b> va <b>akademik mobillik</b>.</li><li><b>Nodavlat taʼlim tashkilotlari</b> va davlat-xususiy sheriklik rolining kengayishi.</li><li><b>Taʼlim oluvchilar va pedagoglar huquqlari</b>, ota-onalar majburiyatlarining mustahkamlanishi.</li></ul>`]},
{h:['Закон «О статусе педагога» (ЗРУ-901)','«Pedagog maqomi toʻgʻrisida»gi Qonun (OʻRQ-901)'],b:[`<p>Закон <b>№ ЗРУ-901 от 1 февраля 2024 г.</b> (принят Законодательной палатой 01.08.2023, одобрен Сенатом 29.09.2023) впервые в истории страны выделил статус педагога в отдельный законодательный акт. Он распространяется на педагогов <b>государственных и негосударственных</b> образовательных организаций.</p><h4>Основные положения</h4><ul><li><b>Определение педагога</b>: физическое лицо, осуществляющее профессиональную деятельность в сфере образования и воспитания на основании трудового договора, имеющее соответствующее образование, профессиональную подготовку и высокие нравственные качества.</li><li><b>Защита чести, достоинства и деловой репутации</b> педагога государством; педагог освобождается от уплаты госпошлины при обращении в суд за их защитой.</li><li><b>Запрет на привлечение</b> педагога к работам, не связанным с профессиональной деятельностью (благоустройство, сельхозработы), и на требование не относящихся к его обязанностям отчётов.</li><li>Привлечение к общественно значимым мероприятиям (выборы, перепись и др.) — <b>только с согласия</b>, по договору и за дополнительную плату.</li><li><b>Запрет вмешательства</b> в оценивание педагогом знаний обучающихся.</li><li><b>Наставничество</b>: за впервые приступившим к работе в школе педагогом на один учебный год закрепляется опытный наставник.</li><li><b>Социальные гарантии</b>: льготный приём детей педагогов в государственные ДОО и др.</li><li>Запрет на занятие педагогических должностей лицами, ранее осуждёнными за умышленные преступления.</li></ul>`,`<p><b>2024-yil 1-fevraldagi OʻRQ-901-son</b> Qonun (Qonunchilik palatasi tomonidan 01.08.2023 da qabul qilingan, Senat tomonidan 29.09.2023 da maʼqullangan) mamlakat tarixida ilk bor pedagog maqomini alohida qonun hujjatiga ajratdi. U <b>davlat va nodavlat</b> taʼlim tashkilotlari pedagoglariga tatbiq etiladi.</p><h4>Asosiy qoidalar</h4><ul><li><b>Pedagog taʼrifi</b>: mehnat shartnomasi asosida taʼlim va tarbiya sohasida kasbiy faoliyatni amalga oshiruvchi, tegishli maʼlumot, kasbiy tayyorgarlik va yuksak maʼnaviy-axloqiy fazilatlarga ega jismoniy shaxs.</li><li>Pedagog <b>shaʼni, qadr-qimmati va ishchanlik obroʻsi</b> davlat himoyasida; ularni himoya qilish uchun sudga murojaat qilganda pedagog davlat bojidan ozod qilinadi.</li><li>Pedagogni kasbiy faoliyatiga aloqador boʻlmagan ishlarga (obodonlashtirish, qishloq xoʻjaligi ishlari) <b>jalb qilish taqiqlanadi</b>, majburiyatlariga taalluqli boʻlmagan hisobotlar talab qilinmaydi.</li><li>Ijtimoiy ahamiyatga ega tadbirlarga (saylovlar, aholini roʻyxatga olish va boshqalar) jalb qilish — <b>faqat roziligi bilan</b>, shartnoma asosida va qoʻshimcha haq evaziga.</li><li>Pedagogning taʼlim oluvchilar bilimini baholashiga <b>aralashish taqiqlanadi</b>.</li><li><b>Ustozlik</b>: maktabda ilk bor ish boshlagan pedagogga bir oʻquv yili davomida tajribali ustoz biriktiriladi.</li><li><b>Ijtimoiy kafolatlar</b>: pedagoglar farzandlarini davlat MTTlariga imtiyozli qabul qilish va boshqalar.</li><li>Ilgari qasddan jinoyat sodir etganlik uchun sudlangan shaxslarning pedagogik lavozimlarni egallashi taqiqlanadi.</li></ul>`]},
{h:['Международный опыт кодификации образовательного законодательства','Taʼlim qonunchiligini kodifikatsiya qilishning xalqaro tajribasi'],b:[`<p><b>Кодификация</b> — систематизация норм путём создания единого сводного акта (кодекса), устраняющего противоречия и пробелы. В образовании существуют две модели:</p><div class="kv"><div><b>Кодекс об образовании</b>Единый акт, охватывающий все уровни и аспекты: Франция, Беларусь, Молдова.</div><div><b>Система законов</b>Рамочный закон + специальные законы по уровням и вопросам: Узбекистан, Германия (на уровне земель), Казахстан, Россия (единый закон 273-ФЗ).</div></div><ul><li><b>Франция — Code de l'éducation</b> (законодательная часть принята в 2000 г.): объединяет нормы обо всех ступенях, от начальной школы до университетов; регулярно обновляется.</li><li><b>Беларусь — Кодекс об образовании</b> (2011, новая редакция 2022 г.).</li><li><b>Молдова — Кодекс об образовании</b> (Codul educației, 2014): реформа, ориентированная на стандарты ЕС.</li><li><b>Россия</b> — Федеральный закон № 273-ФЗ «Об образовании в Российской Федерации» (2012), заменивший законы об образовании и о высшем образовании, — пример «квазикодификации».</li><li><b>Финляндия, Эстония</b> — компактные рамочные законы с высоким доверием к профессионалам и широкой автономией школ.</li></ul><p><b>Преимущества кодификации</b>: системность, единая терминология, доступность для граждан. <b>Риски</b>: громоздкость, сложность внесения изменений, «окаменение» норм в быстро меняющейся сфере.</p>`,`<p><b>Kodifikatsiya</b> — ziddiyat va boʻshliqlarni bartaraf etuvchi yagona yigʻma hujjat (kodeks) yaratish orqali normalarni tizimlashtirish. Taʼlimda ikki model mavjud:</p><div class="kv"><div><b>Taʼlim kodeksi</b>Barcha bosqich va jihatlarni qamrab oluvchi yagona hujjat: Fransiya, Belarus, Moldova.</div><div><b>Qonunlar tizimi</b>Ramka qonun + bosqichlar va masalalar boʻyicha maxsus qonunlar: Oʻzbekiston, Germaniya (yerlar darajasida), Qozogʻiston, Rossiya (yagona 273-FZ qonun).</div></div><ul><li><b>Fransiya — Code de l'éducation</b> (qonunchilik qismi 2000-yilda qabul qilingan): boshlangʻich maktabdan universitetlargacha barcha bosqichlar haqidagi normalarni birlashtiradi; muntazam yangilanadi.</li><li><b>Belarus — Taʼlim toʻgʻrisidagi kodeks</b> (2011, yangi tahrir 2022).</li><li><b>Moldova — Taʼlim kodeksi</b> (Codul educației, 2014): YeI standartlariga yoʻnaltirilgan islohot.</li><li><b>Rossiya</b> — «Rossiya Federatsiyasida taʼlim toʻgʻrisida»gi 273-FZ Federal qonuni (2012), taʼlim va oliy taʼlim toʻgʻrisidagi qonunlar oʻrnini egallagan, — «kvazikodifikatsiya» namunasi.</li><li><b>Finlyandiya, Estoniya</b> — mutaxassislarga yuqori ishonch va maktablarning keng avtonomiyasiga ega ixcham ramka qonunlar.</li></ul><p><b>Kodifikatsiya afzalliklari</b>: tizimlilik, yagona terminologiya, fuqarolar uchun qulaylik. <b>Xavflar</b>: kattalik, oʻzgartirish kiritish murakkabligi, tez oʻzgaruvchan sohada normalarning «qotib qolishi».</p>`]},
{h:['Перспективы развития образовательного законодательства','Taʼlim qonunchiligini rivojlantirish istiqbollari'],b:[`<ul><li><b>Цифровое право в образовании</b>: регулирование онлайн-обучения, цифровых документов об образовании, электронных платформ, защиты персональных данных обучающихся.</li><li><b>Искусственный интеллект</b>: правила использования ИИ в обучении и оценивании (ориентир — Руководство ЮНЕСКО по генеративному ИИ, 2023; Регламент ЕС об ИИ, 2024, относящий ряд образовательных систем ИИ к категории высокого риска).</li><li><b>Академическая честность</b>: нормативное закрепление ответственности за плагиат, фальсификацию, «покупку» работ.</li><li><b>Профессиональные стандарты педагога</b> и система непрерывного профессионального развития.</li><li><b>Признание неформального обучения</b> и микроквалификаций, Национальная рамка квалификаций.</li><li><b>Инклюзия</b> — развитие норм о разумном приспособлении для лиц с инвалидностью.</li><li>Возможная <b>систематизация</b> образовательного законодательства (в т.ч. обсуждение идеи кодекса).</li></ul><div class="note">⚖️ Главная проблема — не только качество законов, но и <b>правоприменение</b> (implementation gap): разрыв между нормой и практикой. Знание законодательства — профессиональная компетенция каждого педагога.</div>`,`<ul><li><b>Taʼlimda raqamli huquq</b>: onlayn taʼlim, taʼlim haqidagi raqamli hujjatlar, elektron platformalar, taʼlim oluvchilarning shaxsiy maʼlumotlarini himoya qilishni tartibga solish.</li><li><b>Sunʼiy intellekt</b>: oʻqitish va baholashda SIdan foydalanish qoidalari (moʻljal — YUNESKOning generativ SI boʻyicha qoʻllanmasi, 2023; bir qator taʼlim SI tizimlarini yuqori xavf toifasiga kirituvchi YeIning SI toʻgʻrisidagi Reglamenti, 2024).</li><li><b>Akademik halollik</b>: plagiat, soxtalashtirish, ishlarni «sotib olish» uchun javobgarlikni meʼyoriy mustahkamlash.</li><li><b>Pedagogning kasb standartlari</b> va uzluksiz kasbiy rivojlanish tizimi.</li><li><b>Noformal taʼlim va mikromalakalarni tan olish</b>, Milliy malaka ramkasi.</li><li><b>Inklyuziya</b> — nogironligi boʻlgan shaxslar uchun oqilona moslashtirish haqidagi normalarni rivojlantirish.</li><li>Taʼlim qonunchiligini ehtimoliy <b>tizimlashtirish</b> (jumladan, kodeks gʻoyasini muhokama qilish).</li></ul><div class="note">⚖️ Asosiy muammo — faqat qonunlar sifati emas, balki <b>huquqni qoʻllash</b> (implementation gap): norma va amaliyot oʻrtasidagi tafovut. Qonunchilikni bilish — har bir pedagogning kasbiy kompetensiyasi.</div>`]}
],

cs:{t:[`<p>Директор школы поручает учителю математики в течение недели после уроков участвовать в уборке парка и собирать сведения о задолженностях семей по коммунальным платежам. Кроме того, завуч просит его «исправить» четвертные оценки двум ученикам, родители которых — влиятельные лица. Учитель обращается к вам за консультацией.</p>`,`<p>Maktab direktori matematika oʻqituvchisiga bir hafta davomida darslardan keyin bogʻni tozalashda qatnashishni va oilalarning kommunal toʻlovlar boʻyicha qarzlari haqida maʼlumot yigʻishni topshirmoqda. Bundan tashqari, direktor oʻrinbosari ota-onasi nufuzli shaxslar boʻlgan ikki oʻquvchining choraklik baholarini «tuzatib qoʻyishni» soʻramoqda. Oʻqituvchi sizdan maslahat soʻramoqda.</p>`],
