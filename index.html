title:['Рынок международных образовательных услуг','Xalqaro taʼlim xizmatlari bozori'],
sub:['Академическая мобильность, транснациональное образование, экспорт образования, Узбекистан как образовательный хаб','Akademik mobillik, transmilliy taʼlim, taʼlim eksporti, Oʻzbekiston taʼlim xabi sifatida'],
sec:[
{h:['Масштабы и структура рынка','Bozor koʻlami va tuzilmasi'],b:[`<p>Международное образование превратилось в одну из крупнейших отраслей мировой экономики услуг. По данным ЮНЕСКО, число иностранных студентов в мире выросло с примерно 2 млн в 2000 г. до более <b>6 млн</b> в 2020-х гг. Ведущие страны-реципиенты — <b>США, Великобритания, Австралия, Канада, Германия, Франция</b>, активно растут Китай, Турция, ОАЭ, Малайзия, Южная Корея.</p><p>Для ряда стран образование — важная статья экспорта: в Австралии международное образование традиционно входит в число крупнейших экспортных отраслей, в Великобритании и США иностранные студенты вносят в экономику десятки миллиардов долларов ежегодно.</p><h4>Сегменты рынка</h4><ul><li>Обучение иностранных студентов (degree mobility) и краткосрочная мобильность (credit mobility, Erasmus+);</li><li><b>Транснациональное образование (TNE)</b>: филиалы, франшизные и совместные программы, двойные дипломы;</li><li>Онлайн-образование и <b>EdTech</b> (Coursera, edX, FutureLearn и др.);</li><li>Языковое обучение, подготовительные программы, международные экзамены (IELTS, TOEFL, SAT);</li><li>Рекрутинговые агентства и консалтинг.</li></ul>`,`<p>Xalqaro taʼlim jahon xizmatlar iqtisodiyotining eng yirik tarmoqlaridan biriga aylandi. YUNESKO maʼlumotlariga koʻra, dunyodagi xorijiy talabalar soni 2000-yildagi taxminan 2 mln dan 2020-yillarda <b>6 mln</b> dan oshdi. Yetakchi qabul qiluvchi mamlakatlar — <b>AQSh, Buyuk Britaniya, Avstraliya, Kanada, Germaniya, Fransiya</b>; Xitoy, Turkiya, BAA, Malayziya, Janubiy Koreya faol oʻsmoqda.</p><p>Bir qator mamlakatlar uchun taʼlim muhim eksport moddasi: Avstraliyada xalqaro taʼlim anʼanaviy ravishda eng yirik eksport tarmoqlari qatoriga kiradi, Buyuk Britaniya va AQShda xorijiy talabalar iqtisodiyotga har yili oʻnlab milliard dollar qoʻshadi.</p><h4>Bozor segmentlari</h4><ul><li>Xorijiy talabalarni oʻqitish (degree mobility) va qisqa muddatli mobillik (credit mobility, Erasmus+);</li><li><b>Transmilliy taʼlim (TNE)</b>: filiallar, franshiza va qoʻshma dasturlar, ikki diplom;</li><li>Onlayn taʼlim va <b>EdTech</b> (Coursera, edX, FutureLearn va boshqalar);</li><li>Til oʻrgatish, tayyorlov dasturlari, xalqaro imtihonlar (IELTS, TOEFL, SAT);</li><li>Rekruting agentliklari va konsalting.</li></ul>`]},
{h:['Факторы конкурентоспособности и риски','Raqobatbardoshlik omillari va xavflar'],b:[`<p><b>Модель «push-pull»</b> объясняет мобильность: «выталкивающие» факторы страны происхождения (нехватка мест, качество, возможности) и «притягивающие» факторы страны назначения (репутация вузов, язык, стоимость, визовая политика, возможности трудоустройства, безопасность).</p><h4>Риски и проблемы</h4><ul><li><b>«Утечка мозгов»</b> из развивающихся стран;</li><li>Коммерциализация и снижение стандартов ради прибыли («дипломные мельницы»);</li><li>Неравенство: мобильность доступна прежде всего обеспеченным семьям;</li><li>Геополитические риски и изменения визовой политики;</li><li>Необходимость признания квалификаций и контроля качества TNE.</li></ul><p>Ответом становятся концепции <b>«интернационализации дома»</b> (internationalisation at home) — международное измерение для всех студентов без выезда — и <b>«циркуляции мозгов»</b>.</p>`,`<p><b>«Push-pull» modeli</b> mobillikni tushuntiradi: kelib chiqish mamlakatining «itaruvchi» omillari (oʻrinlar yetishmasligi, sifat, imkoniyatlar) va borish mamlakatining «tortuvchi» omillari (OTMlar obroʻsi, til, narx, viza siyosati, ishga joylashish imkoniyatlari, xavfsizlik).</p><h4>Xavflar va muammolar</h4><ul><li>Rivojlanayotgan mamlakatlardan <b>«aql oqib ketishi»</b>;</li><li>Foyda uchun tijoratlashuv va standartlarning pasayishi («diplom tegirmonlari»);</li><li>Tengsizlik: mobillik eng avvalo badavlat oilalar uchun ochiq;</li><li>Geosiyosiy xavflar va viza siyosatidagi oʻzgarishlar;</li><li>Malakalarni tan olish va TNE sifatini nazorat qilish zarurati.</li></ul><p>Bunga javob sifatida <b>«uyda baynalmilallashuv»</b> (internationalisation at home) — barcha talabalar uchun xorijga chiqmasdan xalqaro oʻlchov — va <b>«aqllar aylanishi»</b> konsepsiyalari paydo boʻlmoqda.</p>`]},
{h:['Узбекистан на международном образовательном рынке','Oʻzbekiston xalqaro taʼlim bozorida'],b:[`<p>Узбекистан одновременно является крупной страной-«донором» студентов (десятки тысяч молодых людей обучаются в России, Казахстане, Южной Корее, Турции, Германии, Великобритании и др.) и формирующимся <b>региональным образовательным хабом</b>.</p><ul><li><b>Филиалы зарубежных вузов</b> в Ташкенте и регионах: Westminster International University in Tashkent (2002), Turin Polytechnic University (2009), Inha University (2014), Webster University (2019), а также филиалы вузов России, Беларуси, Казахстана, Южной Кореи, Индии и др.</li><li><b>Совместные образовательные программы</b> с зарубежными вузами (в т.ч. ТОП-300) — двойные дипломы.</li><li>Программы привлечения иностранных студентов, особенно из Центральной Азии, Афганистана, Индии (в частности, в медицинские вузы).</li><li><b>Фонд «Эл-юрт умиди»</b> — инструмент «циркуляции мозгов»: финансирование обучения за рубежом с обязательством возвращения.</li></ul><div class="note">🎯 Стратегическая цель — превратить Узбекистан из экспортёра студентов в нетто-импортёра талантов через качество, доступную стоимость, безопасность и культурную привлекательность.</div>`,`<p>Oʻzbekiston bir vaqtning oʻzida talabalarning yirik «donor» mamlakati (oʻn minglab yoshlar Rossiya, Qozogʻiston, Janubiy Koreya, Turkiya, Germaniya, Buyuk Britaniya va boshqa mamlakatlarda tahsil olmoqda) va shakllanayotgan <b>mintaqaviy taʼlim xabi</b> hisoblanadi.</p><ul><li>Toshkent va viloyatlardagi <b>xorijiy OTM filiallari</b>: Toshkentdagi Westminster xalqaro universiteti (2002), Turin politexnika universiteti (2009), Inha universiteti (2014), Webster universiteti (2019), shuningdek Rossiya, Belarus, Qozogʻiston, Janubiy Koreya, Hindiston va boshqa mamlakatlar OTMlari filiallari.</li><li>Xorijiy OTMlar (jumladan, TOP-300) bilan <b>qoʻshma taʼlim dasturlari</b> — ikki diplom.</li><li>Xorijiy talabalarni, ayniqsa Markaziy Osiyo, Afgʻoniston, Hindistondan (xususan, tibbiyot OTMlariga) jalb qilish dasturlari.</li><li><b>«El-yurt umidi» jamgʻarmasi</b> — «aqllar aylanishi» vositasi: qaytish majburiyati bilan xorijda oʻqishni moliyalashtirish.</li></ul><div class="note">🎯 Strategik maqsad — sifat, hamyonbop narx, xavfsizlik va madaniy jozibadorlik orqali Oʻzbekistonni talabalar eksportyoridan iqtidorlarning sof importyoriga aylantirish.</div>`]}
],

cs:{t:[`<p>Вуз в Самарканде хочет привлечь 500 иностранных студентов из соседних стран за 3 года. Есть сильная медицинская школа и исторический кампус, но мало программ на английском языке и слабый сайт.</p>`,`<p>Samarqanddagi OTM 3 yil ichida qoʻshni mamlakatlardan 500 nafar xorijiy talaba jalb qilmoqchi. Kuchli tibbiyot maktabi va tarixiy kampus bor, ammo ingliz tilidagi dasturlar kam va sayt zaif.</p>`],

title:['Цифровизация образования','Taʼlimni raqamlashtirish'],
sub:['Этапы цифровой трансформации, модели смешанного обучения, DigCompEdu, «Цифровой Узбекистан-2030»','Raqamli transformatsiya bosqichlari, aralash taʼlim modellari, DigCompEdu, «Raqamli Oʻzbekiston-2030»'],
sec:[
{h:['От оцифровки к трансформации','Raqamlashtirishdan transformatsiyagacha'],b:[`<div class="kv"><div><b>Digitization</b>Оцифровка: перевод материалов в цифровой вид (PDF-учебники, сканы).</div><div><b>Digitalization</b>Цифровизация процессов: электронные журналы, LMS, онлайн-тесты.</div><div><b>Digital transformation</b>Трансформация: новые модели обучения, данные, персонализация, изменение ролей.</div></div><p>Модель <b>SAMR</b> (Р. Пуэнтедура) описывает уровни интеграции технологий: <b>Substitution</b> (замена) → <b>Augmentation</b> (улучшение) → <b>Modification</b> (изменение) → <b>Redefinition</b> (переопределение — задачи, невозможные без технологий). Модель <b>TPACK</b> (Мишра и Кёлер) подчёркивает интеграцию технологических, педагогических и предметных знаний учителя.</p><h4>Формы цифрового обучения</h4><ul><li><b>Смешанное обучение</b> (blended learning): ротационная модель, «перевёрнутый класс» (flipped classroom), гибкая модель;</li><li><b>MOOC</b> — массовые открытые онлайн-курсы (2012 г. назван New York Times «годом MOOC»: Coursera, edX, Udacity);</li><li><b>LMS</b> — системы управления обучением (Moodle, Canvas, Google Classroom);</li><li>Виртуальные лаборатории, VR/AR, геймификация, микрообучение.</li></ul>`,`<div class="kv"><div><b>Digitization</b>Raqamli shaklga keltirish: materiallarni raqamli koʻrinishga oʻtkazish (PDF darsliklar, skanlar).</div><div><b>Digitalization</b>Jarayonlarni raqamlashtirish: elektron jurnallar, LMS, onlayn testlar.</div><div><b>Digital transformation</b>Transformatsiya: yangi taʼlim modellari, maʼlumotlar, shaxsiylashtirish, rollarning oʻzgarishi.</div></div><p><b>SAMR</b> modeli (R. Puentedura) texnologiyalarni integratsiyalash darajalarini taʼriflaydi: <b>Substitution</b> (almashtirish) → <b>Augmentation</b> (yaxshilash) → <b>Modification</b> (oʻzgartirish) → <b>Redefinition</b> (qayta taʼriflash — texnologiyasiz imkonsiz vazifalar). <b>TPACK</b> modeli (Mishra va Kyoler) oʻqituvchining texnologik, pedagogik va fan bilimlari integratsiyasini taʼkidlaydi.</p><h4>Raqamli taʼlim shakllari</h4><ul><li><b>Aralash taʼlim</b> (blended learning): rotatsion model, «teskari sinf» (flipped classroom), moslashuvchan model;</li><li><b>MOOC</b> — ommaviy ochiq onlayn kurslar (2012-yil New York Times tomonidan «MOOC yili» deb atalgan: Coursera, edX, Udacity);</li><li><b>LMS</b> — taʼlimni boshqarish tizimlari (Moodle, Canvas, Google Classroom);</li><li>Virtual laboratoriyalar, VR/AR, geymifikatsiya, mikrotaʼlim.</li></ul>`]},
{h:['Цифровые компетенции педагога','Pedagogning raqamli kompetensiyalari'],b:[`<p>Европейская рамка <b>DigCompEdu</b> (2017) описывает <b>22 компетенции в 6 областях</b>: (1) профессиональная вовлечённость; (2) цифровые ресурсы; (3) преподавание и обучение; (4) оценивание; (5) расширение возможностей обучающихся; (6) развитие цифровой компетентности обучающихся. Уровни — от A1 «Новичок» до C2 «Первопроходец».</p><p>Рамка ЮНЕСКО <b>ICT CFT</b> (ИКТ-компетенции учителей) выделяет три этапа: приобретение знаний, углубление знаний, создание знаний.</p><h4>Риски цифровизации</h4><ul><li><b>Цифровой разрыв</b> — неравный доступ к устройствам и интернету;</li><li>Экранное время, здоровье и благополучие детей (доклад ЮНЕСКО GEM 2023 «Технологии в образовании: инструмент на чьих условиях?» призывает ставить педагогику выше технологий);</li><li>Защита персональных данных и кибербезопасность;</li><li>Иллюзия эффективности: технология без педагогического замысла не улучшает результаты.</li></ul>`,`<p><b>DigCompEdu</b> Yevropa ramkasi (2017) <b>6 sohada 22 ta kompetensiyani</b> taʼriflaydi: (1) kasbiy ishtirok; (2) raqamli resurslar; (3) oʻqitish va oʻrganish; (4) baholash; (5) taʼlim oluvchilar imkoniyatlarini kengaytirish; (6) taʼlim oluvchilarning raqamli kompetentligini rivojlantirish. Darajalar — A1 «Yangi boshlovchi»dan C2 «Kashshof»gacha.</p><p>YUNESKOning <b>ICT CFT</b> ramkasi (oʻqituvchilarning AKT kompetensiyalari) uch bosqichni ajratadi: bilim olish, bilimni chuqurlashtirish, bilim yaratish.</p><h4>Raqamlashtirish xavflari</h4><ul><li><b>Raqamli tafovut</b> — qurilmalar va internetdan teng boʻlmagan foydalanish;</li><li>Ekran vaqti, bolalar salomatligi va farovonligi (YUNESKOning GEM 2023 «Taʼlimda texnologiyalar: kimning shartlari asosidagi vosita?» maʼruzasi pedagogikani texnologiyadan ustun qoʻyishga chaqiradi);</li><li>Shaxsiy maʼlumotlarni himoya qilish va kiberxavfsizlik;</li><li>Samaradorlik illyuziyasi: pedagogik gʻoyasiz texnologiya natijalarni yaxshilamaydi.</li></ul>`]},
{h:['Цифровизация образования в Узбекистане','Oʻzbekistonda taʼlimni raqamlashtirish'],b:[`<ul><li><b>Стратегия «Цифровой Узбекистан — 2030»</b> (Указ УП-6079 от 05.10.2020) — цифровизация всех отраслей, включая образование, подготовка IT-кадров.</li><li>Проект <b>«Один миллион программистов»</b> и IT Park — массовое обучение цифровым навыкам.</li><li><b>Электронные дневники и журналы</b> в школах, платформы видеоуроков (опыт пандемии — телевизионные и онлайн-уроки).</li><li>Система <b>HEMIS</b> (Higher Education Management Information System) — цифровое управление вузами.</li><li>Цифровые сервисы приёма в вузы, электронные дипломы, платформы повышения квалификации педагогов.</li><li>Расширение подключения школ к интернету и оснащение компьютерными классами.</li></ul><div class="note">🎯 Ключ к успеху — не количество гаджетов, а цифровые компетенции педагогов и продуманный педагогический дизайн.</div>`,`<ul><li><b>«Raqamli Oʻzbekiston — 2030» strategiyasi</b> (PF-6079, 05.10.2020) — barcha tarmoqlarni, jumladan taʼlimni raqamlashtirish, IT kadrlar tayyorlash.</li><li><b>«Bir million dasturchi»</b> loyihasi va IT Park — raqamli koʻnikmalarga ommaviy oʻqitish.</li><li>Maktablarda <b>elektron kundaliklar va jurnallar</b>, video darslar platformalari (pandemiya tajribasi — televizion va onlayn darslar).</li><li><b>HEMIS</b> tizimi (Higher Education Management Information System) — OTMlarni raqamli boshqarish.</li><li>OTMlarga qabulning raqamli xizmatlari, elektron diplomlar, pedagoglar malakasini oshirish platformalari.</li><li>Maktablarni internetga ulashni kengaytirish va kompyuter sinflari bilan jihozlash.</li></ul><div class="note">🎯 Muvaffaqiyat kaliti — gadjetlar soni emas, balki pedagoglarning raqamli kompetensiyalari va puxta oʻylangan pedagogik dizayn.</div>`]}
],

C.seminars.push({id:'s3',label:['Семинар 3','Seminar 3'],icon:'🤖',grad:['#7c3aed','#db2777'],min:25,
title:['Искусственный интеллект в обучении','Taʼlimda sunʼiy intellekt'],
sub:['Генеративный ИИ, адаптивное обучение, руководства ЮНЕСКО, этика, риски и регулирование','Generativ SI, adaptiv taʼlim, YUNESKO qoʻllanmalari, etika, xavflar va tartibga solish'],
sec:[
{h:['ИИ в образовании: возможности','Taʼlimda SI: imkoniyatlar'],b:[`<p>С появлением <b>ChatGPT (ноябрь 2022 г.)</b> и других генеративных моделей ИИ стал массовым инструментом для студентов и педагогов. Однако ИИ в образовании (AIED) развивается с 1970-х гг. — от интеллектуальных обучающих систем до современных платформ.</p><h4>Основные направления применения</h4><ul><li><b>Интеллектуальные обучающие системы</b> (ITS) и <b>адаптивное обучение</b> — подстройка заданий под уровень ученика;</li><li><b>Персональный ИИ-тьютор</b> — объяснения, вопросы, обратная связь 24/7 (например, Khanmigo от Khan Academy);</li><li><b>Помощь педагогу</b>: генерация заданий, рубрик, планов уроков, дифференцированных материалов;</li><li><b>Аналитика обучения</b> (learning analytics) — раннее выявление риска неуспеваемости;</li><li><b>Инклюзия</b>: синтез речи, перевод, субтитры, поддержка обучающихся с особыми потребностями;</li><li>Автоматизация административной нагрузки.</li></ul>`,`<p><b>ChatGPT (2022-yil noyabr)</b> va boshqa generativ modellar paydo boʻlishi bilan SI talabalar va pedagoglar uchun ommaviy vositaga aylandi. Biroq taʼlimda SI (AIED) 1970-yillardan beri — intellektual oʻqitish tizimlaridan zamonaviy platformalargacha rivojlanib kelmoqda.</p><h4>Qoʻllashning asosiy yoʻnalishlari</h4><ul><li><b>Intellektual oʻqitish tizimlari</b> (ITS) va <b>adaptiv taʼlim</b> — topshiriqlarni oʻquvchi darajasiga moslashtirish;</li><li><b>Shaxsiy SI-tyutor</b> — 24/7 tushuntirishlar, savollar, fikr-mulohaza (masalan, Khan Academy ning Khanmigo si);</li><li><b>Pedagogga yordam</b>: topshiriqlar, rubrikalar, dars rejalari, tabaqalashtirilgan materiallar yaratish;</li><li><b>Taʼlim analitikasi</b> (learning analytics) — oʻzlashtirmaslik xavfini erta aniqlash;</li><li><b>Inklyuziya</b>: nutq sintezi, tarjima, subtitrlar, alohida ehtiyojli taʼlim oluvchilarni qoʻllab-quvvatlash;</li><li>Maʼmuriy yuklamani avtomatlashtirish.</li></ul>`]},
{h:['Риски и этика','Xavflar va etika'],b:[`<ul><li><b>«Галлюцинации»</b> — правдоподобные, но ложные ответы и выдуманные источники;</li><li><b>Предвзятость (bias)</b> моделей, воспроизводящая стереотипы;</li><li><b>Академическая честность</b> — выдача сгенерированного текста за собственный;</li><li><b>Конфиденциальность</b> данных обучающихся;</li><li><b>Когнитивная разгрузка</b> — риск утраты навыков мышления и письма при чрезмерной зависимости;</li><li><b>Неравенство</b> доступа к платным инструментам и языковое неравенство (слабая поддержка узбекского языка).</li></ul><h4>Международные ориентиры</h4><ul><li><b>Пекинский консенсус ЮНЕСКО по ИИ и образованию</b> (2019);</li><li><b>Руководство ЮНЕСКО по генеративному ИИ в образовании и исследованиях</b> (сентябрь 2023): человекоцентричный подход, рекомендация минимального возраста <b>13 лет</b> для самостоятельного использования, защита данных, валидация инструментов;</li><li><b>Рамки ИИ-компетенций ЮНЕСКО для учащихся и для учителей</b> (2024);</li><li><b>Регламент ЕС об ИИ</b> (AI Act, 2024) — системы ИИ для приёма, оценивания и прокторинга отнесены к категории <b>высокого риска</b>.</li></ul><p>В Узбекистане в 2024 г. утверждена <b>Стратегия развития технологий искусственного интеллекта до 2030 года</b>, предусматривающая и подготовку кадров, и внедрение ИИ в социальные сферы.</p>`,`<ul><li><b>«Gallyutsinatsiyalar»</b> — ishonarli, ammo yolgʻon javoblar va toʻqib chiqarilgan manbalar;</li><li>Modellarning stereotiplarni takrorlovchi <b>tarafkashligi (bias)</b>;</li><li><b>Akademik halollik</b> — yaratilgan matnni oʻziniki sifatida taqdim etish;</li><li>Taʼlim oluvchilar maʼlumotlarining <b>maxfiyligi</b>;</li><li><b>Kognitiv yengillashuv</b> — haddan tashqari qaramlikda fikrlash va yozish koʻnikmalarini yoʻqotish xavfi;</li><li>Pullik vositalardan foydalanishda <b>tengsizlik</b> va til tengsizligi (oʻzbek tilining zaif qoʻllab-quvvatlanishi).</li></ul><h4>Xalqaro moʻljallar</h4><ul><li><b>YUNESKOning SI va taʼlim boʻyicha Pekin konsensusi</b> (2019);</li><li><b>YUNESKOning taʼlim va tadqiqotda generativ SI boʻyicha qoʻllanmasi</b> (2023-yil sentabr): insonga yoʻnaltirilgan yondashuv, mustaqil foydalanish uchun minimal yosh <b>13 yosh</b> tavsiyasi, maʼlumotlarni himoya qilish, vositalarni validatsiya qilish;</li><li><b>YUNESKOning oʻquvchilar va oʻqituvchilar uchun SI-kompetensiyalar ramkalari</b> (2024);</li><li><b>YeIning SI toʻgʻrisidagi Reglamenti</b> (AI Act, 2024) — qabul, baholash va proktoring uchun SI tizimlari <b>yuqori xavf</b> toifasiga kiritilgan.</li></ul><p>Oʻzbekistonda 2024-yilda <b>Sunʼiy intellekt texnologiyalarini 2030-yilgacha rivojlantirish strategiyasi</b> tasdiqlandi, u kadrlar tayyorlashni ham, SIni ijtimoiy sohalarga joriy etishni ham nazarda tutadi.</p>`]},
{h:['Педагогика в эпоху ИИ','SI davrida pedagogika'],b:[`<p>ИИ не заменяет педагога, но меняет его роль: от «транслятора знаний» к <b>дизайнеру обучения, наставнику и эксперту по критическому мышлению</b>.</p><ul><li><b>Пересмотр оценивания</b>: устные защиты, работа в аудитории, оценка процесса (черновики, рефлексия), аутентичные задания, связанные с личным опытом;</li><li><b>Явные правила</b> использования ИИ в курсе (разрешено / с указанием / запрещено) и требование раскрывать использование ИИ;</li><li><b>ИИ-грамотность</b>: понимание принципов работы, проверка фактов, промпт-инжиниринг, этика;</li><li><b>«ИИ как спарринг-партнёр»</b>: генерация контраргументов, сократический диалог, проверка понимания.</li></ul><div class="note">🎯 Принцип «человек в контуре» (human-in-the-loop): решения об оценивании и судьбе обучающихся всегда принимает человек.</div>`,`<p>SI pedagogni almashtirmaydi, lekin uning rolini oʻzgartiradi: «bilim uzatuvchi»dan <b>taʼlim dizayneri, ustoz va tanqidiy fikrlash boʻyicha ekspertga</b>.</p><ul><li><b>Baholashni qayta koʻrib chiqish</b>: ogʻzaki himoyalar, auditoriyada ishlash, jarayonni baholash (qoralamalar, refleksiya), shaxsiy tajriba bilan bogʻliq autentik topshiriqlar;</li><li>Kursda SIdan foydalanishning <b>aniq qoidalari</b> (ruxsat etilgan / koʻrsatgan holda / taqiqlangan) va SIdan foydalanishni oshkor qilish talabi;</li><li><b>SI-savodxonlik</b>: ishlash tamoyillarini tushunish, faktlarni tekshirish, prompt-muhandislik, etika;</li><li><b>«SI sparring-sherik sifatida»</b>: qarshi dalillar yaratish, sokratik muloqot, tushunishni tekshirish.</li></ul><div class="note">🎯 «Inson konturda» (human-in-the-loop) tamoyili: baholash va taʼlim oluvchilar taqdiri haqidagi qarorlarni har doim inson qabul qiladi.</div>`]}
],

cs:{t:[`<p>Преподаватель обнаружил, что 12 из 25 эссе студентов очень похожи по структуре и стилю и, вероятно, написаны с помощью ИИ. В силлабусе курса правила использования ИИ не прописаны.</p>`,`<p>Oʻqituvchi 25 ta talaba inshosidan 12 tasi tuzilishi va uslubi boʻyicha juda oʻxshash ekanini va ehtimol SI yordamida yozilganini aniqladi. Kurs sillabusida SIdan foydalanish qoidalari yozilmagan.</p>`],
q:['Как поступить преподавателю?','Oʻqituvchi qanday yoʻl tutishi kerak?'],
o:[['Поставить всем 12 студентам «неуд» на основании детектора ИИ','Провести беседы и устные мини-защиты, обсудить с группой этику ИИ, ввести в силлабус чёткие правила (с раскрытием использования), перепроектировать задания с оценкой процесса','Игнорировать ситуацию','Запретить студентам пользоваться интернетом'],['SI detektori asosida barcha 12 talabaga «qoniqarsiz» qoʻyish','Suhbatlar va ogʻzaki mini-himoyalar oʻtkazish, guruh bilan SI etikasini muhokama qilish, sillabusga aniq qoidalar kiritish (foydalanishni oshkor qilish bilan), topshiriqlarni jarayonni baholash bilan qayta loyihalash','Vaziyatni eʼtiborsiz qoldirish','Talabalarga internetdan foydalanishni taqiqlash']],
best:1,fb:[['Детекторы ИИ ненадёжны (ложные срабатывания), а правила не были установлены — наказание несправедливо.','Оптимально: справедливость, образовательный подход, ясные правила и перепроектирование оценивания.','Игнорирование подрывает ценность оценивания и честность.','Запрет нереалистичен и лишает студентов полезных инструментов.'],['SI detektorlari ishonchsiz (notoʻgʻri ishlash holatlari), qoidalar esa belgilanmagan — jazo adolatsiz.','Eng maqbul: adolat, taʼlimiy yondashuv, aniq qoidalar va baholashni qayta loyihalash.','Eʼtiborsizlik baholash qadri va halollikka putur yetkazadi.','Taqiq real emas va talabalarni foydali vositalardan mahrum qiladi.']]},

title:['Soft skills в непрерывном образовании','Uzluksiz taʼlimda soft skills'],
sub:['Навыки будущего, эмоциональный интеллект, методы развития и оценивания гибких навыков','Kelajak koʻnikmalari, emotsional intellekt, moslashuvchan koʻnikmalarni rivojlantirish va baholash metodlari'],
sec:[
{h:['Что такое soft skills','Soft skills nima'],b:[`<p><b>Soft skills</b> (гибкие, надпрофессиональные навыки) — универсальные социально-эмоциональные и когнитивные навыки, обеспечивающие эффективность в любой профессии: коммуникация, работа в команде, критическое мышление, креативность, адаптивность, лидерство, самоорганизация, эмоциональный интеллект. В отличие от <b>hard skills</b> (профессиональных, технических), они переносимы между контекстами и медленнее устаревают.</p><p>По данным доклада ВЭФ <b>Future of Jobs 2025</b>, среди наиболее востребованных навыков — <b>аналитическое мышление</b>, <b>устойчивость, гибкость и адаптивность</b>, <b>лидерство и социальное влияние</b>, <b>креативное мышление</b>, <b>мотивация и самосознание</b>, а также технологическая грамотность и навыки работы с ИИ и большими данными.</p><p><b>Эмоциональный интеллект</b> (Д. Гоулман) включает пять компонентов: самосознание, саморегуляцию, мотивацию, эмпатию, социальные навыки.</p>`,`<p><b>Soft skills</b> (moslashuvchan, kasbdan yuqori koʻnikmalar) — har qanday kasbda samaradorlikni taʼminlovchi universal ijtimoiy-emotsional va kognitiv koʻnikmalar: kommunikatsiya, jamoada ishlash, tanqidiy fikrlash, kreativlik, moslashuvchanlik, yetakchilik, oʻzini tashkil etish, emotsional intellekt. <b>Hard skills</b> (kasbiy, texnik) dan farqli ravishda ular kontekstlar oʻrtasida koʻchiriladi va sekinroq eskiradi.</p><p>JIF ning <b>Future of Jobs 2025</b> maʼruzasiga koʻra, eng talab qilinadigan koʻnikmalar qatorida — <b>tahliliy fikrlash</b>, <b>barqarorlik, moslashuvchanlik va chaqqonlik</b>, <b>yetakchilik va ijtimoiy taʼsir</b>, <b>kreativ fikrlash</b>, <b>motivatsiya va oʻzini anglash</b>, shuningdek texnologik savodxonlik va SI hamda katta maʼlumotlar bilan ishlash koʻnikmalari bor.</p><p><b>Emotsional intellekt</b> (D. Goulman) beshta komponentni oʻz ichiga oladi: oʻzini anglash, oʻzini boshqarish, motivatsiya, empatiya, ijtimoiy koʻnikmalar.</p>`]},
{h:['Как развивать и оценивать soft skills','Soft skillsni qanday rivojlantirish va baholash'],b:[`<h4>Методы развития</h4><ul><li><b>Проектное обучение</b> (PBL) — реальные задачи в командах;</li><li><b>Кейс-метод</b> и <b>дебаты</b> — аргументация, критическое мышление;</li><li><b>Обучение служением</b> (service learning) — волонтёрские проекты в сообществе;</li><li>Ролевые игры, симуляции, геймификация;</li><li><b>Коучинг и наставничество</b>, рефлексивные дневники;</li><li>Внеучебная деятельность: студенческие клубы, самоуправление.</li></ul><h4>Оценивание</h4><ul><li><b>Рубрики</b> с поведенческими индикаторами;</li><li><b>Оценка 360°</b> и взаимооценивание;</li><li>Портфолио и цифровые бейджи;</li><li>Самооценка и рефлексия.</li></ul><div class="note">🎯 Для педагога soft skills — профессиональное ядро: коммуникация с учениками и родителями, эмпатия, управление конфликтами, стрессоустойчивость.</div>`,`<h4>Rivojlantirish metodlari</h4><ul><li><b>Loyihaviy taʼlim</b> (PBL) — jamoalarda real vazifalar;</li><li><b>Keys-metod</b> va <b>debatlar</b> — argumentatsiya, tanqidiy fikrlash;</li><li><b>Xizmat orqali oʻrganish</b> (service learning) — jamiyatdagi koʻngillilik loyihalari;</li><li>Rolli oʻyinlar, simulyatsiyalar, geymifikatsiya;</li><li><b>Kouching va ustozlik</b>, refleksiv kundaliklar;</li><li>Darsdan tashqari faoliyat: talabalar klublari, oʻzini oʻzi boshqarish.</li></ul><h4>Baholash</h4><ul><li>Xulq-atvor indikatorlariga ega <b>rubrikalar</b>;</li><li><b>360° baholash</b> va oʻzaro baholash;</li><li>Portfolio va raqamli beyjlar;</li><li>Oʻzini oʻzi baholash va refleksiya.</li></ul><div class="note">🎯 Pedagog uchun soft skills — kasbiy yadro: oʻquvchilar va ota-onalar bilan muloqot, empatiya, nizolarni boshqarish, stressga chidamlilik.</div>`]}

title:['Академическая честность','Akademik halollik'],
sub:['Фундаментальные ценности ICAI, виды нарушений, цитирование, политика вузов, честность в эпоху ИИ','ICAI fundamental qadriyatlari, buzilish turlari, iqtibos keltirish, OTMlar siyosati, SI davrida halollik'],
sec:[
{h:['Ценности и нарушения','Qadriyatlar va buzilishlar'],b:[`<p><b>Академическая честность</b> (academic integrity) — приверженность ценностям, обеспечивающим доверие к результатам обучения и исследований. Международный центр академической честности (<b>ICAI</b>) определяет <b>шесть фундаментальных ценностей</b>: <b>честность, доверие, справедливость, уважение, ответственность и мужество</b>.</p><h4>Основные виды нарушений</h4><div class="kv"><div><b>Плагиат</b>Использование чужих идей, текстов, данных без указания источника, включая самоплагиат.</div><div><b>Фабрикация</b>Выдумывание данных, источников, результатов.</div><div><b>Фальсификация</b>Искажение данных, изображений, результатов.</div><div><b>Списывание</b>Использование запрещённых материалов на экзамене.</div><div><b>Контрактное списывание</b>Заказ работ третьим лицам (гострайтинг), в т.ч. «под ключ».</div><div><b>Недекларированный ИИ</b>Выдача сгенерированного ИИ текста за собственный.</div></div>`,`<p><b>Akademik halollik</b> (academic integrity) — taʼlim va tadqiqot natijalariga ishonchni taʼminlovchi qadriyatlarga sodiqlik. Xalqaro akademik halollik markazi (<b>ICAI</b>) <b>oltita fundamental qadriyatni</b> belgilaydi: <b>halollik, ishonch, adolat, hurmat, masʼuliyat va jasorat</b>.</p><h4>Asosiy buzilish turlari</h4><div class="kv"><div><b>Plagiat</b>Boshqalarning gʻoya, matn, maʼlumotlaridan manba koʻrsatmasdan foydalanish, jumladan oʻz-oʻzini plagiat qilish.</div><div><b>Fabrikatsiya</b>Maʼlumotlar, manbalar, natijalarni toʻqib chiqarish.</div><div><b>Falsifikatsiya</b>Maʼlumotlar, tasvirlar, natijalarni buzib koʻrsatish.</div><div><b>Koʻchirish</b>Imtihonda taqiqlangan materiallardan foydalanish.</div><div><b>Kontrakt koʻchirish</b>Ishlarni uchinchi shaxslarga buyurtma qilish (gostrayting), jumladan «tayyor holda».</div><div><b>Oshkor qilinmagan SI</b>SI yaratgan matnni oʻziniki sifatida taqdim etish.</div></div>`]},
{h:['Культура честности: как её строить','Halollik madaniyati: uni qanday qurish kerak'],b:[`<ul><li><b>Обучение академическому письму</b>: цитирование, парафраз, оформление ссылок (APA 7, ГОСТ и др.), работа с источниками;</li><li><b>Политика академической честности</b> вуза с понятными процедурами и пропорциональными санкциями;</li><li><b>Кодекс чести</b> (honor code) — практика вузов США (Принстон, Стэнфорд, Университет Вирджинии);</li><li><b>Системы проверки заимствований</b> (Turnitin, Antiplagiat, iThenticate) — как инструмент, а не «приговор»;</li><li><b>Дизайн заданий</b>, снижающий мотивацию к списыванию: персонализированные, поэтапные, связанные с практикой;</li><li>Сети и ассоциации — <b>ENAI</b> (Европейская сеть академической честности), <b>COPE</b> (этика публикаций).</li></ul><div class="note">🎯 Академическая честность — не только запреты, но и <b>профессиональная идентичность</b>: будущий педагог, который ценит честность, воспитывает её у своих учеников.</div>`,`<ul><li><b>Akademik yozuvga oʻqitish</b>: iqtibos keltirish, parafraz, havolalarni rasmiylashtirish (APA 7, GOST va boshqalar), manbalar bilan ishlash;</li><li>Tushunarli tartib-taomillar va mutanosib sanksiyalarga ega OTMning <b>akademik halollik siyosati</b>;</li><li><b>Sharaf kodeksi</b> (honor code) — AQSh OTMlari amaliyoti (Prinston, Stenford, Virjiniya universiteti);</li><li><b>Oʻzlashtirishlarni tekshirish tizimlari</b> (Turnitin, Antiplagiat, iThenticate) — «hukm» emas, vosita sifatida;</li><li>Koʻchirishga motivatsiyani kamaytiruvchi <b>topshiriqlar dizayni</b>: shaxsiylashtirilgan, bosqichma-bosqich, amaliyot bilan bogʻliq;</li><li>Tarmoqlar va assotsiatsiyalar — <b>ENAI</b> (Yevropa akademik halollik tarmogʻi), <b>COPE</b> (nashr etikasi).</li></ul><div class="note">🎯 Akademik halollik — faqat taqiqlar emas, balki <b>kasbiy oʻziga xoslik</b>: halollikni qadrlaydigan boʻlajak pedagog uni oʻz oʻquvchilarida tarbiyalaydi.</div>`]}
],

cs:{t:[`<p>Студентка-отличница в последний момент обнаружила, что не успевает сдать курсовую. Однокурсник предлагает купить готовую работу «с оригинальностью 95%».</p>`,`<p>Aʼlochi talaba qiz soʻnggi daqiqada kurs ishini topshirishga ulgurmasligini bildi. Kursdoshi «95% originallikka ega» tayyor ishni sotib olishni taklif qilmoqda.</p>`],

name:['Закон Республики Узбекистан «Об образовании»','Oʻzbekiston Respublikasining «Taʼlim toʻgʻrisida»gi Qonuni'],
meta:['№ ЗРУ-637 · 23 сентября 2020 г.','OʻRQ-637-son · 2020-yil 23-sentabr'],
sum:['Базовый закон, определяющий принципы госполитики, систему, виды и формы образования, права и обязанности участников образовательного процесса. Заменил Закон 1997 г.','Davlat siyosati tamoyillari, taʼlim tizimi, turlari va shakllari, taʼlim jarayoni ishtirokchilarining huquq va majburiyatlarini belgilovchi asosiy qonun. 1997-yilgi Qonun oʻrnini egallagan.'],
items:[
{ic:'🎯',tag:['Общие положения','Umumiy qoidalar'],t:['Цель и сфера действия закона','Qonunning maqsadi va amal qilish sohasi'],b:['<p>Целью закона является регулирование отношений в сфере образования. Действие распространяется на все образовательные организации независимо от формы собственности (государственные, негосударственные, с участием иностранного капитала), а также на всех участников образовательного процесса.</p><p>Если международным договором Узбекистана установлены иные правила, применяются правила международного договора.</p>','<p>Qonunning maqsadi taʼlim sohasidagi munosabatlarni tartibga solishdan iborat. Uning amal qilishi mulkchilik shaklidan qatʼi nazar barcha taʼlim tashkilotlariga (davlat, nodavlat, xorijiy kapital ishtirokidagi), shuningdek taʼlim jarayonining barcha ishtirokchilariga tatbiq etiladi.</p><p>Agar Oʻzbekistonning xalqaro shartnomasida boshqacha qoidalar belgilangan boʻlsa, xalqaro shartnoma qoidalari qoʻllaniladi.</p>']},
{ic:'⚖️',tag:['Принципы','Tamoyillar'],t:['Основные принципы государственной политики в сфере образования','Taʼlim sohasidagi davlat siyosatining asosiy tamoyillari'],b:['<ul><li>признание приоритетности образования;</li><li>свобода выбора формы обучения;</li><li>недопустимость дискриминации в сфере образования;</li><li>обеспечение равных возможностей получения образования;</li><li>внедрение в образование национальных и общечеловеческих ценностей;</li><li>гуманистический и демократический характер образования и воспитания;</li><li><b>непрерывность и преемственность образования</b>;</li><li>светский характер системы образования;</li><li>общедоступность образования в пределах государственных образовательных стандартов;</li><li>обязательность общего среднего, среднего специального образования и одногодичной подготовки детей к начальному образованию;</li><li>единство и дифференцированный подход;</li><li>поощрение образованности и таланта;</li><li>сочетание государственного и общественного управления;</li><li>открытость и прозрачность образовательной деятельности.</li></ul><p class="hint">Перечень приведён в обобщённом виде для учебных целей.</p>','<ul><li>taʼlimning ustuvorligini eʼtirof etish;</li><li>taʼlim olish shaklini tanlash erkinligi;</li><li>taʼlim sohasida kamsitishga yoʻl qoʻymaslik;</li><li>taʼlim olishda teng imkoniyatlarni taʼminlash;</li><li>taʼlimga milliy va umuminsoniy qadriyatlarni joriy etish;</li><li>taʼlim va tarbiyaning insonparvar, demokratik xususiyati;</li><li><b>taʼlimning uzluksizligi va izchilligi</b>;</li><li>taʼlim tizimining dunyoviy xususiyati;</li><li>davlat taʼlim standartlari doirasida taʼlimning hamma uchun ochiqligi;</li><li>umumiy oʻrta, oʻrta maxsus taʼlim va bolalarni boshlangʻich taʼlimga bir yillik tayyorlashning majburiyligi;</li><li>yagonalik va tabaqalashtirilgan yondashuv;</li><li>bilimlilik va isteʼdodni ragʻbatlantirish;</li><li>davlat va jamoat boshqaruvining uygʻunligi;</li><li>taʼlim faoliyatining ochiqligi va shaffofligi.</li></ul><p class="hint">Roʻyxat oʻquv maqsadlari uchun umumlashgan holda keltirilgan.</p>']},
{ic:'🪜',tag:['Система','Tizim'],t:['Виды образования','Taʼlim turlari'],b:['<ol><li>Дошкольное образование и воспитание;</li><li>Общее среднее и среднее специальное образование;</li><li>Профессиональное образование (начальное, среднее, среднее специальное профессиональное);</li><li>Высшее образование (бакалавриат, магистратура);</li><li>Послевузовское образование;</li><li>Переподготовка и повышение квалификации кадров;</li><li>Внешкольное образование.</li></ol><div class="note">Эти виды образуют единую вертикаль непрерывного образования.</div>','<ol><li>Maktabgacha taʼlim va tarbiya;</li><li>Umumiy oʻrta va oʻrta maxsus taʼlim;</li><li>Professional taʼlim (boshlangʻich, oʻrta, oʻrta maxsus professional);</li><li>Oliy taʼlim (bakalavriat, magistratura);</li><li>Oliy taʼlimdan keyingi taʼlim;</li><li>Kadrlarni qayta tayyorlash va malakasini oshirish;</li><li>Maktabdan tashqari taʼlim.</li></ol><div class="note">Bu turlar uzluksiz taʼlimning yagona vertikalini tashkil etadi.</div>']},
{ic:'🧩',tag:['Формы','Shakllar'],t:['Формы получения образования','Taʼlim olish shakllari'],b:['<p>Закон предусматривает: очное обучение; заочное (с отрывом и без отрыва от производства); вечернее; <b>дистанционное</b>; <b>дуальное</b>; <b>семейное образование и самообразование</b>; экстернат; инклюзивное образование; обучение для взрослых; образование для одарённых и талантливых; для лиц, нуждающихся в длительном лечении.</p>','<p>Qonun quyidagilarni nazarda tutadi: kunduzgi taʼlim; sirtqi (ishlab chiqarishdan ajralgan va ajralmagan holda); kechki; <b>masofaviy</b>; <b>dual</b>; <b>oilaviy taʼlim va mustaqil taʼlim</b>; eksternat; inklyuziv taʼlim; kattalar taʼlimi; isteʼdodli va iqtidorlilar uchun taʼlim; uzoq muddatli davolanishga muhtoj shaxslar uchun taʼlim.</p>']},
{ic:'🧸',tag:['Дошкольное','Maktabgacha'],t:['Дошкольное образование и воспитание','Maktabgacha taʼlim va tarbiya'],b:['<p>Направлено на воспитание, обучение, развитие детей, подготовку к школе. Осуществляется до 7 лет в государственных и негосударственных ДОО, а также в семье. <b>Одногодичная подготовка детей 6 лет к начальному образованию — обязательна.</b></p>','<p>Bolalarni tarbiyalash, oʻqitish, rivojlantirish, maktabga tayyorlashga qaratilgan. 7 yoshgacha davlat va nodavlat MTTlarda, shuningdek oilada amalga oshiriladi. <b>6 yoshli bolalarni boshlangʻich taʼlimga bir yillik tayyorlash majburiydir.</b></p>']},
{ic:'🏫',tag:['Общее среднее','Umumiy oʻrta'],t:['Общее среднее и среднее специальное образование','Umumiy oʻrta va oʻrta maxsus taʼlim'],b:['<p>Общее среднее образование (1–11 классы) включает начальное (1–4), базовое среднее (5–9) и среднее (10–11) образование; обязательно и бесплатно в государственных школах. Среднее специальное образование осуществляется в академических лицеях на базе 9 классов (2 года).</p>','<p>Umumiy oʻrta taʼlim (1–11-sinflar) boshlangʻich (1–4), tayanch oʻrta (5–9) va oʻrta (10–11) taʼlimni oʻz ichiga oladi; davlat maktablarida majburiy va bepul. Oʻrta maxsus taʼlim akademik litseylarda 9-sinf negizida (2 yil) amalga oshiriladi.</p>']},
{ic:'🛠',tag:['Профессиональное','Professional'],t:['Профессиональное образование','Professional taʼlim'],b:['<div class="kv"><div><b>Начальное</b>Профессиональные школы, база 9 классов</div><div><b>Среднее</b>Колледжи, база 11 классов</div><div><b>Среднее специальное</b>Техникумы, база 11 классов</div></div><p>Возможна дуальная форма обучения совместно с работодателями.</p>','<div class="kv"><div><b>Boshlangʻich</b>Kasb-hunar maktablari, 9-sinf negizi</div><div><b>Oʻrta</b>Kollejlar, 11-sinf negizi</div><div><b>Oʻrta maxsus</b>Texnikumlar, 11-sinf negizi</div></div><p>Ish beruvchilar bilan birgalikda dual taʼlim shakli boʻlishi mumkin.</p>']},
{ic:'🎓',tag:['Высшее','Oliy'],t:['Высшее образование и автономия вузов','Oliy taʼlim va OTMlar avtonomiyasi'],b:['<p>Высшее образование включает <b>бакалавриат</b> и <b>магистратуру</b>. Закон закрепил академическую и организационно-управленческую самостоятельность вузов, право разрабатывать собственные образовательные программы на основе квалификационных требований, сетевую форму реализации программ и академическую мобильность.</p>','<p>Oliy taʼlim <b>bakalavriat</b> va <b>magistratura</b>ni oʻz ichiga oladi. Qonun OTMlarning akademik va tashkiliy-boshqaruv mustaqilligini, malaka talablari asosida oʻz taʼlim dasturlarini ishlab chiqish huquqini, dasturlarni amalga oshirishning tarmoq shaklini va akademik mobillikni mustahkamladi.</p>']},
{ic:'🔬',tag:['Послевузовское','Oliy taʼlimdan keyingi'],t:['Послевузовское образование','Oliy taʼlimdan keyingi taʼlim'],b:['<p>Направлено на удовлетворение потребностей в научных и научно-педагогических кадрах. Осуществляется в форме базовой докторантуры (PhD), докторантуры (DSc), самостоятельного соискательства в высших образовательных и научных организациях.</p>','<p>Ilmiy va ilmiy-pedagogik kadrlarga boʻlgan ehtiyojlarni qondirishga qaratilgan. Oliy taʼlim va ilmiy tashkilotlarda tayanch doktorantura (PhD), doktorantura (DSc), mustaqil izlanuvchilik shaklida amalga oshiriladi.</p>']},
{ic:'♻️',tag:['LLL','LLL'],t:['Переподготовка, повышение квалификации и внешкольное образование','Qayta tayyorlash, malaka oshirish va maktabdan tashqari taʼlim'],b:['<p>Переподготовка и повышение квалификации обеспечивают обновление профессиональных знаний и навыков в течение всей трудовой жизни. Внешкольное образование (кружки, центры «Баркамол авлод», музыкальные и спортивные школы) развивает интересы и таланты детей и молодёжи.</p>','<p>Qayta tayyorlash va malaka oshirish butun mehnat faoliyati davomida kasbiy bilim va koʻnikmalarni yangilashni taʼminlaydi. Maktabdan tashqari taʼlim (toʻgaraklar, «Barkamol avlod» markazlari, musiqa va sport maktablari) bolalar va yoshlarning qiziqish va isteʼdodlarini rivojlantiradi.</p>']},
{ic:'♿',tag:['Инклюзия','Inklyuziya'],t:['Инклюзивное образование','Inklyuziv taʼlim'],b:['<p>Обеспечение равного доступа к образованию для всех обучающихся с учётом разнообразия особых образовательных потребностей и индивидуальных возможностей, в том числе детей с инвалидностью.</p>','<p>Alohida taʼlim ehtiyojlari va individual imkoniyatlar xilma-xilligini hisobga olgan holda, jumladan nogironligi boʻlgan bolalar uchun barcha taʼlim oluvchilarga taʼlimdan teng foydalanishni taʼminlash.</p>']},
{ic:'👥',tag:['Участники','Ishtirokchilar'],t:['Права и обязанности участников образовательного процесса','Taʼlim jarayoni ishtirokchilarining huquq va majburiyatlari'],b:['<p>Обучающиеся имеют право на качественное образование, выбор формы обучения, безопасные условия, уважение достоинства, участие в управлении. Педагоги — на академическую свободу, профессиональное развитие, защиту чести и достоинства (развито в ЗРУ-901). Родители обязаны обеспечивать получение детьми обязательного образования.</p>','<p>Taʼlim oluvchilar sifatli taʼlim, taʼlim shaklini tanlash, xavfsiz sharoitlar, qadr-qimmatni hurmat qilish, boshqaruvda ishtirok etish huquqiga ega. Pedagoglar — akademik erkinlik, kasbiy rivojlanish, shaʼni va qadr-qimmatini himoya qilish huquqiga (OʻRQ-901 da rivojlantirilgan). Ota-onalar bolalarning majburiy taʼlim olishini taʼminlashi shart.</p>']},
{ic:'🏢',tag:['Организации','Tashkilotlar'],t:['Негосударственные образовательные организации и ГЧП','Nodavlat taʼlim tashkilotlari va DXSh'],b:['<p>Закон гарантирует равные права государственных и негосударственных образовательных организаций при соблюдении лицензионных требований и стандартов, поддерживает государственно-частное партнёрство в сфере образования.</p>','<p>Qonun litsenziya talablari va standartlarga rioya qilingan holda davlat va nodavlat taʼlim tashkilotlarining teng huquqlarini kafolatlaydi, taʼlim sohasida davlat-xususiy sheriklikni qoʻllab-quvvatlaydi.</p>']}
]};

C.laws.zru901={icon:'📗',grad:['#059669','#0d9488'],
name:['Закон Республики Узбекистан «О статусе педагога»','Oʻzbekiston Respublikasining «Pedagog maqomi toʻgʻrisida»gi Qonuni'],
meta:['№ ЗРУ-901 · 1 февраля 2024 г.','OʻRQ-901-son · 2024-yil 1-fevral'],
sum:['Впервые устанавливает права, обязанности и основные гарантии деятельности педагогов, принципы оплаты труда и социальной защиты. Принят Законодательной палатой 01.08.2023, одобрен Сенатом 29.09.2023.','Pedagoglarning huquq, majburiyatlari va faoliyatining asosiy kafolatlarini, mehnatga haq toʻlash va ijtimoiy himoya tamoyillarini ilk bor belgilaydi. Qonunchilik palatasi tomonidan 01.08.2023 da qabul qilingan, Senat tomonidan 29.09.2023 da maʼqullangan.'],
items:[
{ic:'📌',tag:['Сфера действия','Amal qilish sohasi'],t:['Сфера действия закона','Qonunning amal qilish sohasi'],b:['<p>Закон устанавливает права, обязанности и основные гарантии деятельности педагогов. Действует в отношении педагогов <b>государственных и негосударственных</b> образовательных организаций на территории Узбекистана.</p>','<p>Qonun pedagoglarning huquq, majburiyatlari va faoliyatining asosiy kafolatlarini belgilaydi. Oʻzbekiston hududidagi <b>davlat va nodavlat</b> taʼlim tashkilotlari pedagoglariga nisbatan amal qiladi.</p>']},
{ic:'👩‍🏫',tag:['Статус','Maqom'],t:['Кто является педагогом','Kim pedagog hisoblanadi'],b:['<p>Педагог — физическое лицо, осуществляющее в образовательной организации профессиональную деятельность в сфере образования и воспитания на основании трудового договора, имеющее соответствующее образование, профессиональную подготовку и высокие духовно-нравственные качества. Требования к профессиональному уровню определяются Классификатором должностей и <b>профессиональными стандартами педагога</b>.</p>','<p>Pedagog — taʼlim tashkilotida mehnat shartnomasi asosida taʼlim va tarbiya sohasida kasbiy faoliyatni amalga oshiruvchi, tegishli maʼlumot, kasbiy tayyorgarlik va yuksak maʼnaviy-axloqiy fazilatlarga ega jismoniy shaxs. Kasbiy darajaga talablar Lavozimlar klassifikatori va <b>pedagogning kasb standartlari</b> bilan belgilanadi.</p>']},
{ic:'✅',tag:['Права','Huquqlar'],t:['Основные права педагога','Pedagogning asosiy huquqlari'],b:['<ul><li>академическая свобода — выбор форм, методов и средств обучения в рамках программ;</li><li>профессиональное развитие и повышение квалификации;</li><li>объективная оценка знаний обучающихся без постороннего вмешательства;</li><li>защита чести, достоинства и деловой репутации;</li><li>безопасные условия труда;</li><li>участие в управлении образовательной организацией;</li><li>социальные гарантии и достойная оплата труда.</li></ul>','<ul><li>akademik erkinlik — dasturlar doirasida oʻqitish shakl, metod va vositalarini tanlash;</li><li>kasbiy rivojlanish va malaka oshirish;</li><li>taʼlim oluvchilar bilimini begona aralashuvsiz xolis baholash;</li><li>shaʼni, qadr-qimmati va ishchanlik obroʻsini himoya qilish;</li><li>xavfsiz mehnat sharoitlari;</li><li>taʼlim tashkilotini boshqarishda ishtirok etish;</li><li>ijtimoiy kafolatlar va munosib mehnat haqi.</li></ul>']},
{ic:'📋',tag:['Обязанности','Majburiyatlar'],t:['Обязанности педагога','Pedagogning majburiyatlari'],b:['<p>Качественно осуществлять обучение и воспитание в соответствии со стандартами; уважать честь и достоинство обучающихся; соблюдать нормы педагогической этики; систематически повышать квалификацию; формировать у обучающихся национальные и общечеловеческие ценности; обеспечивать безопасность обучающихся.</p>','<p>Standartlarga muvofiq taʼlim va tarbiyani sifatli amalga oshirish; taʼlim oluvchilarning shaʼni va qadr-qimmatini hurmat qilish; pedagogik etika normalariga rioya qilish; muntazam malaka oshirish; taʼlim oluvchilarda milliy va umuminsoniy qadriyatlarni shakllantirish; taʼlim oluvchilar xavfsizligini taʼminlash.</p>']},
{ic:'🚫',tag:['Гарантии','Kafolatlar'],t:['Запрет на привлечение к непрофильным работам','Noprofil ishlarga jalb qilishning taqiqlanishi'],b:['<p>Запрещается:</p><ul><li>привлекать педагога к работам, не связанным с его профессиональной деятельностью, в т.ч. к <b>благоустройству территорий и сельскохозяйственным работам</b>, учёту не трудоустроенных и не охваченных образованием несовершеннолетних;</li><li>требовать отчёты и сведения, не относящиеся к профессиональным обязанностям, в т.ч. о налогах, коммунальных платежах, кредитах населения, об обеспечении занятости выпускников;</li><li>принуждать педагога к приобретению товаров и услуг, удерживать средства из зарплаты без письменного согласия.</li></ul>','<p>Quyidagilar taqiqlanadi:</p><ul><li>pedagogni kasbiy faoliyatiga aloqador boʻlmagan ishlarga, jumladan <b>hududlarni obodonlashtirish va qishloq xoʻjaligi ishlariga</b>, ishga joylashmagan va taʼlim bilan qamrab olinmagan voyaga yetmaganlarni hisobga olishga jalb qilish;</li><li>kasbiy majburiyatlarga taalluqli boʻlmagan hisobot va maʼlumotlarni, jumladan aholining soliqlari, kommunal toʻlovlari, kreditlari, bitiruvchilar bandligini taʼminlash haqida talab qilish;</li><li>pedagogni tovar va xizmatlarni sotib olishga majburlash, yozma roziligisiz maoshdan mablagʻ ushlab qolish.</li></ul>']},
{ic:'🗳',tag:['Гарантии','Kafolatlar'],t:['Участие в общественно значимых мероприятиях','Ijtimoiy ahamiyatga ega tadbirlarda ishtirok'],b:['<p>Привлечение педагога к мероприятиям, имеющим политическую и социальную значимость (выборы, наблюдение на тестовых испытаниях, перепись населения, проверки и аттестация организаций образования и др.), осуществляется <b>только с его согласия</b>, на основании договора, <b>за дополнительную плату</b>, в свободное от работы время или с сохранением средней заработной платы.</p>','<p>Pedagogni siyosiy va ijtimoiy ahamiyatga ega tadbirlarga (saylovlar, test sinovlarida kuzatuvchilik, aholini roʻyxatga olish, taʼlim tashkilotlarini tekshirish va attestatsiya qilish va boshqalar) jalb qilish <b>faqat uning roziligi bilan</b>, shartnoma asosida, <b>qoʻshimcha haq evaziga</b>, ishdan boʻsh vaqtda yoki oʻrtacha ish haqi saqlangan holda amalga oshiriladi.</p>']},
{ic:'🛡',tag:['Защита','Himoya'],t:['Защита чести, достоинства и деловой репутации','Shaʼn, qadr-qimmat va ishchanlik obroʻsini himoya qilish'],b:['<p>Права, честь, достоинство и деловая репутация педагога находятся <b>под защитой государства</b>. Педагог освобождается от уплаты госпошлины при обращении в суд с иском о защите чести, достоинства и деловой репутации. При правонарушении, связанном с незаконным вмешательством в его деятельность, педагог вправе непосредственно обратиться в суд без составления протокола. Запрещено влиять на оценку педагогом знаний обучающихся.</p>','<p>Pedagogning huquqlari, shaʼni, qadr-qimmati va ishchanlik obroʻsi <b>davlat himoyasida</b>. Pedagog shaʼni, qadr-qimmati va ishchanlik obroʻsini himoya qilish toʻgʻrisidagi daʼvo bilan sudga murojaat qilganda davlat bojidan ozod qilinadi. Uning faoliyatiga qonunga xilof aralashish bilan bogʻliq huquqbuzarlikda pedagog bayonnoma tuzmasdan bevosita sudga murojaat qilishga haqli. Pedagogning taʼlim oluvchilar bilimini baholashiga taʼsir koʻrsatish taqiqlanadi.</p>']},
{ic:'🧑‍🤝‍🧑',tag:['Развитие','Rivojlanish'],t:['Наставничество для молодых педагогов','Yosh pedagoglar uchun ustozlik'],b:['<p>За лицом, впервые приступившим к профессиональной деятельности в общей средней образовательной организации, <b>на период одного учебного года</b> закрепляется опытный педагог для осуществления наставничества.</p>','<p>Umumiy oʻrta taʼlim tashkilotida kasbiy faoliyatni ilk bor boshlagan shaxsga <b>bir oʻquv yili davomida</b> ustozlikni amalga oshirish uchun tajribali pedagog biriktiriladi.</p>']},
{ic:'💼',tag:['Соцзащита','Ijtimoiy himoya'],t:['Социальные гарантии','Ijtimoiy kafolatlar'],b:['<p>Закон устанавливает принципы оплаты труда, вознаграждения и социальной защиты педагогов. В частности, дети педагогов принимаются в государственные дошкольные образовательные организации <b>на льготных основаниях</b>.</p>','<p>Qonun pedagoglar mehnatiga haq toʻlash, ragʻbatlantirish va ijtimoiy himoya tamoyillarini belgilaydi. Xususan, pedagoglarning farzandlari davlat maktabgacha taʼlim tashkilotlariga <b>imtiyozli asosda</b> qabul qilinadi.</p>']},
{ic:'⛔',tag:['Ограничения','Cheklovlar'],t:['Ограничения на занятие педагогической деятельностью','Pedagogik faoliyat bilan shugʻullanishga cheklovlar'],b:['<p>Запрещается принимать на должности, связанные с педагогической деятельностью, лиц, ранее осуждённых за совершение <b>умышленного преступления</b>. Это гарантирует безопасность обучающихся и доверие общества к профессии.</p>','<p>Ilgari <b>qasddan jinoyat</b> sodir etganlik uchun sudlangan shaxslarni pedagogik faoliyat bilan bogʻliq lavozimlarga qabul qilish taqiqlanadi. Bu taʼlim oluvchilar xavfsizligi va jamiyatning kasbga ishonchini kafolatlaydi.</p>']}
]};

C.laws.strat={icon:'🧭',grad:['#7c3aed','#2563eb'],
name:['Стратегии и концепции развития непрерывного образования Нового Узбекистана','Yangi Oʻzbekiston uzluksiz taʼlimini rivojlantirish strategiyalari va konsepsiyalari'],
meta:['2017–2030 · ключевые программные документы','2017–2030 · asosiy dasturiy hujjatlar'],
sum:['Хронология и приоритеты стратегических документов, определяющих развитие всех ступеней непрерывного образования.','Uzluksiz taʼlimning barcha bosqichlari rivojlanishini belgilovchi strategik hujjatlar xronologiyasi va ustuvorliklari.'],
items:[
{ic:'2017',tag:['УП-4947 · 07.02.2017','PF-4947 · 07.02.2017'],t:['Стратегия действий по пяти приоритетным направлениям развития (2017–2021)','Beshta ustuvor yoʻnalish boʻyicha Harakatlar strategiyasi (2017–2021)'],b:['<p>Положила начало масштабным реформам: в социальной сфере — расширение охвата дошкольным образованием, совершенствование системы общего среднего образования, повышение качества и доступности высшего образования, развитие науки.</p>','<p>Keng koʻlamli islohotlarni boshlab berdi: ijtimoiy sohada — maktabgacha taʼlim qamrovini kengaytirish, umumiy oʻrta taʼlim tizimini takomillashtirish, oliy taʼlim sifati va ommaboplik darajasini oshirish, fanni rivojlantirish.</p>']},
{ic:'2019',tag:['Дошкольное · 2019','Maktabgacha · 2019'],t:['Концепция развития системы дошкольного образования до 2030 года','Maktabgacha taʼlim tizimini 2030-yilgacha rivojlantirish konsepsiyasi'],b:['<p>Цели: всеобщий охват детей качественным дошкольным образованием, внедрение современных программ («Илк қадам»), развитие ГЧП и негосударственного сектора, подготовка квалифицированных воспитателей, обязательная подготовка к школе.</p>','<p>Maqsadlar: bolalarni sifatli maktabgacha taʼlim bilan toʻliq qamrab olish, zamonaviy dasturlarni («Ilk qadam») joriy etish, DXSh va nodavlat sektorni rivojlantirish, malakali tarbiyachilar tayyorlash, maktabga majburiy tayyorlash.</p>']},
{ic:'2019',tag:['УП-5712 · 29.04.2019','PF-5712 · 29.04.2019'],t:['Концепция развития системы народного образования до 2030 года','Xalq taʼlimi tizimini 2030-yilgacha rivojlantirish konsepsiyasi'],b:['<p>Ориентир — вхождение Узбекистана в число 30 ведущих стран по рейтингу PISA к 2030 году; обновление стандартов и программ, повышение статуса учителя, цифровизация школ, развитие инклюзивного образования.</p>','<p>Moʻljal — 2030-yilga kelib Oʻzbekistonning PISA reytingi boʻyicha yetakchi 30 ta mamlakat qatoriga kirishi; standartlar va dasturlarni yangilash, oʻqituvchi maqomini oshirish, maktablarni raqamlashtirish, inklyuziv taʼlimni rivojlantirish.</p>']},
{ic:'2019',tag:['УП-5847 · 08.10.2019','PF-5847 · 08.10.2019'],t:['Концепция развития системы высшего образования до 2030 года','Oliy taʼlim tizimini 2030-yilgacha rivojlantirish konsepsiyasi'],b:['<ul><li>повышение охвата высшим образованием (цель — свыше 50%);</li><li>переход на кредитно-модульную систему;</li><li>вхождение вузов в международные рейтинги (QS, THE);</li><li>академическая и финансовая самостоятельность вузов;</li><li>развитие ГЧП и негосударственных вузов, интернационализация.</li></ul>','<ul><li>oliy taʼlim qamrovini oshirish (maqsad — 50% dan ortiq);</li><li>kredit-modul tizimiga oʻtish;</li><li>OTMlarning xalqaro reytinglarga (QS, THE) kirishi;</li><li>OTMlarning akademik va moliyaviy mustaqilligi;</li><li>DXSh va nodavlat OTMlarni rivojlantirish, baynalmilallashuv.</li></ul>']},
{ic:'2020',tag:['УП-6079 · 05.10.2020','PF-6079 · 05.10.2020'],t:['Стратегия «Цифровой Узбекистан — 2030»','«Raqamli Oʻzbekiston — 2030» strategiyasi'],b:['<p>Цифровая трансформация отраслей, в т.ч. образования: подключение школ к интернету, электронные сервисы, массовое обучение цифровым навыкам и программированию, подготовка IT-кадров.</p>','<p>Tarmoqlarni, jumladan taʼlimni raqamli transformatsiya qilish: maktablarni internetga ulash, elektron xizmatlar, raqamli koʻnikmalar va dasturlashga ommaviy oʻqitish, IT kadrlar tayyorlash.</p>']},
{ic:'2022',tag:['УП-60 · 28.01.2022','PF-60 · 28.01.2022'],t:['Стратегия развития Нового Узбекистана на 2022–2026 годы','2022–2026-yillarga moʻljallangan Yangi Oʻzbekistonning taraqqiyot strategiyasi'],b:['<p>7 приоритетных направлений и 100 целей. В сфере образования: повышение охвата дошкольным образованием, улучшение качества школьного образования и статуса учителя, расширение охвата высшим образованием, развитие профессионального образования, науки и инноваций, подготовка кадров для экономики.</p>','<p>7 ta ustuvor yoʻnalish va 100 ta maqsad. Taʼlim sohasida: maktabgacha taʼlim qamrovini oshirish, maktab taʼlimi sifati va oʻqituvchi maqomini yaxshilash, oliy taʼlim qamrovini kengaytirish, professional taʼlim, fan va innovatsiyalarni rivojlantirish, iqtisodiyot uchun kadrlar tayyorlash.</p>']},
{ic:'2023',tag:['Конституция · 30.04.2023','Konstitutsiya · 30.04.2023'],t:['Новая редакция Конституции Республики Узбекистан','Oʻzbekiston Respublikasi Konstitutsiyasining yangi tahriri'],b:['<p>Принята на всенародном референдуме. Закрепляет право каждого на образование, бесплатность общего среднего образования в государственных организациях, заботу государства о развитии дошкольного образования, академическую свободу и самоуправление вузов, а также особую роль педагога в обществе.</p>','<p>Umumxalq referendumida qabul qilingan. Har kimning taʼlim olish huquqini, davlat tashkilotlarida umumiy oʻrta taʼlimning bepulligini, davlatning maktabgacha taʼlimni rivojlantirish haqidagi gʻamxoʻrligini, OTMlarning akademik erkinligi va oʻzini oʻzi boshqarishini, shuningdek jamiyatda pedagogning alohida rolini mustahkamlaydi.</p>']},
{ic:'2023',tag:['УП-158 · 11.09.2023','PF-158 · 11.09.2023'],t:['Стратегия «Узбекистан — 2030»','«Oʻzbekiston — 2030» strategiyasi'],b:['<p>Долгосрочные цели, включая: повышение охвата высшим образованием до 50%, создание условий для вхождения отечественных вузов в число ведущих в мировых рейтингах, развитие системы непрерывного профессионального обучения и переподготовки, повышение качества школьного образования и подготовки педагогов.</p>','<p>Uzoq muddatli maqsadlar, jumladan: oliy taʼlim qamrovini 50% ga yetkazish, mahalliy OTMlarning jahon reytinglarida yetakchilar qatoriga kirishi uchun sharoit yaratish, uzluksiz kasbiy oʻqitish va qayta tayyorlash tizimini rivojlantirish, maktab taʼlimi va pedagoglar tayyorlash sifatini oshirish.</p>']},
{ic:'2024',tag:['ЗРУ-901 · ИИ-2030','OʻRQ-901 · SI-2030'],t:['Закон о статусе педагога и Стратегия развития ИИ до 2030 года','Pedagog maqomi toʻgʻrisidagi qonun va SIni 2030-yilgacha rivojlantirish strategiyasi'],b:['<p>2024 год ознаменовался принятием ЗРУ-901 «О статусе педагога» и утверждением Стратегии развития технологий искусственного интеллекта до 2030 года, предусматривающей подготовку кадров в области ИИ и внедрение ИИ в образование.</p>','<p>2024-yil OʻRQ-901 «Pedagog maqomi toʻgʻrisida»gi Qonunning qabul qilinishi va SI sohasida kadrlar tayyorlash hamda SIni taʼlimga joriy etishni nazarda tutuvchi Sunʼiy intellekt texnologiyalarini 2030-yilgacha rivojlantirish strategiyasining tasdiqlanishi bilan ajralib turdi.</p>']}
]};

{q:['Какой номер имеет Указ о Стратегии развития Нового Узбекистана на 2022–2026 гг.?','2022–2026-yillarga moʻljallangan Yangi Oʻzbekiston taraqqiyot strategiyasi toʻgʻrisidagi Farmon raqami?'],o:[['УП-60','УП-158','УП-4947','УП-5847'],['PF-60','PF-158','PF-4947','PF-5847']],a:0,e:['УП-60 от 28.01.2022.','PF-60, 28.01.2022.']},

<script>
C.cases.cs_harvard={icon:'🏛',grad:['#a51c30','#5c0f1b'],uni:['Harvard University · США · QS/THE/ARWU ТОП-5','Harvard University · AQSh · QS/THE/ARWU TOP-5'],title:['Кейс-метод Гарвардской школы бизнеса','Garvard biznes maktabining keys-metodi'],
sec:[
{h:['История и суть метода','Metod tarixi va mohiyati'],b:['<p>Кейс-метод внедрён в Гарвардской школе бизнеса в 1920-е гг. под руководством декана <b>Уоллеса Донэма</b>, ранее — в Гарвардской школе права (К. Лэнгделл, 1870-е). Студенты за два года программы MBA разбирают сотни реальных управленческих ситуаций. Преподаватель не читает лекцию, а модерирует дискуссию: «Что бы вы сделали на месте руководителя?»</p>','<p>Keys-metod Garvard biznes maktabida 1920-yillarda dekan <b>Uolles Donem</b> rahbarligida, undan oldin esa Garvard huquq maktabida (K. Lengdell, 1870-yillar) joriy etilgan. Talabalar MBA dasturining ikki yili davomida yuzlab real boshqaruv vaziyatlarini tahlil qiladi. Oʻqituvchi maʼruza oʻqimaydi, balki munozarani moderatsiya qiladi: «Rahbar oʻrnida siz nima qilgan boʻlardingiz?»</p>']},
{h:['Как устроено занятие','Mashgʻulot qanday tuzilgan'],b:['<ol><li>Индивидуальная подготовка: чтение кейса (10–30 страниц) и анализ;</li><li>Обсуждение в малой учебной группе до занятия;</li><li>Дискуссия в аудитории (80–90 минут) — «холодный вызов» (cold call), дебаты, голосование;</li><li>Обобщение и выводы, связь с теорией.</li></ol><p>До половины итоговой оценки может определяться <b>вкладом в дискуссию</b>.</p>','<ol><li>Individual tayyorgarlik: keysni (10–30 sahifa) oʻqish va tahlil qilish;</li><li>Mashgʻulotdan oldin kichik oʻquv guruhida muhokama;</li><li>Auditoriyada munozara (80–90 daqiqa) — «sovuq chaqiruv» (cold call), debatlar, ovoz berish;</li><li>Umumlashtirish va xulosalar, nazariya bilan bogʻlash.</li></ol><p>Yakuniy bahoning yarmigacha qismi <b>munozaraga qoʻshgan hissa</b> bilan belgilanishi mumkin.</p>']}
],
lessons:['<p>Кейс-метод идеально подходит для подготовки педагогов: кейсы о конфликтах в классе, инклюзии, реформах. Важно создавать <b>собственные кейсы на материале узбекских школ и вузов</b> и обучать преподавателей фасилитации дискуссий.</p>','<p>Keys-metod pedagoglarni tayyorlash uchun juda mos: sinfdagi nizolar, inklyuziya, islohotlar haqidagi keyslar. <b>Oʻzbekiston maktablari va OTMlari materiallari asosida oʻz keyslarini</b> yaratish va oʻqituvchilarni munozaralarni fasilitatsiya qilishga oʻrgatish muhim.</p>'],
qs:[['Какие темы вашего курса можно преподавать через кейс-метод?','Kursingizning qaysi mavzularini keys-metod orqali oʻqitish mumkin?'],['Какие риски «холодного вызова» для студентов с высокой тревожностью?','Xavotiri yuqori talabalar uchun «sovuq chaqiruv»ning qanday xavflari bor?']]};

C.cases.cs_oxford={icon:'📜',grad:['#002147','#1e3a8a'],uni:['University of Oxford · Великобритания · THE №1','University of Oxford · Buyuk Britaniya · THE №1'],title:['Тьюториальная система Оксфорда','Oksford tyutorial tizimi'],
sec:[
{h:['Суть системы','Tizim mohiyati'],b:['<p><b>Тьюториал</b> — еженедельная встреча студента (или 2–3 студентов) с тьютором — экспертом в области. Студент заранее пишет эссе или решает задачи, а на встрече защищает свои аргументы в интенсивном диалоге. Система существует веками и является основой колледжской модели Оксфорда и Кембриджа (там она называется supervision).</p>','<p><b>Tyutorial</b> — talaba (yoki 2–3 talaba)ning soha eksperti boʻlgan tyutor bilan haftalik uchrashuvi. Talaba oldindan insho yozadi yoki masalalar yechadi, uchrashuvda esa jadal muloqotda oʻz dalillarini himoya qiladi. Tizim asrlar davomida mavjud va Oksford hamda Kembrijning kollej modeli asosi hisoblanadi (u yerda supervision deb ataladi).</p>']},
{h:['Эффекты','Samaralar'],b:['<ul><li>Развитие критического мышления и академического письма;</li><li>Индивидуальная обратная связь;</li><li>Формирование самостоятельности и ответственности;</li><li>Высокая академическая требовательность.</li></ul><p>Минус — высокая стоимость: модель требует большого числа преподавателей.</p>','<ul><li>Tanqidiy fikrlash va akademik yozuvni rivojlantirish;</li><li>Individual fikr-mulohaza;</li><li>Mustaqillik va masʼuliyatni shakllantirish;</li><li>Yuqori akademik talabchanlik.</li></ul><p>Kamchilik — yuqori xarajat: model koʻp oʻqituvchini talab qiladi.</p>']}
],
lessons:['<p>Адаптация для Узбекистана: <b>групповые тьюториалы</b> (4–6 студентов) в магистратуре и докторантуре, институт академических наставников, письменные эссе с устной защитой — как ответ на вызовы ИИ.</p>','<p>Oʻzbekiston uchun moslashtirish: magistratura va doktoranturada <b>guruhli tyutoriallar</b> (4–6 talaba), akademik ustozlar instituti, ogʻzaki himoyali yozma insholar — SI chaqiriqlariga javob sifatida.</p>'],
qs:[['Как сделать тьюториальную модель экономически доступной?','Tyutorial modelni iqtisodiy jihatdan qanday hamyonbop qilish mumkin?'],['Почему тьюториал устойчив к злоупотреблению ИИ?','Nima uchun tyutorial SIni suiisteʼmol qilishga chidamli?']]};

C.cases.cs_mit={icon:'🔓',grad:['#a31f34','#8a8b8c'],uni:['Massachusetts Institute of Technology · США · QS №1','Massachusetts Institute of Technology · AQSh · QS №1'],title:['MIT OpenCourseWare и культура открытого образования','MIT OpenCourseWare va ochiq taʼlim madaniyati'],
sec:[
{h:['Революция открытости','Ochiqlik inqilobi'],b:['<p>В 2001 г. MIT объявил о решении бесплатно публиковать материалы всех своих курсов в интернете — проект <b>OpenCourseWare (OCW)</b>. Сегодня доступны материалы более 2 500 курсов: конспекты, задания, экзамены, видеолекции. Проект стал основой движения <b>открытых образовательных ресурсов (OER)</b>, поддержанного ЮНЕСКО.</p><p>В 2012 г. MIT и Гарвард основали платформу <b>edX</b> — одну из пионеров MOOC.</p>','<p>2001-yilda MIT barcha kurslari materiallarini internetda bepul eʼlon qilish qarorini eʼlon qildi — <b>OpenCourseWare (OCW)</b> loyihasi. Bugun 2 500 dan ortiq kurs materiallari mavjud: konspektlar, topshiriqlar, imtihonlar, video maʼruzalar. Loyiha YUNESKO tomonidan qoʻllab-quvvatlangan <b>ochiq taʼlim resurslari (OER)</b> harakatining asosiga aylandi.</p><p>2012-yilda MIT va Garvard <b>edX</b> platformasiga asos soldi — MOOC kashshoflaridan biri.</p>']},
{h:['Значение для LLL','LLL uchun ahamiyati'],b:['<p>OCW и MOOC сделали знания ведущих университетов доступными для миллионов взрослых по всему миру, вне зависимости от возраста и места жительства, — это воплощение идеи <b>lifewide learning</b>. Появились микроквалификации (MicroMasters), позволяющие зачесть онлайн-курсы в магистратуре.</p>','<p>OCW va MOOC yetakchi universitetlar bilimlarini yosh va yashash joyidan qatʼi nazar dunyo boʻylab millionlab kattalar uchun ochiq qildi — bu <b>lifewide learning</b> gʻoyasining timsoli. Onlayn kurslarni magistraturada hisobga olish imkonini beruvchi mikromalakalar (MicroMasters) paydo boʻldi.</p>']}
],
lessons:['<p>Для Узбекистана: создание <b>национального репозитория открытых курсов на узбекском языке</b>, признание MOOC в кредитно-модульной системе, перевод лучших открытых курсов, лицензии Creative Commons для вузовских материалов.</p>','<p>Oʻzbekiston uchun: <b>oʻzbek tilidagi ochiq kurslarning milliy repozitoriysini</b> yaratish, kredit-modul tizimida MOOCni tan olish, eng yaxshi ochiq kurslarni tarjima qilish, OTM materiallari uchun Creative Commons litsenziyalari.</p>'],
qs:[['Почему MIT «отдаёт» знания бесплатно и не теряет ценность диплома?','Nima uchun MIT bilimlarni bepul «beradi» va diplom qadrini yoʻqotmaydi?'],['Какие барьеры мешают использованию MOOC в Узбекистане?','Oʻzbekistonda MOOCdan foydalanishga qanday toʻsiqlar xalaqit beradi?']]};

C.cases.cs_stanford={icon:'💡',grad:['#8c1515','#f59e0b'],uni:['Stanford University · США · QS/THE ТОП-5','Stanford University · AQSh · QS/THE TOP-5'],title:['Stanford d.school: дизайн-мышление в образовании','Stanford d.school: taʼlimda dizayn-tafakkur'],
sec:[
{h:['Институт дизайна им. Хассо Платтнера','Xasso Platner nomidagi Dizayn instituti'],b:['<p><b>d.school</b> основана в 2005 г. как междисциплинарная площадка, где студенты инженерных, медицинских, бизнес- и гуманитарных специальностей вместе решают реальные проблемы. Методология <b>дизайн-мышления</b> включает этапы: <b>эмпатия → определение проблемы → генерация идей → прототипирование → тестирование</b>.</p>','<p><b>d.school</b> 2005-yilda muhandislik, tibbiyot, biznes va gumanitar mutaxassislik talabalari birgalikda real muammolarni hal qiladigan fanlararo maydon sifatida tashkil etilgan. <b>Dizayn-tafakkur</b> metodologiyasi quyidagi bosqichlarni oʻz ichiga oladi: <b>empatiya → muammoni aniqlash → gʻoyalar yaratish → prototiplash → sinash</b>.</p>']},
{h:['Применение в педагогике','Pedagogikada qoʻllanilishi'],b:['<p>Учителя используют дизайн-мышление для перепроектирования уроков, школьных пространств и процессов. Ученики учатся работать с неопределённостью, сотрудничать и создавать решения для реальных людей — развиваются ключевые soft skills.</p>','<p>Oʻqituvchilar dizayn-tafakkurdan darslar, maktab makonlari va jarayonlarni qayta loyihalash uchun foydalanadi. Oʻquvchilar noaniqlik bilan ishlash, hamkorlik qilish va real odamlar uchun yechimlar yaratishni oʻrganadi — asosiy soft skills rivojlanadi.</p>']}
],
lessons:['<p>Для вузов Узбекистана: междисциплинарные проектные курсы, «лаборатории инноваций» с участием махалли, бизнеса и школ, студенческие стартапы в сфере EdTech.</p>','<p>Oʻzbekiston OTMlari uchun: fanlararo loyihaviy kurslar, mahalla, biznes va maktablar ishtirokidagi «innovatsiya laboratoriyalari», EdTech sohasidagi talabalar startaplari.</p>'],
qs:[['Какую проблему вашего вуза можно решить методом дизайн-мышления?','Universitetingizning qaysi muammosini dizayn-tafakkur metodi bilan hal qilish mumkin?'],['Почему этап «эмпатии» особенно важен для педагога?','Nima uchun «empatiya» bosqichi pedagog uchun ayniqsa muhim?']]};

C.cases.cs_helsinki={icon:'🤖',grad:['#0f3a7d','#00a3e0'],uni:['University of Helsinki · Финляндия · ТОП-120 QS','University of Helsinki · Finlyandiya · QS TOP-120'],title:['Elements of AI: ИИ-грамотность для всей нации','Elements of AI: butun millat uchun SI-savodxonlik'],
sec:[
{h:['Проект','Loyiha'],b:['<p>В 2018 г. Хельсинкский университет совместно с компанией Reaktor запустил бесплатный онлайн-курс <b>Elements of AI</b>. Изначальная цель — обучить основам ИИ 1% населения Финляндии. Цель была достигнута, курс переведён на десятки языков, его прошли более миллиона человек в 170+ странах. ЕС поддержал перевод на все официальные языки.</p>','<p>2018-yilda Xelsinki universiteti Reaktor kompaniyasi bilan birgalikda bepul <b>Elements of AI</b> onlayn kursini ishga tushirdi. Dastlabki maqsad — Finlyandiya aholisining 1 foizini SI asoslariga oʻqitish. Maqsadga erishildi, kurs oʻnlab tillarga tarjima qilindi, uni 170 dan ortiq mamlakatda bir milliondan ortiq kishi oʻtdi. YeI barcha rasmiy tillarga tarjimani qoʻllab-quvvatladi.</p>']},
{h:['Почему это работает','Nima uchun bu ishlaydi'],b:['<ul><li>Доступный язык без программирования;</li><li>Ориентация на взрослых любых профессий (LLL);</li><li>Сертификат и кредиты ECTS при успешном окончании;</li><li>Партнёрство университета, бизнеса и государства.</li></ul><p>Финляндия также известна обязательной магистратурой для учителей и высоким доверием к педагогам.</p>','<ul><li>Dasturlashsiz tushunarli til;</li><li>Har qanday kasbdagi kattalarga yoʻnalganlik (LLL);</li><li>Muvaffaqiyatli yakunlaganda sertifikat va ECTS kreditlari;</li><li>Universitet, biznes va davlat sherikligi.</li></ul><p>Finlyandiya oʻqituvchilar uchun majburiy magistratura va pedagoglarga yuqori ishonch bilan ham mashhur.</p>']}
],
lessons:['<p>Для Узбекистана: национальный курс ИИ-грамотности на узбекском языке для педагогов и государственных служащих в рамках Стратегии развития ИИ до 2030 года, интеграция в программы повышения квалификации.</p>','<p>Oʻzbekiston uchun: SIni 2030-yilgacha rivojlantirish strategiyasi doirasida pedagoglar va davlat xizmatchilari uchun oʻzbek tilida SI-savodxonlik milliy kursi, malaka oshirish dasturlariga integratsiya.</p>'],
qs:[['Какой процент населения Узбекистана реалистично обучить ИИ-грамотности за 3 года?','3 yil ichida Oʻzbekiston aholisining necha foizini SI-savodxonlikka oʻqitish real?'],['Какие партнёры нужны для такого проекта?','Bunday loyiha uchun qanday sheriklar kerak?']]};

C.cases.cs_nus={icon:'🦁',grad:['#003d7c','#ef7c00'],uni:['National University of Singapore · QS ТОП-10','National University of Singapore · QS TOP-10'],title:['NUS и SkillsFuture: экосистема обучения через всю жизнь','NUS va SkillsFuture: butun umr taʼlimi ekotizimi'],
sec:[
{h:['SkillsFuture','SkillsFuture'],b:['<p>В 2015 г. Сингапур запустил национальное движение <b>SkillsFuture</b>. Каждый гражданин от 25 лет получает <b>кредит SkillsFuture</b> на оплату одобренных курсов; для людей среднего возраста предусмотрены дополнительные выплаты и программы смены карьеры. Это — пример государственной политики LLL «на уровне каждого человека».</p>','<p>2015-yilda Singapur <b>SkillsFuture</b> milliy harakatini boshladi. 25 yoshdan oshgan har bir fuqaro maʼqullangan kurslar uchun toʻlovga <b>SkillsFuture krediti</b>ni oladi; oʻrta yoshdagilar uchun qoʻshimcha toʻlovlar va martabani oʻzgartirish dasturlari nazarda tutilgan. Bu «har bir inson darajasida» LLL davlat siyosatining namunasi.</p>']},
{h:['NUS Lifelong Learners','NUS Lifelong Learners'],b:['<p>Национальный университет Сингапура в 2018 г. запустил программу, по которой <b>выпускники сохраняют право на обучение в университете в течение 20 лет</b> после окончания — через короткие модули и сертификаты. Университет переосмысливает себя не как место «4-летнего обучения», а как партнёра человека на всю жизнь.</p>','<p>Singapur milliy universiteti 2018-yilda dastur ishga tushirdi, unga koʻra <b>bitiruvchilar tamomlaganidan keyin 20 yil davomida universitetda oʻqish huquqini saqlab qoladi</b> — qisqa modullar va sertifikatlar orqali. Universitet oʻzini «4 yillik taʼlim» joyi sifatida emas, balki insonning butun umrlik sherigi sifatida qayta anglaydi.</p>']}
],
lessons:['<p>Для Узбекистана: «образовательный ваучер» для взрослых, право выпускников на бесплатные модули повышения квалификации в своём вузе, центры непрерывного образования при университетах, признание микроквалификаций.</p>','<p>Oʻzbekiston uchun: kattalar uchun «taʼlim vaucheri», bitiruvchilarning oʻz OTMida bepul malaka oshirish modullariga huquqi, universitetlar huzurida uzluksiz taʼlim markazlari, mikromalakalarni tan olish.</p>'],
qs:[['Как профинансировать аналог SkillsFuture в Узбекистане?','Oʻzbekistonda SkillsFuture analogini qanday moliyalashtirish mumkin?'],['Чем «университет на всю жизнь» меняет роль преподавателя?','«Butun umrlik universitet» oʻqituvchi rolini qanday oʻzgartiradi?']]};

function toast(msg,type){const d=document.createElement('div');d.className='toast '+(type||'');d.innerHTML=msg;$('#toasts').appendChild(d);setTimeout(()=>d.classList.add('out'),2400);setTimeout(()=>d.remove(),2800)}
function confetti(n){const fx=$('#fx');const cols=['#2AABEE','#7B61FF','#22c55e','#f59e0b','#ef4444','#ec4899','#c9a227'];for(let i=0;i<(n||80);i++){const p=document.createElement('i');p.className='cf';p.style.left=Math.random()*100+'vw';p.style.background=cols[i%cols.length];p.style.setProperty('--dx',(Math.random()*240-120)+'px');p.style.setProperty('--rt',(Math.random()*900)+'deg');p.style.animationDuration=(1.9+Math.random()*1.7)+'s';p.style.animationDelay=(Math.random()*.35)+'s';fx.appendChild(p);setTimeout(()=>p.remove(),4200)}}

function modQuiz(m){if(Q&&Q.ctx.k==='mod'&&Q.ctx.id===m.id){renderQuiz();return}
const b=S.qbest[m.id];$('#sheetBody').innerHTML=wrap(`<div class="card p-6 text-center"><div class="text-5xl">📝</div><div class="font-extrabold text-[20px] mt-3" style="font-family:var(--head)">${t('test')}: ${L(m.title)}</div><p class="hint text-[14px] mt-2 leading-relaxed">${t('quizIntro')}</p><div class="flex justify-center gap-2 mt-4">${chip('📝 '+m.quiz.length+' '+t('qs'))}${b!=null?chip('🏅 '+t('best')+': '+b+'/'+m.quiz.length,'acc'):''}</div><button class="btn w-full mt-5" onclick="App.startModQuiz()">${t('startTest')} →</button></div>`)}
function startQuiz(ctx,qs,timer){if(Q&&Q.iv)clearInterval(Q.iv);Q={ctx,qs,i:0,correct:0,picked:null,order:qs.map(q=>shuffle(q.o[0].map((_,k)=>k))),timer:timer||0,left:timer||0,tickFor:-1,done:false,gain:0};Snd.open();renderQuiz()}
