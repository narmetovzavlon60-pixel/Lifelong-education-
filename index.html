<style>
:root{--bg:#eef1f5;--card:#ffffff;--card2:#f4f6f9;--text:#0f1419;--hint:#6f7a87;--accent:#2AABEE;--accent2:#7B61FF;--on:#ffffff;--ok:#16a34a;--bad:#e5484d;--warn:#f59e0b;--sep:rgba(15,20,25,.08);--shadow:0 6px 22px rgba(20,35,70,.07),0 1px 2px rgba(20,35,70,.05);--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;--head:var(--font);--r:20px}

html[data-skin=campus][data-mode=dark]{--bg:#060a1c;--card:#0f1635;--card2:#172051;--text:#eef1ff;--hint:#8f9ad0;--shadow:0 0 0 1px rgba(0,184,255,.12),0 10px 30px rgba(80,40,200,.25)}
html[data-skin=classic]{--accent:#8b1e3f;--accent2:#b8901c;--bg:#f4eee2;--card:#fffdf7;--card2:#f1e8d6;--text:#2b1d14;--hint:#7d6b5a;--head:Georgia,"Times New Roman",serif;--r:14px}
html[data-skin=classic][data-mode=dark]{--accent:#d0577a;--accent2:#e0bd4f;--bg:#17100d;--card:#231915;--card2:#2f221c;--text:#f3e9dc;--hint:#b09a85}
*{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);transition:background .35s,color .35s}
body{overscroll-behavior-y:none}
.hint{color:var(--hint)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);transition:background .35s}
.card2{background:var(--card2);border-radius:calc(var(--r) - 6px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);font-weight:650;border-radius:14px;padding:13px 18px;transition:transform .15s,opacity .2s,filter .2s;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;box-shadow:none}

.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--hint);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--on);background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.langsw{display:flex;background:var(--card2);border-radius:12px;padding:3px;flex:none;border:1px solid var(--sep)}
.langsw button{font-size:12.5px;font-weight:700;padding:6px 8px;border-radius:9px;color:var(--hint);transition:all .25s}
.langsw button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--sep)}
.nav-in{max-width:42rem;margin:0 auto;display:flex;justify-content:space-around}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--hint);padding:5px 2px;border-radius:14px;transition:color .25s}
.navbtn svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

.navbtn.on svg{transform:translateY(-2px) scale(1.08)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.pbar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}

.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.85,.2,1),visibility .42s}

.sheet-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--card);border-bottom:1px solid var(--sep)}

.seg-scroll{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--sep);scrollbar-width:none}
.seg-scroll::-webkit-scrollbar{display:none}

.segb{flex:none;font-size:13.5px;font-weight:650;padding:8px 13px;border-radius:12px;background:var(--card2);color:var(--hint);transition:all .25s}
.segb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}

.prose-l{font-size:16px;line-height:1.72}
.prose-l h3{font-family:var(--head);font-size:19px;font-weight:750;margin:30px 0 12px;display:flex;gap:10px;align-items:flex-start;line-height:1.3}
.prose-l h3 .sn{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;color:var(--on);background:linear-gradient(135deg,var(--accent),var(--accent2));margin-top:-1px}
.prose-l h4{font-weight:700;margin:16px 0 6px;font-size:16.5px}
.prose-l p{margin:0 0 13px}
.prose-l ul{list-style:disc;padding-left:22px;margin:0 0 13px}

.prose-l li::marker{color:var(--accent)}
.prose-l b,.prose-l strong{font-weight:700}

.prose-l .quote{border-left:3px solid var(--accent2);padding:4px 0 4px 14px;font-style:italic;color:var(--hint);margin:14px 0}
.prose-l .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.prose-l .kv>div{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);font-size:14px;line-height:1.5}
.prose-l .kv b{display:block;color:var(--accent);font-size:15px;margin-bottom:3px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;background:var(--card);border:1.5px solid var(--sep);border-radius:15px;margin-bottom:10px;font-size:15.5px;line-height:1.45;transition:all .25s;box-shadow:var(--shadow)}
.opt:not(:disabled):active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card));animation:shake .4s}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.expl{padding:13px 15px;border-radius:14px;font-size:14.5px;line-height:1.55;animation:pop .3s}
.expl.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.expl.bad{background:color-mix(in srgb,var(--bad) 10%,var(--card));border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.flip{perspective:1100px;height:200px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;box-shadow:var(--shadow)}
.flip .f{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on)}
.flip .b{background:var(--card);transform:rotateY(180deg);font-size:14px;line-height:1.5}
.ta{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5;color:var(--text);resize:vertical;outline:none;transition:border .2s}
.ta:focus{border-color:var(--accent)}
.inp{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:13px;padding:11px 14px;font-size:15px;color:var(--text);outline:none}
.inp:focus{border-color:var(--accent)}
details.law>summary{list-style:none;cursor:pointer}
details.law>summary::-webkit-details-marker{display:none}

.sw{width:50px;height:30px;border-radius:99px;background:var(--card2);position:relative;transition:background .25s;flex:none;border:1px solid var(--sep)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(20px)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(5,10,20,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-card{background:var(--card);border-radius:26px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:20px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 66px);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.toast{background:var(--card);color:var(--text);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .35s;transition:opacity .35s,transform .35s;border:1px solid var(--sep)}
.toast.xp{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);border:0}
.toast.out{opacity:0;transform:translateY(-10px)}
.cf{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:100;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rt))}}
.ring{transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:calc(var(--r) + 4px)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.timer{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;margin-bottom:12px}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 18%,transparent)}}
.lvl-emoji{font-size:84px;animation:bounceIn .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounceIn{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
mark{background:color-mix(in srgb,var(--warn) 40%,transparent);color:inherit;border-radius:4px;padding:0 2px}
html[data-skin=minimal][data-mode=dark] .hero.grad{background:linear-gradient(135deg,#2b2b2b,#0f0f0f)!important;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
html[data-skin=campus] .hero.grad{background:linear-gradient(135deg,#00b8ff,#a43bff 60%,#ff3dbb)}

html[data-skin=classic] .hero.grad::after{background:rgba(201,162,39,.18)}

<script>
/* ===== ТЕМА 1 ===== */
C.topics.push({id:'t1',n:1,icon:'♾️',grad:['#2AABEE','#7B61FF'],min:30,
title:['Современные проблемы и тенденции развития образования. Непрерывное образование (Lifelong Learning)','Taʼlim rivojlanishining zamonaviy muammolari va tendensiyalari. Uzluksiz taʼlim (Lifelong Learning)'],
sub:['Глобальные тренды, вызовы XXI века, теоретические основы концепции обучения через всю жизнь','Global trendlar, XXI asr chaqiriqlari, butun umr davomida taʼlim konsepsiyasining nazariy asoslari'],
sec:[
{h:['Образование в эпоху ускоряющихся перемен','Jadal oʻzgarishlar davridagi taʼlim'],b:[`<p>Образование XXI века функционирует в условиях, которые исследователи описывают аббревиатурами <b>VUCA</b> (изменчивость, неопределённость, сложность, неоднозначность) и <b>BANI</b> (хрупкость, тревожность, нелинейность, непостижимость). Технологические циклы сокращаются, а «период полураспада» профессиональных знаний в ряде отраслей составляет всего несколько лет. По оценке Всемирного экономического форума (Future of Jobs, 2023), около <b>44% ключевых навыков работников</b> будут существенно трансформированы в течение пяти лет.</p><p>В этих условиях модель «выучился один раз — работаешь всю жизнь» утрачивает актуальность. Образование перестаёт быть этапом жизни и становится её <b>постоянным измерением</b>. Именно поэтому непрерывное образование рассматривается сегодня не как дополнительная опция, а как базовый принцип организации образовательных систем.</p><h4>Ключевые мировые тенденции развития образования</h4><ul><li><b>Массовизация</b> — расширение охвата всеми уровнями образования, прежде всего высшим (переход к «универсальной» модели по М. Троу).</li><li><b>Цифровизация</b> — онлайн-обучение, платформы, искусственный интеллект, аналитика учебных данных.</li><li><b>Интернационализация</b> — академическая мобильность, совместные программы, филиалы зарубежных вузов.</li><li><b>Персонализация</b> — индивидуальные образовательные траектории, адаптивное обучение.</li><li><b>Компетентностная ориентация</b> — переход от знаний «о чём-то» к способности действовать.</li><li><b>Инклюзивность</b> — обеспечение равного доступа для всех категорий обучающихся.</li><li><b>Непрерывность</b> — интеграция всех ступеней и форм обучения в единую систему.</li></ul>`,`<p>XXI asr taʼlimi tadqiqotchilar <b>VUCA</b> (oʻzgaruvchanlik, noaniqlik, murakkablik, ikki xillik) va <b>BANI</b> (moʻrtlik, xavotir, nochiziqlilik, tushunib boʻlmaslik) qisqartmalari bilan taʼriflaydigan sharoitda faoliyat yuritmoqda. Texnologik sikllar qisqarmoqda, baʼzi sohalarda kasbiy bilimlarning «yarim yemirilish davri» bor-yoʻgʻi bir necha yilni tashkil etadi. Jahon iqtisodiy forumi (Future of Jobs, 2023) bahosiga koʻra, besh yil ichida xodimlarning <b>asosiy koʻnikmalarining qariyb 44 foizi</b> sezilarli darajada oʻzgaradi.</p><p>Bunday sharoitda «bir marta oʻqib, butun umr ishlash» modeli oʻz ahamiyatini yoʻqotadi. Taʼlim hayotning bir bosqichi boʻlmay, uning <b>doimiy oʻlchoviga</b> aylanadi. Shuning uchun bugungi kunda uzluksiz taʼlim qoʻshimcha imkoniyat emas, balki taʼlim tizimlarini tashkil etishning asosiy tamoyili sifatida qaraladi.</p><h4>Taʼlim rivojlanishining asosiy jahon tendensiyalari</h4><ul><li><b>Ommaviylashuv</b> — barcha taʼlim bosqichlari, eng avvalo oliy taʼlim qamrovining kengayishi (M. Trou boʻyicha «universal» modelga oʻtish).</li><li><b>Raqamlashtirish</b> — onlayn taʼlim, platformalar, sunʼiy intellekt, taʼlim maʼlumotlari tahlili.</li><li><b>Baynalmilallashuv</b> — akademik mobillik, qoʻshma dasturlar, xorijiy OTM filiallari.</li><li><b>Shaxsiylashtirish</b> — individual taʼlim trayektoriyalari, adaptiv oʻqitish.</li><li><b>Kompetensiyaviy yoʻnalganlik</b> — «nimadir haqida» bilimdan harakat qila olish qobiliyatiga oʻtish.</li><li><b>Inklyuzivlik</b> — barcha toifadagi taʼlim oluvchilar uchun teng imkoniyat.</li><li><b>Uzluksizlik</b> — barcha bosqich va shakllarni yagona tizimga birlashtirish.</li></ul>`]},
{h:['Ключевые проблемы современного образования','Zamonaviy taʼlimning asosiy muammolari'],b:[`<p>Несмотря на впечатляющий рост охвата, мировые образовательные системы сталкиваются с рядом системных проблем, которые международные организации (ЮНЕСКО, Всемирный банк, ОЭСР) фиксируют в своих докладах:</p><ol><li><b>Неравенство доступа.</b> По данным ЮНЕСКО, около <b>250 млн детей и подростков</b> в мире не посещают школу; разрывы между городом и селом, между богатыми и бедными семьями сохраняются.</li><li><b>«Кризис обучения» (learning poverty).</b> Всемирный банк фиксирует, что значительная доля детей в странах с низким и средним доходом к 10 годам не может прочитать и понять простой текст. Посещение школы ещё не означает обучения.</li><li><b>Несоответствие навыков рынку труда</b> (skills mismatch): выпускники обладают формальными дипломами, но не востребованными компетенциями.</li><li><b>Дефицит педагогов.</b> По оценке ЮНЕСКО, для достижения ЦУР-4 к 2030 году миру необходимо дополнительно <b>44 млн учителей</b>.</li><li><b>Недостаточное и неэффективное финансирование</b>, особенно дошкольного и профессионального образования.</li><li><b>Цифровой разрыв</b>, резко проявившийся в период пандемии COVID-19.</li><li><b>Кризис мотивации и благополучия</b> обучающихся, рост тревожности и выгорания педагогов.</li></ol><div class="note">💡 Ключевой вывод: проблема современного образования — не только в «количестве» (охвате), но прежде всего в <b>качестве, релевантности и справедливости</b>. Именно на эти три вызова отвечает концепция непрерывного образования.</div>`,`<p>Qamrovning sezilarli oʻsishiga qaramay, jahon taʼlim tizimlari xalqaro tashkilotlar (YUNESKO, Jahon banki, IHTT) oʻz maʼruzalarida qayd etayotgan bir qator tizimli muammolarga duch kelmoqda:</p><ol><li><b>Imkoniyatlar tengsizligi.</b> YUNESKO maʼlumotlariga koʻra, dunyoda qariyb <b>250 mln bola va oʻsmir</b> maktabga bormaydi; shahar va qishloq, boy va kambagʻal oilalar oʻrtasidagi tafovutlar saqlanib qolmoqda.</li><li><b>«Taʼlim inqirozi» (learning poverty).</b> Jahon banki past va oʻrta daromadli mamlakatlarda bolalarning katta qismi 10 yoshga kelib oddiy matnni oʻqib tushuna olmasligini qayd etadi. Maktabga qatnash hali taʼlim olish degani emas.</li><li><b>Koʻnikmalarning mehnat bozoriga mos kelmasligi</b> (skills mismatch): bitiruvchilarda rasmiy diplom bor, ammo talab qilinadigan kompetensiyalar yoʻq.</li><li><b>Pedagoglar tanqisligi.</b> YUNESKO bahosiga koʻra, 2030-yilgacha BRM-4 ga erishish uchun dunyoga qoʻshimcha <b>44 mln oʻqituvchi</b> kerak.</li><li><b>Yetarli boʻlmagan va samarasiz moliyalashtirish</b>, ayniqsa maktabgacha va kasbiy taʼlimda.</li><li><b>Raqamli tafovut</b>, COVID-19 pandemiyasi davrida keskin namoyon boʻldi.</li><li><b>Taʼlim oluvchilar motivatsiyasi va farovonligi inqirozi</b>, pedagoglarda xavotir va charchashning ortishi.</li></ol><div class="note">💡 Asosiy xulosa: zamonaviy taʼlim muammosi faqat «miqdor»da (qamrovda) emas, balki eng avvalo <b>sifat, dolzarblik va adolatda</b>. Aynan shu uchta chaqiriqqa uzluksiz taʼlim konsepsiyasi javob beradi.</div>`]},
{h:['Понятие непрерывного образования','Uzluksiz taʼlim tushunchasi'],b:[`<p><b>Непрерывное образование (Lifelong Learning, LLL)</b> — это целостный процесс обогащения образовательного (общекультурного, профессионального) потенциала личности в течение всей жизни, реализуемый через систему взаимосвязанных государственных и общественных институтов и соответствующий потребностям личности и общества.</p><p>Институт ЮНЕСКО по обучению на протяжении всей жизни (UIL, Гамбург) подчёркивает два измерения концепции:</p><div class="kv"><div><b>Lifelong</b>обучение «по вертикали» — от раннего детства до глубокой старости, через все возрастные этапы.</div><div><b>Lifewide</b>обучение «по горизонтали» — во всех сферах жизни: в учебном заведении, на работе, в семье, в сообществе, онлайн.</div></div><h4>Принципы непрерывного образования</h4><ul><li><b>Непрерывность и преемственность</b> — каждая ступень опирается на предыдущую и открывает путь к следующей;</li><li><b>Гибкость и вариативность</b> — множество форм, сроков, траекторий и способов обучения;</li><li><b>Открытость и доступность</b> — отсутствие «тупиковых» образовательных путей;</li><li><b>Индивидуализация</b> — учёт потребностей, опыта и целей взрослого обучающегося;</li><li><b>Интеграция</b> формального, неформального и информального обучения;</li><li><b>Признание результатов обучения</b> независимо от того, где и как они были получены.</li></ul><p>Важно: принцип «непрерывности и преемственности образования» закреплён среди основных принципов государственной политики в сфере образования в Законе Республики Узбекистан <b>«Об образовании» (ЗРУ-637 от 23.09.2020)</b>.</p>`,`<p><b>Uzluksiz taʼlim (Lifelong Learning, LLL)</b> — shaxsning taʼlimiy (umummadaniy, kasbiy) salohiyatini butun umr davomida boyitib borishning yaxlit jarayoni boʻlib, u oʻzaro bogʻliq davlat va jamoat institutlari tizimi orqali amalga oshiriladi hamda shaxs va jamiyat ehtiyojlariga mos keladi.</p><p>YUNESKOning Butun umr davomida taʼlim instituti (UIL, Gamburg) konsepsiyaning ikki oʻlchovini taʼkidlaydi:</p><div class="kv"><div><b>Lifelong</b>«vertikal» taʼlim — erta bolalikdan keksalikkacha, barcha yosh bosqichlari orqali.</div><div><b>Lifewide</b>«gorizontal» taʼlim — hayotning barcha sohalarida: taʼlim muassasasida, ishda, oilada, jamiyatda, onlayn.</div></div><h4>Uzluksiz taʼlim tamoyillari</h4><ul><li><b>Uzluksizlik va izchillik</b> — har bir bosqich oldingisiga tayanadi va keyingisiga yoʻl ochadi;</li><li><b>Moslashuvchanlik va variativlik</b> — turli shakl, muddat, trayektoriya va usullar;</li><li><b>Ochiqlik va ommaboplik</b> — «berk koʻcha» taʼlim yoʻllarining yoʻqligi;</li><li><b>Individuallashtirish</b> — kattalar taʼlim oluvchining ehtiyoj, tajriba va maqsadlarini hisobga olish;</li><li>Formal, noformal va informal taʼlimning <b>integratsiyasi</b>;</li><li>Taʼlim natijalari qayerda va qanday olinganidan qatʼi nazar <b>tan olinishi</b>.</li></ul><p>Muhim: «taʼlimning uzluksizligi va izchilligi» tamoyili Oʻzbekiston Respublikasining <b>«Taʼlim toʻgʻrisida»gi Qonunida (OʻRQ-637, 23.09.2020)</b> taʼlim sohasidagi davlat siyosatining asosiy tamoyillari qatorida mustahkamlangan.</p>`]},
{h:['Теоретические основы и история идеи','Gʻoyaning nazariy asoslari va tarixi'],b:[`<p>Идея образования через всю жизнь имеет глубокие корни. Ещё <b>Я.А. Коменский</b> в трактате «Пампедия» рассматривал всю жизнь человека как школу. На Востоке известен хадис «Ищите знания от колыбели до могилы», а мыслители Центральной Азии — <b>аль-Фараби, Ибн Сина, Алишер Навои</b> — подчёркивали самосовершенствование как непрерывный нравственный и интеллектуальный путь.</p><h4>Ключевые вехи современной концепции</h4><ul><li><b>1965</b> — <b>Поль Ленгран</b> представил в ЮНЕСКО доклад о «непрерывном образовании» (éducation permanente); в 1970 г. вышла его книга «An Introduction to Lifelong Education».</li><li><b>1972</b> — доклад комиссии <b>Эдгара Фора</b> «Учиться, чтобы быть» (Learning to Be): идея «обучающегося общества» (learning society).</li><li><b>1996</b> — доклад комиссии <b>Жака Делора</b> «Образование: сокрытое сокровище» с четырьмя «столпами»: <i>учиться познавать, учиться делать, учиться жить вместе, учиться быть</i>.</li><li><b>2000</b> — Меморандум Европейской комиссии о непрерывном образовании.</li><li><b>2015</b> — Инчхонская декларация и <b>Цель устойчивого развития 4</b>: «обеспечение всеохватного и справедливого качественного образования и поощрение возможности обучения на протяжении всей жизни для всех».</li></ul><h4>Психолого-педагогические теории</h4><ul><li><b>Андрагогика</b> (М. Ноулз): взрослый — самостоятельный субъект, опирающийся на опыт, ориентированный на решение реальных задач, обладающий внутренней мотивацией.</li><li><b>Экспериентальное обучение</b> (Д. Колб): цикл «конкретный опыт → рефлексия → концептуализация → активное экспериментирование».</li><li><b>Трансформативное обучение</b> (Дж. Мезироу): обучение как изменение смысловых перспектив через критическую рефлексию.</li><li><b>Коннективизм</b> (Дж. Сименс, С. Даунс): знание распределено в сетях, обучение — умение создавать и навигировать связи.</li></ul>`,`<p>Butun umr davomida taʼlim gʻoyasi chuqur ildizlarga ega. <b>Ya.A. Komenskiy</b> «Pampediya» risolasida inson hayotini toʻliq maktab sifatida koʻrgan. Sharqda «Beshikdan qabrgacha ilm izla» hikmati maʼlum, Markaziy Osiyo mutafakkirlari — <b>al-Forobiy, Ibn Sino, Alisher Navoiy</b> — oʻzini takomillashtirishni uzluksiz axloqiy va intellektual yoʻl sifatida taʼkidlaganlar.</p><h4>Zamonaviy konsepsiyaning asosiy bosqichlari</h4><ul><li><b>1965</b> — <b>Pol Lengran</b> YUNESKOda «uzluksiz taʼlim» (éducation permanente) haqida maʼruza qildi; 1970-yilda uning «An Introduction to Lifelong Education» kitobi chiqdi.</li><li><b>1972</b> — <b>Edgar For</b> komissiyasining «Boʻlish uchun oʻrganish» (Learning to Be) maʼruzasi: «oʻrganuvchi jamiyat» (learning society) gʻoyasi.</li><li><b>1996</b> — <b>Jak Delor</b> komissiyasining «Taʼlim: yashirin xazina» maʼruzasi va toʻrt «ustun»: <i>bilishni oʻrganish, qilishni oʻrganish, birga yashashni oʻrganish, boʻlishni oʻrganish</i>.</li><li><b>2000</b> — Yevropa komissiyasining uzluksiz taʼlim toʻgʻrisidagi Memorandumi.</li><li><b>2015</b> — Inchxon deklaratsiyasi va <b>Barqaror rivojlanish maqsadi 4</b>: «inklyuziv va adolatli sifatli taʼlimni taʼminlash hamda hamma uchun butun umr davomida taʼlim olish imkoniyatlarini ragʻbatlantirish».</li></ul><h4>Psixologik-pedagogik nazariyalar</h4><ul><li><b>Andragogika</b> (M. Nouls): katta yoshli inson — tajribaga tayanuvchi, real masalalarni hal etishga yoʻnalgan, ichki motivatsiyaga ega mustaqil subyekt.</li><li><b>Tajribaviy taʼlim</b> (D. Kolb): «aniq tajriba → refleksiya → kontseptualizatsiya → faol tajriba» sikli.</li><li><b>Transformativ taʼlim</b> (J. Mezirou): tanqidiy refleksiya orqali maʼno istiqbollarini oʻzgartirish sifatidagi taʼlim.</li><li><b>Konnektivizm</b> (J. Simens, S. Dauns): bilim tarmoqlarda taqsimlangan, taʼlim — aloqalarni yaratish va ularda harakatlanish mahorati.</li></ul>`]},
{h:['Формальное, неформальное и информальное обучение. LLL в Узбекистане','Formal, noformal va informal taʼlim. Oʻzbekistonda LLL'],b:[`<div class="kv"><div><b>Формальное</b>Институционализированное, целенаправленное обучение в образовательных организациях, завершающееся признанным документом (аттестат, диплом).</div><div><b>Неформальное</b>Организованное и целенаправленное, но вне системы формальных квалификаций: курсы, тренинги, кружки, MOOC, корпоративное обучение.</div><div><b>Информальное</b>Спонтанное обучение в повседневной жизни, на работе, в семье, через общение и медиа; часто неосознаваемое.</div></div><p>Исследования показывают, что значительная часть профессиональных компетенций взрослого формируется именно в неформальной и информальной среде. Поэтому современные системы развивают механизмы <b>признания предшествующего обучения (RPL, Recognition of Prior Learning)</b>, <b>микроквалификации (micro-credentials)</b>, цифровые бейджи и национальные рамки квалификаций, позволяющие «конвертировать» любые результаты обучения в признаваемые достижения.</p><h4>Непрерывное образование в Республике Узбекистан</h4><p>Законом «Об образовании» (ЗРУ-637) определены виды образования, образующие единую непрерывную вертикаль: <b>дошкольное образование и воспитание; общее среднее и среднее специальное образование; профессиональное образование; высшее образование; послевузовское образование; переподготовка и повышение квалификации кадров; внешкольное образование</b>. Закон также признаёт семейное образование и самообразование, дистанционную и дуальную формы обучения.</p><p>Отечественные исследователи, на труды которых опирается программа курса (<b>М.Х. Умарова, З.Б. Файзуллаева, B.N. Qurbonova, F.O. Mirzayeva</b> и др.), рассматривают непрерывное образование как фактор устойчивого развития общества, подчёркивая значение преемственности ступеней, профессионального развития педагога и формирования у обучающихся потребности в постоянном самообразовании.</p><div class="note">🎯 Формула LLL: <b>«учиться всегда, везде и всему, что необходимо для полноценной жизни и профессиональной самореализации»</b>.</div>`,`<div class="kv"><div><b>Formal</b>Taʼlim tashkilotlarida institutsionallashgan, maqsadli taʼlim; tan olingan hujjat (attestat, diplom) bilan yakunlanadi.</div><div><b>Noformal</b>Tashkil etilgan va maqsadli, ammo rasmiy malakalar tizimidan tashqarida: kurslar, treninglar, toʻgaraklar, MOOC, korporativ taʼlim.</div><div><b>Informal</b>Kundalik hayotda, ishda, oilada, muloqot va media orqali stixiyali oʻrganish; koʻpincha anglanmaydi.</div></div><p>Tadqiqotlar katta yoshli insonning kasbiy kompetensiyalarining katta qismi aynan noformal va informal muhitda shakllanishini koʻrsatadi. Shuning uchun zamonaviy tizimlar <b>oldingi taʼlimni tan olish (RPL)</b>, <b>mikromalakalar (micro-credentials)</b>, raqamli beyjlar va milliy malaka ramkalari mexanizmlarini rivojlantirmoqda — ular har qanday taʼlim natijasini tan olinadigan yutuqqa «aylantirish» imkonini beradi.</p><h4>Oʻzbekiston Respublikasida uzluksiz taʼlim</h4><p>«Taʼlim toʻgʻrisida»gi Qonun (OʻRQ-637) yagona uzluksiz vertikalni tashkil etuvchi taʼlim turlarini belgilagan: <b>maktabgacha taʼlim va tarbiya; umumiy oʻrta va oʻrta maxsus taʼlim; professional taʼlim; oliy taʼlim; oliy taʼlimdan keyingi taʼlim; kadrlarni qayta tayyorlash va malakasini oshirish; maktabdan tashqari taʼlim</b>. Qonun oilaviy taʼlim va mustaqil taʼlimni, masofaviy va dual taʼlim shakllarini ham eʼtirof etadi.</p><p>Kurs dasturi tayanadigan mahalliy tadqiqotchilar (<b>M.X. Umarova, Z.B. Fayzullayeva, B.N. Qurbonova, F.O. Mirzayeva</b> va boshqalar) uzluksiz taʼlimni jamiyat barqaror rivojlanishining omili sifatida koʻrib, bosqichlar izchilligi, pedagogning kasbiy rivojlanishi va taʼlim oluvchilarda doimiy mustaqil taʼlimga ehtiyojni shakllantirish ahamiyatini taʼkidlaydilar.</p><div class="note">🎯 LLL formulasi: <b>«toʻlaqonli hayot va kasbiy oʻzini namoyon qilish uchun zarur boʻlgan hamma narsani doimo, hamma joyda oʻrganish»</b>.</div>`]}

cs:{t:[`<p>Гулнора Рахимовна, 46 лет, учитель истории в сельской школе Самаркандской области со стажем 22 года. Школа получила интерактивные панели и подключилась к электронному журналу, но педагог чувствует, что её цифровые навыки устарели. Ближайшее плановое повышение квалификации — только через два года, у школы нет средств на дополнительные курсы. Молодые коллеги предлагают помощь, но времени мало.</p>`,`<p>Gulnora Rahimovna, 46 yosh, Samarqand viloyatidagi qishloq maktabida 22 yillik tajribaga ega tarix oʻqituvchisi. Maktab interaktiv panellar oldi va elektron jurnalga ulandi, biroq pedagog raqamli koʻnikmalari eskirganini his qilmoqda. Navbatdagi rejali malaka oshirish faqat ikki yildan keyin, maktabda qoʻshimcha kurslar uchun mablagʻ yoʻq. Yosh hamkasblar yordam taklif qilmoqda, ammo vaqt kam.</p>`],
q:['Какая стратегия наиболее полно соответствует принципам непрерывного образования?','Qaysi strategiya uzluksiz taʼlim tamoyillariga eng toʻliq mos keladi?'],
o:[['Дождаться планового повышения квалификации через два года','Сочетать бесплатные онлайн-курсы и микроквалификации, школьное профессиональное сообщество (взаимообучение с молодыми коллегами) и рефлексивный дневник, затем подтвердить результаты на плановых курсах','Попросить учеников самостоятельно работать с панелью вместо учителя','Отказаться от цифровых инструментов и вести уроки традиционно'],['Ikki yildan keyingi rejali malaka oshirishni kutish','Bepul onlayn kurslar va mikromalakalarni, maktab kasbiy hamjamiyatini (yosh hamkasblar bilan oʻzaro oʻqitish) va refleksiv kundalikni birlashtirish, soʻng natijalarni rejali kurslarda tasdiqlash','Oʻqituvchi oʻrniga oʻquvchilardan panel bilan mustaqil ishlashni soʻrash','Raqamli vositalardan voz kechib, darslarni anʼanaviy oʻtish']],
best:1,fb:[['Пассивное ожидание противоречит принципу непрерывности: навыки нужны сейчас, а формальное обучение — лишь одна из форм.','Оптимально: интеграция формального, неформального и информального обучения, опора на сообщество и рефлексию (андрагогика + Колб).','Это перекладывание ответственности; учитель утрачивает профессиональную позицию.','Отказ от развития ведёт к профессиональной стагнации и снижению качества обучения.'],['Passiv kutish uzluksizlik tamoyiliga zid: koʻnikmalar hozir kerak, formal taʼlim esa shakllardan faqat biri.','Eng maqbul: formal, noformal va informal taʼlim integratsiyasi, hamjamiyat va refleksiyaga tayanish (andragogika + Kolb).','Bu masʼuliyatni boshqalarga yuklash; oʻqituvchi kasbiy mavqeini yoʻqotadi.','Rivojlanishdan voz kechish kasbiy turgʻunlik va taʼlim sifatining pasayishiga olib keladi.']]},
rf:[['Какой опыт неформального или информального обучения за последний год сильнее всего повлиял на ваше профессиональное развитие? Почему?','Soʻnggi bir yildagi qaysi noformal yoki informal taʼlim tajribasi kasbiy rivojlanishingizga eng kuchli taʼsir qildi? Nima uchun?'],['Составьте набросок личного плана непрерывного образования на 5 лет: какие компетенции, через какие формы и как вы будете подтверждать результаты?','5 yillik shaxsiy uzluksiz taʼlim rejangiz eskizini tuzing: qaysi kompetensiyalar, qaysi shakllar orqali va natijalarni qanday tasdiqlaysiz?']],

{h:['Система образования: сущность и системный подход','Taʼlim tizimi: mohiyati va tizimli yondashuv'],b:[`<p>Понятие <b>«система»</b> в науке связано с общей теорией систем <b>Л. фон Берталанфи</b>: система — это совокупность взаимосвязанных элементов, образующих целостность, обладающую новыми (эмерджентными) свойствами, которых нет у отдельных частей. Применительно к образованию это означает, что качество системы определяется не суммой «хороших школ», а <b>качеством связей</b> между уровнями, институтами, участниками и обществом.</p><p><b>Система образования</b> — это исторически сложившаяся, социально обусловленная совокупность образовательных стандартов и программ, сети образовательных организаций, органов управления и субъектов образовательного процесса, обеспечивающая реализацию права граждан на образование и удовлетворение потребностей общества в квалифицированных кадрах.</p><p>В обобщённом виде, согласно законодательству Узбекистана, система образования включает: <b>государственные образовательные стандарты и требования, учебные планы и программы; образовательные организации; организации, обеспечивающие научно-методическое сопровождение; органы государственного управления в сфере образования</b>, а также участников образовательного процесса — обучающихся, педагогов, родителей.</p><div class="note">🔎 Системный взгляд помогает увидеть, почему локальные реформы часто не дают эффекта: изменение одного элемента (например, учебников) без изменения других (подготовки учителей, оценивания, финансирования) порождает сопротивление системы.</div>`,`<p>Fanda <b>«tizim»</b> tushunchasi <b>L. fon Bertalanfi</b>ning umumiy tizimlar nazariyasi bilan bogʻliq: tizim — yaxlitlikni tashkil etuvchi, alohida qismlarda boʻlmagan yangi (emerjent) xususiyatlarga ega oʻzaro bogʻliq elementlar majmui. Taʼlimga nisbatan bu tizim sifati «yaxshi maktablar» yigʻindisi bilan emas, balki bosqichlar, institutlar, ishtirokchilar va jamiyat oʻrtasidagi <b>aloqalar sifati</b> bilan belgilanishini anglatadi.</p><p><b>Taʼlim tizimi</b> — fuqarolarning taʼlim olish huquqini roʻyobga chiqarishni va jamiyatning malakali kadrlarga boʻlgan ehtiyojini qondirishni taʼminlovchi, tarixan shakllangan, ijtimoiy shartlangan taʼlim standartlari va dasturlari, taʼlim tashkilotlari tarmogʻi, boshqaruv organlari va taʼlim jarayoni subyektlari majmui.</p><p>Umumlashgan holda, Oʻzbekiston qonunchiligiga koʻra taʼlim tizimi quyidagilarni oʻz ichiga oladi: <b>davlat taʼlim standartlari va talablari, oʻquv rejalari va dasturlari; taʼlim tashkilotlari; ilmiy-metodik taʼminotni amalga oshiruvchi tashkilotlar; taʼlim sohasidagi davlat boshqaruvi organlari</b>, shuningdek taʼlim jarayoni ishtirokchilari — taʼlim oluvchilar, pedagoglar, ota-onalar.</p><div class="note">🔎 Tizimli qarash nima uchun mahalliy islohotlar koʻpincha samara bermasligini koʻrishga yordam beradi: bitta elementni (masalan, darsliklarni) boshqalarini (oʻqituvchilar tayyorlash, baholash, moliyalashtirish) oʻzgartirmasdan oʻzgartirish tizim qarshiligini keltirib chiqaradi.</div>`]},
{h:['Компоненты системы и модель «вход — процесс — выход»','Tizim tarkibiy qismlari va «kirish — jarayon — chiqish» modeli'],b:[`<p>Для анализа образовательных систем широко используется модель <b>«вход — процесс — выход — результат»</b> (input — process — output — outcome), которую активно применял и Ф. Кумбс.</p><div class="kv"><div><b>Вход (inputs)</b>Обучающиеся, педагоги, финансы, здания, оборудование, учебники, цифровая инфраструктура, стандарты.</div><div><b>Процесс</b>Обучение и воспитание, методы, управление, оценивание, образовательная среда и культура.</div><div><b>Выход (outputs)</b>Выпускники, полученные знания и компетенции, документы об образовании.</div><div><b>Результат (outcomes)</b>Занятость, производительность, гражданская активность, благополучие, социальная мобильность.</div></div><h4>Структурные компоненты</h4><ul><li><b>Целевой</b> — цели образования, отражённые в законодательстве и стандартах;</li><li><b>Содержательный</b> — стандарты, учебные планы, программы, учебники;</li><li><b>Институциональный</b> — сеть образовательных организаций всех типов и форм собственности;</li><li><b>Субъектный</b> — обучающиеся, педагоги, родители, работодатели;</li><li><b>Управленческий</b> — органы управления, механизмы финансирования, контроля качества;</li><li><b>Ресурсный</b> — кадровые, финансовые, материально-технические, информационные ресурсы.</li></ul><h4>Международная стандартная классификация образования (МСКО / ISCED-2011)</h4><p>ЮНЕСКО выделяет 9 уровней: <b>0</b> — дошкольное; <b>1</b> — начальное; <b>2</b> — первая ступень среднего; <b>3</b> — вторая ступень среднего; <b>4</b> — послесреднее нетретичное; <b>5</b> — короткий цикл третичного; <b>6</b> — бакалавриат; <b>7</b> — магистратура; <b>8</b> — докторантура. МСКО позволяет сопоставлять национальные системы в международной статистике.</p>`,`<p>Taʼlim tizimlarini tahlil qilishda F. Kumbs ham faol qoʻllagan <b>«kirish — jarayon — chiqish — natija»</b> (input — process — output — outcome) modeli keng qoʻllaniladi.</p><div class="kv"><div><b>Kirish (inputs)</b>Taʼlim oluvchilar, pedagoglar, moliya, binolar, jihozlar, darsliklar, raqamli infratuzilma, standartlar.</div><div><b>Jarayon</b>Taʼlim va tarbiya, metodlar, boshqaruv, baholash, taʼlim muhiti va madaniyati.</div><div><b>Chiqish (outputs)</b>Bitiruvchilar, olingan bilim va kompetensiyalar, taʼlim haqidagi hujjatlar.</div><div><b>Natija (outcomes)</b>Bandlik, unumdorlik, fuqarolik faolligi, farovonlik, ijtimoiy mobillik.</div></div><h4>Tarkibiy komponentlar</h4><ul><li><b>Maqsadli</b> — qonunchilik va standartlarda aks etgan taʼlim maqsadlari;</li><li><b>Mazmuniy</b> — standartlar, oʻquv rejalari, dasturlar, darsliklar;</li><li><b>Institutsional</b> — barcha turdagi va mulkchilik shaklidagi taʼlim tashkilotlari tarmogʻi;</li><li><b>Subyektli</b> — taʼlim oluvchilar, pedagoglar, ota-onalar, ish beruvchilar;</li><li><b>Boshqaruv</b> — boshqaruv organlari, moliyalashtirish, sifat nazorati mexanizmlari;</li><li><b>Resurs</b> — kadr, moliyaviy, moddiy-texnik, axborot resurslari.</li></ul><h4>Xalqaro standart taʼlim tasnifi (XSTT / ISCED-2011)</h4><p>YUNESKO 9 ta darajani ajratadi: <b>0</b> — maktabgacha; <b>1</b> — boshlangʻich; <b>2</b> — oʻrta taʼlimning birinchi bosqichi; <b>3</b> — oʻrta taʼlimning ikkinchi bosqichi; <b>4</b> — oʻrtadan keyingi notretik; <b>5</b> — qisqa tsiklli tretik; <b>6</b> — bakalavriat; <b>7</b> — magistratura; <b>8</b> — doktorantura. XSTT milliy tizimlarni xalqaro statistikada solishtirish imkonini beradi.</p>`]},
{h:['Глобализация и образование','Globallashuv va taʼlim'],b:[`<p><b>Глобализация</b> — процесс усиления взаимозависимости стран в экономике, политике, культуре и информационной сфере. Для образования она проявляется в нескольких формах:</p><ul><li><b>Международные рейтинги и сравнительные исследования</b> (QS, THE, ARWU, PISA) формируют глобальные ориентиры «успешности».</li><li><b>Академическая мобильность</b> студентов и преподавателей; число иностранных студентов в мире превысило 6 млн человек.</li><li><b>Транснациональное образование</b> — филиалы зарубежных вузов, совместные и двойные дипломы, онлайн-программы.</li><li><b>Гармонизация стандартов</b> — Болонский процесс, рамки квалификаций, взаимное признание дипломов.</li><li><b>Деятельность международных организаций</b> — ЮНЕСКО, ОЭСР, Всемирный банк, ЮНИСЕФ, ЕС — как акторов глобальной образовательной политики.</li></ul><p>Исследователи описывают противоречивые последствия глобализации. С одной стороны — обмен лучшими практиками, рост качества, расширение возможностей. С другой — риск <b>«институционального изоморфизма»</b> (копирование чужих моделей без учёта контекста), «утечки мозгов», коммерциализации, угрозы национальной культурной идентичности. Ответом становится стратегия <b>«глокализации»</b>: заимствование мирового опыта с его адаптацией к национальным ценностям, языку и потребностям.</p>`,`<p><b>Globallashuv</b> — iqtisodiyot, siyosat, madaniyat va axborot sohasida mamlakatlar oʻzaro bogʻliqligining kuchayishi jarayoni. Taʼlimda u bir necha shaklda namoyon boʻladi:</p><ul><li><b>Xalqaro reytinglar va qiyosiy tadqiqotlar</b> (QS, THE, ARWU, PISA) «muvaffaqiyat»ning global moʻljallarini shakllantiradi.</li><li>Talabalar va oʻqituvchilarning <b>akademik mobilligi</b>; dunyodagi xorijiy talabalar soni 6 mln dan oshdi.</li><li><b>Transmilliy taʼlim</b> — xorijiy OTM filiallari, qoʻshma va ikki diplomli dasturlar, onlayn dasturlar.</li><li><b>Standartlarni uygʻunlashtirish</b> — Boloniya jarayoni, malaka ramkalari, diplomlarni oʻzaro tan olish.</li><li>Global taʼlim siyosati aktorlari sifatida <b>xalqaro tashkilotlar faoliyati</b> — YUNESKO, IHTT, Jahon banki, YUNISEF, YeI.</li></ul><p>Tadqiqotchilar globallashuvning ziddiyatli oqibatlarini taʼriflaydi. Bir tomondan — ilgʻor tajriba almashinuvi, sifat oʻsishi, imkoniyatlar kengayishi. Boshqa tomondan — <b>«institutsional izomorfizm»</b> (kontekstni hisobga olmasdan oʻzga modellarni koʻchirish), «aql oqib ketishi», tijoratlashuv, milliy madaniy oʻziga xoslikka tahdid xavfi. Bunga javob <b>«glokalizatsiya»</b> strategiyasi boʻladi: jahon tajribasini milliy qadriyatlar, til va ehtiyojlarga moslashtirib oʻzlashtirish.</p>`]},
{h:['Концепция мирового кризиса образования Ф. Кумбса','F. Kumbsning jahon taʼlim inqirozi konsepsiyasi'],b:[`<p><b>Филип Г. Кумбс</b> (1915–2006) — американский экономист, первый директор Международного института планирования образования ЮНЕСКО (IIEP, Париж). В 1967 г. на конференции в Уильямсбурге (США) он представил доклад, изданный в 1968 г. как книга <b>«Кризис образования в современном мире: системный анализ»</b> (The World Educational Crisis: A Systems Analysis). В 1985 г. вышла книга «Взгляд из восьмидесятых» (The World Crisis in Education: The View from the Eighties).</p><p>Суть концепции: кризис образования — это <b>разрыв (disparity) между образовательными системами и быстро меняющейся средой</b>, в которой они функционируют. Общество, экономика, наука и технологии меняются быстрее, чем способны адаптироваться школы и университеты.</p><h4>Причины кризиса по Кумбсу</h4><ol><li><b>Резкий рост спроса на образование</b> («образовательный взрыв») — массовые устремления населения после Второй мировой войны и деколонизации.</li><li><b>Острая нехватка ресурсов</b> — финансы растут медленнее, чем потребности.</li><li><b>Рост удельных затрат</b> — образование трудоёмко, его стоимость растёт быстрее инфляции.</li><li><b>Несоответствие «выхода» потребностям</b> — выпускники не соответствуют требованиям рынка труда и развития, что порождает безработицу образованных.</li><li><b>Инерция и неэффективность</b> самих образовательных систем, консервативность содержания и методов, а также инерция общества (престиж диплома вместо реальных компетенций).</li></ol><div class="quote">«Суть кризиса выражается словом “диспропорция” — между образовательными системами и окружающей их средой». — Ф. Кумбс</div><p>Кумбс одним из первых обосновал значение <b>неформального образования</b> как ресурса преодоления кризиса и ввёл в научный оборот различение формального, неформального и информального обучения (в работах 1970-х гг. совместно с М. Ахмедом).</p>`,`<p><b>Filip G. Kumbs</b> (1915–2006) — amerikalik iqtisodchi, YUNESKO Xalqaro taʼlimni rejalashtirish institutining (IIEP, Parij) birinchi direktori. 1967-yilda Uilyamsburg (AQSh) konferensiyasida u maʼruza qildi va u 1968-yilda <b>«Zamonaviy dunyoda taʼlim inqirozi: tizimli tahlil»</b> (The World Educational Crisis: A Systems Analysis) kitobi sifatida nashr etildi. 1985-yilda «Saksoninchi yillardan nigoh» (The World Crisis in Education: The View from the Eighties) kitobi chiqdi.</p><p>Konsepsiya mohiyati: taʼlim inqirozi — bu <b>taʼlim tizimlari va ular faoliyat yuritadigan tez oʻzgaruvchan muhit oʻrtasidagi nomutanosiblik (disparity)</b>. Jamiyat, iqtisodiyot, fan va texnologiyalar maktab va universitetlar moslasha oladigan tezlikdan tezroq oʻzgaradi.</p><h4>Kumbs boʻyicha inqiroz sabablari</h4><ol><li><b>Taʼlimga talabning keskin oʻsishi</b> («taʼlim portlashi») — Ikkinchi jahon urushi va dekolonizatsiyadan keyingi aholining ommaviy intilishlari.</li><li><b>Resurslarning keskin yetishmasligi</b> — moliya ehtiyojlarga qaraganda sekinroq oʻsadi.</li><li><b>Solishtirma xarajatlarning oʻsishi</b> — taʼlim mehnattalab, uning qiymati inflyatsiyadan tezroq oʻsadi.</li><li><b>«Chiqish»ning ehtiyojlarga mos kelmasligi</b> — bitiruvchilar mehnat bozori va rivojlanish talablariga javob bermaydi, bu oʻqimishlilar ishsizligini keltirib chiqaradi.</li><li>Taʼlim tizimlarining <b>inertsiyasi va samarasizligi</b>, mazmun va metodlarning konservativligi, shuningdek jamiyat inertsiyasi (real kompetensiyalar oʻrniga diplom nufuzi).</li></ol><div class="quote">«Inqiroz mohiyati “nomutanosiblik” soʻzi bilan ifodalanadi — taʼlim tizimlari va ularni oʻrab turgan muhit oʻrtasida». — F. Kumbs</div><p>Kumbs inqirozni yengish resursi sifatida <b>noformal taʼlim</b> ahamiyatini birinchilardan boʻlib asoslagan va formal, noformal va informal taʼlimni farqlashni ilmiy muomalaga kiritgan (1970-yillardagi M. Ahmed bilan hamkorlikdagi ishlarida).</p>`]},
{h:['Кризис образования сегодня: от Кумбса к XXI веку','Bugungi taʼlim inqirozi: Kumbsdan XXI asrgacha'],b:[`<p>Идеи Кумбса не утратили актуальности — они получили новое звучание:</p><ul><li>Всемирный банк в докладе о мировом развитии <b>WDR-2018 «Обучение для реализации потенциала образования»</b> ввёл понятие <b>«кризиса обучения» (learning crisis)</b>: школьное образование расширилось, но реальные результаты обучения остаются низкими.</li><li>Пандемия <b>COVID-19</b> на пике затронула около <b>1,6 млрд обучающихся</b> в более чем 190 странах, обнажив цифровое неравенство и уязвимость систем.</li><li>В 2022 г. ООН провела <b>Саммит по трансформации образования</b> (Transforming Education Summit), признав необходимость не «ремонта», а глубокой трансформации систем.</li><li>Новые диспропорции: между темпами технологического развития (ИИ) и подготовкой кадров, между массовизацией высшего образования и его качеством.</li></ul><h4>Пути преодоления кризиса</h4><ol><li>Системные (а не фрагментарные) реформы с опорой на данные;</li><li>Развитие непрерывного образования и признание неформального обучения;</li><li>Повышение статуса и качества подготовки педагогов;</li><li>Сближение образования с рынком труда (дуальное обучение, участие работодателей);</li><li>Эффективное использование ресурсов, государственно-частное партнёрство;</li><li>Цифровая трансформация с обеспечением равного доступа.</li></ol><div class="note">🇺🇿 Масштабные реформы в Узбекистане с 2017 года — расширение охвата дошкольным и высшим образованием, принятие ЗРУ-637 и ЗРУ-901, внедрение кредитно-модульной системы, участие в PISA и PIRLS — можно рассматривать как системный ответ на те диспропорции, которые описал Кумбс.</div>`,`<p>Kumbs gʻoyalari oʻz dolzarbligini yoʻqotmagan — ular yangicha jaranglamoqda:</p><ul><li>Jahon banki <b>WDR-2018 «Taʼlim salohiyatini roʻyobga chiqarish uchun oʻrganish»</b> jahon rivojlanishi maʼruzasida <b>«oʻrganish inqirozi» (learning crisis)</b> tushunchasini kiritdi: maktab taʼlimi kengaydi, ammo real taʼlim natijalari pastligicha qolmoqda.</li><li><b>COVID-19</b> pandemiyasi choʻqqisida 190 dan ortiq mamlakatda qariyb <b>1,6 mlrd taʼlim oluvchiga</b> taʼsir qilib, raqamli tengsizlik va tizimlar zaifligini fosh etdi.</li><li>2022-yilda BMT <b>Taʼlimni transformatsiya qilish sammitini</b> (Transforming Education Summit) oʻtkazib, tizimlarni «taʼmirlash» emas, chuqur transformatsiya qilish zarurligini tan oldi.</li><li>Yangi nomutanosibliklar: texnologik rivojlanish (SI) surʼati va kadrlar tayyorlash oʻrtasida, oliy taʼlim ommaviylashuvi va uning sifati oʻrtasida.</li></ul><h4>Inqirozni yengish yoʻllari</h4><ol><li>Maʼlumotlarga tayangan tizimli (parchalangan emas) islohotlar;</li><li>Uzluksiz taʼlimni rivojlantirish va noformal taʼlimni tan olish;</li><li>Pedagoglar maqomi va tayyorgarlik sifatini oshirish;</li><li>Taʼlimni mehnat bozoriga yaqinlashtirish (dual taʼlim, ish beruvchilar ishtiroki);</li><li>Resurslardan samarali foydalanish, davlat-xususiy sheriklik;</li><li>Teng imkoniyatni taʼminlagan holda raqamli transformatsiya.</li></ol><div class="note">🇺🇿 Oʻzbekistonda 2017-yildan boshlangan keng koʻlamli islohotlar — maktabgacha va oliy taʼlim qamrovini kengaytirish, OʻRQ-637 va OʻRQ-901 ning qabul qilinishi, kredit-modul tizimining joriy etilishi, PISA va PIRLSda ishtirok — Kumbs taʼriflagan nomutanosibliklarga tizimli javob sifatida qaralishi mumkin.</div>`]}

cs:{t:[`<p>В одном из регионов ежегодно выпускается около 3 000 выпускников колледжей по специальностям «бухгалтерия» и «экономика», но лишь треть из них трудоустраивается по профилю. Одновременно местные предприятия жалуются на острую нехватку сварщиков, электромонтажников и специалистов по обслуживанию солнечных панелей. Хокимият просит аналитиков предложить решение.</p>`,`<p>Viloyatlardan birida har yili «buxgalteriya» va «iqtisodiyot» mutaxassisliklari boʻyicha 3 000 ga yaqin kollej bitiruvchisi chiqadi, ammo ularning faqat uchdan biri ixtisosligi boʻyicha ishga joylashadi. Shu bilan birga, mahalliy korxonalar payvandchilar, elektr montajchilari va quyosh panellariga xizmat koʻrsatuvchi mutaxassislarning keskin yetishmasligidan shikoyat qilmoqda. Hokimlik tahlilchilardan yechim taklif qilishni soʻramoqda.</p>`],

o:[['Закрыть экономические специальности полностью','Построить систему прогнозирования потребности в кадрах, внедрить дуальное обучение с предприятиями, краткие программы переподготовки для безработных выпускников','Увеличить число бюджетных мест по экономике','Обязать предприятия нанимать экономистов'],['Iqtisodiy mutaxassisliklarni butunlay yopish','Kadrlarga ehtiyojni prognozlash tizimini yaratish, korxonalar bilan dual taʼlimni joriy etish, ishsiz bitiruvchilar uchun qisqa qayta tayyorlash dasturlari','Iqtisodiyot boʻyicha byudjet oʻrinlarini koʻpaytirish','Korxonalarni iqtisodchilarni ishga olishga majburlash']],
best:1,fb:[['Радикальное закрытие игнорирует реальный, хотя и меньший, спрос и не решает проблему уже выпущенных кадров.','Системное решение: связь «выхода» системы с рынком труда, участие работодателей и механизмы непрерывного образования (переподготовка).','Это усилит диспропорцию — «выход» ещё больше разойдётся с потребностями.','Административное принуждение неэффективно и нарушает рыночные механизмы.'],['Keskin yopish real, garchi kamroq boʻlsa-da, talabni eʼtiborsiz qoldiradi va allaqachon tayyorlangan kadrlar muammosini hal qilmaydi.','Tizimli yechim: tizim «chiqishi»ni mehnat bozori bilan bogʻlash, ish beruvchilar ishtiroki va uzluksiz taʼlim mexanizmlari (qayta tayyorlash).','Bu nomutanosiblikni kuchaytiradi — «chiqish» ehtiyojlardan yanada uzoqlashadi.','Maʼmuriy majburlash samarasiz va bozor mexanizmlarini buzadi.']]},

title:['Образовательная политика, глобальные вызовы, неолиберальная глобализация и программы «структурной корректировки»','Taʼlim siyosati, global chaqiriqlar, neoliberal globallashuv va «tarkibiy tuzatish» dasturlari'],
sub:['Акторы и цикл образовательной политики, Вашингтонский консенсус, МВФ и Всемирный банк, GATS, GERM','Taʼlim siyosatining aktorlari va sikli, Vashington konsensusi, XVF va Jahon banki, GATS, GERM'],
sec:[
{h:['Образовательная политика: понятие, акторы, инструменты','Taʼlim siyosati: tushuncha, aktorlar, vositalar'],b:[`<p><b>Образовательная политика</b> — это система целей, приоритетов, решений и действий государства и общества, направленных на развитие образования в интересах личности, общества и государства. Она является частью социальной и экономической политики и определяет, <i>кого, чему, как, за чей счёт и с каким результатом</i> учить.</p><h4>Акторы образовательной политики</h4><ul><li><b>Государство</b> — парламент, правительство, профильные министерства, региональные органы;</li><li><b>Международные организации</b> — ЮНЕСКО, ОЭСР, Всемирный банк, МВФ, ЮНИСЕФ, ЕС;</li><li><b>Образовательные организации</b> и профессиональное сообщество педагогов;</li><li><b>Бизнес и работодатели</b>, отраслевые ассоциации;</li><li><b>Гражданское общество</b> — родители, НКО, СМИ, студенческие организации.</li></ul><h4>Инструменты</h4><div class="kv"><div><b>Нормативные</b>Законы, стандарты, лицензирование, аккредитация.</div><div><b>Финансовые</b>Бюджет, гранты, подушевое финансирование, ваучеры, кредиты.</div><div><b>Информационные</b>Мониторинг, рейтинги, открытые данные, исследования.</div><div><b>Организационные</b>Создание и реорганизация институтов, программы развития.</div></div><h4>Цикл политики</h4><p>Формирование повестки → разработка альтернатив → принятие решения → реализация → оценка → корректировка. Современный стандарт — <b>политика, основанная на данных</b> (evidence-based policy), когда решения опираются на результаты исследований и мониторинга (например, PISA).</p>`,`<p><b>Taʼlim siyosati</b> — shaxs, jamiyat va davlat manfaatlari yoʻlida taʼlimni rivojlantirishga qaratilgan davlat va jamiyatning maqsadlari, ustuvorliklari, qarorlari va harakatlari tizimi. U ijtimoiy va iqtisodiy siyosatning bir qismi boʻlib, <i>kimni, nimaga, qanday, kimning hisobidan va qanday natija bilan</i> oʻqitishni belgilaydi.</p><h4>Taʼlim siyosati aktorlari</h4><ul><li><b>Davlat</b> — parlament, hukumat, tegishli vazirliklar, hududiy organlar;</li><li><b>Xalqaro tashkilotlar</b> — YUNESKO, IHTT, Jahon banki, XVF, YUNISEF, YeI;</li><li><b>Taʼlim tashkilotlari</b> va pedagoglar kasbiy hamjamiyati;</li><li><b>Biznes va ish beruvchilar</b>, tarmoq assotsiatsiyalari;</li><li><b>Fuqarolik jamiyati</b> — ota-onalar, NNT, OAV, talabalar tashkilotlari.</li></ul><h4>Vositalar</h4><div class="kv"><div><b>Meʼyoriy</b>Qonunlar, standartlar, litsenziyalash, akkreditatsiya.</div><div><b>Moliyaviy</b>Byudjet, grantlar, jon boshiga moliyalashtirish, vaucherlar, kreditlar.</div><div><b>Axborot</b>Monitoring, reytinglar, ochiq maʼlumotlar, tadqiqotlar.</div><div><b>Tashkiliy</b>Institutlarni tashkil etish va qayta tashkil etish, rivojlanish dasturlari.</div></div><h4>Siyosat sikli</h4><p>Kun tartibini shakllantirish → muqobillarni ishlab chiqish → qaror qabul qilish → amalga oshirish → baholash → tuzatish. Zamonaviy standart — <b>maʼlumotlarga asoslangan siyosat</b> (evidence-based policy), bunda qarorlar tadqiqot va monitoring natijalariga (masalan, PISA) tayanadi.</p>`]},
{h:['Глобальные вызовы для образовательной политики','Taʼlim siyosati uchun global chaqiriqlar'],b:[`<ul><li><b>Демография</b>: в Узбекистане и многих странах Азии и Африки — молодое растущее население и высокий спрос на места в школах и вузах; в Европе и Восточной Азии — старение и сокращение когорт.</li><li><b>Миграция</b>: интеграция детей мигрантов, признание квалификаций, трудовая миграция.</li><li><b>Климат и устойчивое развитие</b>: образование в интересах устойчивого развития (ESD), «зелёные» навыки.</li><li><b>Цифровая трансформация и ИИ</b>: новые компетенции, риски цифрового неравенства.</li><li><b>Неравенство</b>: гендерное, территориальное, социально-экономическое, доступ лиц с инвалидностью.</li><li><b>Конфликты и кризисы</b>: образование в чрезвычайных ситуациях.</li></ul><p>Глобальной рамкой ответов на эти вызовы является <b>ЦУР-4 «Качественное образование»</b> с 10 задачами (4.1–4.7 и 4.a–4.c): всеобщее бесплатное начальное и среднее образование, доступ к дошкольному образованию, доступное профессиональное и высшее образование, навыки для достойной работы, устранение неравенства, грамотность, образование для устойчивого развития и глобальной гражданственности, инфраструктура, стипендии, квалифицированные педагоги.</p>`,`<ul><li><b>Demografiya</b>: Oʻzbekiston va Osiyo hamda Afrikaning koʻplab mamlakatlarida — yosh, oʻsib borayotgan aholi va maktab hamda OTMlarda oʻrinlarga yuqori talab; Yevropa va Sharqiy Osiyoda — qarish va kogortalarning qisqarishi.</li><li><b>Migratsiya</b>: migrantlar farzandlari integratsiyasi, malakalarni tan olish, mehnat migratsiyasi.</li><li><b>Iqlim va barqaror rivojlanish</b>: barqaror rivojlanish manfaatlarida taʼlim (ESD), «yashil» koʻnikmalar.</li><li><b>Raqamli transformatsiya va SI</b>: yangi kompetensiyalar, raqamli tengsizlik xavfi.</li><li><b>Tengsizlik</b>: gender, hududiy, ijtimoiy-iqtisodiy, nogironligi boʻlgan shaxslarning imkoniyatlari.</li><li><b>Mojarolar va inqirozlar</b>: favqulodda vaziyatlarda taʼlim.</li></ul><p>Bu chaqiriqlarga javoblarning global ramkasi — 10 ta vazifaga ega <b>BRM-4 «Sifatli taʼlim»</b> (4.1–4.7 va 4.a–4.c): hamma uchun bepul boshlangʻich va oʻrta taʼlim, maktabgacha taʼlimdan foydalanish, hamyonbop kasbiy va oliy taʼlim, munosib ish uchun koʻnikmalar, tengsizlikni bartaraf etish, savodxonlik, barqaror rivojlanish va global fuqarolik uchun taʼlim, infratuzilma, stipendiyalar, malakali pedagoglar.</p>`]},
{h:['Неолиберальная глобализация и образование','Neoliberal globallashuv va taʼlim'],b:[`<p><b>Неолиберализм</b> — экономико-политическая доктрина, ставшая доминирующей с конца 1970-х — 1980-х гг. (политика М. Тэтчер, Р. Рейгана), основанная на идеях свободного рынка, приватизации, дерегулирования и сокращения роли государства. В 1989 г. экономист <b>Дж. Уильямсон</b> сформулировал десять принципов, получивших название <b>«Вашингтонский консенсус»</b> (фискальная дисциплина, либерализация торговли, приватизация и др.).</p><h4>Проявления в образовании</h4><ul><li><b>Маркетизация</b>: образование как услуга, обучающийся как «клиент», конкуренция между школами и вузами;</li><li><b>Новый государственный менеджмент (NPM)</b>: управление по результатам, KPI, контракты, аудит;</li><li><b>Выбор и ваучеры</b>: деньги «следуют за учеником» (чартерные школы в США, free schools в Великобритании);</li><li><b>Приватизация и платность</b>: рост частного сектора, введение платы за обучение;</li><li><b>Подотчётность через тестирование</b>: стандартизированные тесты и публичные рейтинги.</li></ul><p>Финский исследователь <b>Пасі Сальберг</b> назвал совокупность таких реформ <b>GERM (Global Education Reform Movement)</b> — «глобальным движением за реформу образования» — и показал, что Финляндия добилась высоких результатов, следуя противоположному пути: доверие к учителям, сотрудничество вместо конкуренции, отсутствие массового стандартизированного тестирования, равенство.</p><div class="note">⚖️ Критики (М. Карной, Дж. Спринг и др.) указывают, что неолиберальные реформы нередко усиливали неравенство и сужали цели образования до экономической эффективности. Сторонники отмечают рост эффективности и подотчётности. Задача политики — <b>баланс</b> между эффективностью и справедливостью.</div>`,`<p><b>Neoliberalizm</b> — 1970-yillar oxiri — 1980-yillardan hukmron boʻlgan (M. Tetcher, R. Reygan siyosati), erkin bozor, xususiylashtirish, deregulyatsiya va davlat rolini qisqartirish gʻoyalariga asoslangan iqtisodiy-siyosiy doktrina. 1989-yilda iqtisodchi <b>J. Uilyamson</b> <b>«Vashington konsensusi»</b> deb nomlangan oʻnta tamoyilni (fiskal intizom, savdoni liberallashtirish, xususiylashtirish va boshqalar) shakllantirdi.</p><h4>Taʼlimdagi koʻrinishlari</h4><ul><li><b>Bozorlashtirish</b>: taʼlim xizmat sifatida, taʼlim oluvchi «mijoz» sifatida, maktablar va OTMlar oʻrtasida raqobat;</li><li><b>Yangi davlat menejmenti (NPM)</b>: natijalar boʻyicha boshqaruv, KPI, shartnomalar, audit;</li><li><b>Tanlov va vaucherlar</b>: pul «oʻquvchi ortidan boradi» (AQShda charter maktablar, Buyuk Britaniyada free schools);</li><li><b>Xususiylashtirish va pullik taʼlim</b>: xususiy sektor oʻsishi, oʻqish uchun toʻlov joriy etilishi;</li><li><b>Test orqali hisobdorlik</b>: standartlashtirilgan testlar va ommaviy reytinglar.</li></ul><p>Fin tadqiqotchisi <b>Pasi Salberg</b> bunday islohotlar majmuini <b>GERM (Global Education Reform Movement)</b> — «taʼlimni isloh qilish uchun global harakat» deb atadi va Finlyandiya qarama-qarshi yoʻldan borib yuqori natijalarga erishganini koʻrsatdi: oʻqituvchilarga ishonch, raqobat oʻrniga hamkorlik, ommaviy standartlashtirilgan testlarning yoʻqligi, tenglik.</p><div class="note">⚖️ Tanqidchilar (M. Karnoy, J. Spring va boshqalar) neoliberal islohotlar koʻpincha tengsizlikni kuchaytirgani va taʼlim maqsadlarini iqtisodiy samaradorlikka toraytirganini koʻrsatadi. Tarafdorlar samaradorlik va hisobdorlik oʻsishini qayd etadi. Siyosat vazifasi — samaradorlik va adolat oʻrtasidagi <b>muvozanat</b>.</div>`]},
{h:['Программы «структурной корректировки» и GATS','«Tarkibiy tuzatish» dasturlari va GATS'],b:[`<p><b>Программы структурной корректировки (ПСК, Structural Adjustment Programs)</b> — пакеты экономических условий, которые <b>МВФ и Всемирный банк</b> в 1980–1990-е гг. выдвигали странам-заёмщикам (прежде всего в Африке, Латинской Америке, части Азии) в обмен на кредиты в период долгового кризиса.</p><h4>Типичные условия, затрагивавшие образование</h4><ul><li>Сокращение государственных расходов и дефицита бюджета (фискальная экономия);</li><li>Введение <b>платы за обучение</b> и «разделения издержек» (user fees, cost-sharing), особенно в высшем образовании;</li><li>Замораживание зарплат и найма учителей;</li><li>Децентрализация и передача ответственности на местный уровень;</li><li>Приоритет начального образования над высшим (на основе расчётов «нормы отдачи»).</li></ul><h4>Последствия</h4><p>Во многих странах Африки к югу от Сахары в 1980-е гг. охват школьным образованием снизился, качество упало, выросла нагрузка на семьи. Под влиянием критики (в т.ч. доклада ЮНИСЕФ «Корректировка с человеческим лицом», 1987) произошёл поворот: <b>Всемирная конференция «Образование для всех» (Джомтьен, 1990)</b>, <b>Дакарские рамки действий (2000)</b>, отказ от платы в начальной школе, переход к <b>Стратегиям сокращения бедности (PRSP, 1999)</b>.</p><h4>GATS: образование как предмет мировой торговли</h4><p>Генеральное соглашение по торговле услугами ВТО (<b>GATS, 1995</b>) включило образование в число торгуемых услуг и выделило <b>четыре способа поставки</b>:</p><ol><li><b>Трансграничная поставка</b> — дистанционное и онлайн-обучение;</li><li><b>Потребление за рубежом</b> — обучение студентов в другой стране;</li><li><b>Коммерческое присутствие</b> — филиалы вузов, кампусы за рубежом;</li><li><b>Присутствие физических лиц</b> — преподаватели, работающие за границей.</li></ol>`,`<p><b>Tarkibiy tuzatish dasturlari (TTD, Structural Adjustment Programs)</b> — 1980–1990-yillarda qarz inqirozi davrida <b>XVF va Jahon banki</b> qarz oluvchi mamlakatlarga (eng avvalo Afrika, Lotin Amerikasi, Osiyoning bir qismi) kreditlar evaziga qoʻygan iqtisodiy shartlar paketlari.</p><h4>Taʼlimga taʼsir qilgan odatiy shartlar</h4><ul><li>Davlat xarajatlari va byudjet taqchilligini qisqartirish (fiskal tejamkorlik);</li><li><b>Oʻqish uchun toʻlov</b> va «xarajatlarni taqsimlash»ni joriy etish (user fees, cost-sharing), ayniqsa oliy taʼlimda;</li><li>Oʻqituvchilar maoshi va ishga qabul qilishni muzlatish;</li><li>Desentralizatsiya va masʼuliyatni mahalliy darajaga oʻtkazish;</li><li>Boshlangʻich taʼlimning oliy taʼlimdan ustuvorligi («qaytim meʼyori» hisob-kitoblari asosida).</li></ul><h4>Oqibatlar</h4><p>1980-yillarda Saxaradan janubdagi Afrikaning koʻplab mamlakatlarida maktab qamrovi kamaydi, sifat pasaydi, oilalarga yuk ortdi. Tanqidlar taʼsirida (jumladan, YUNISEFning «Inson qiyofasidagi tuzatish», 1987 maʼruzasi) burilish yuz berdi: <b>«Hamma uchun taʼlim» jahon konferensiyasi (Jomtyen, 1990)</b>, <b>Dakar harakatlar doirasi (2000)</b>, boshlangʻich maktabda toʻlovdan voz kechish, <b>Kambagʻallikni qisqartirish strategiyalariga (PRSP, 1999)</b> oʻtish.</p><h4>GATS: taʼlim jahon savdosi predmeti sifatida</h4><p>JSTning Xizmatlar savdosi toʻgʻrisidagi bosh kelishuvi (<b>GATS, 1995</b>) taʼlimni savdo xizmatlari qatoriga kiritdi va <b>toʻrtta yetkazib berish usulini</b> ajratdi:</p><ol><li><b>Transchegaraviy yetkazib berish</b> — masofaviy va onlayn taʼlim;</li><li><b>Xorijda isteʼmol qilish</b> — talabalarning boshqa mamlakatda oʻqishi;</li><li><b>Tijorat ishtiroki</b> — OTM filiallari, xorijdagi kampuslar;</li><li><b>Jismoniy shaxslar ishtiroki</b> — xorijda ishlayotgan oʻqituvchilar.</li></ol>`]},
{h:['Поиск баланса: уроки для Узбекистана','Muvozanat izlash: Oʻzbekiston uchun saboqlar'],b:[`<p>Опыт неолиберальных реформ и ПСК даёт важные уроки для формирования национальной образовательной политики:</p><ol><li><b>Государственные гарантии базового образования</b> не должны подчиняться рыночной логике. В Узбекистане Конституция и ЗРУ-637 гарантируют бесплатное общее среднее образование.</li><li><b>Рыночные инструменты полезны как дополнение</b>: развитие негосударственного сектора, государственно-частное партнёрство (особенно в дошкольном образовании), конкурентное грантовое финансирование.</li><li><b>Справедливость доступа</b>: целевые квоты и льготы (например, для девушек из малообеспеченных семей, лиц с инвалидностью), образовательные кредиты.</li><li><b>Академическая и финансовая самостоятельность вузов</b> при развитой системе контроля качества.</li><li><b>Политика на основе данных</b> и участие в международных исследованиях (PISA, PIRLS, TIMSS).</li><li><b>Собственный путь</b>: адаптация мирового опыта к национальному контексту, а не механическое копирование.</li></ol><div class="note">📌 В трудах отечественных авторов, рекомендованных программой (М.Х. Умарова, З.Б. Файзуллаева и др.), подчёркивается: образовательная политика Нового Узбекистана сочетает открытость мировому опыту с приоритетом социальной справедливости и человеческого капитала.</div>`,`<p>Neoliberal islohotlar va TTD tajribasi milliy taʼlim siyosatini shakllantirish uchun muhim saboqlar beradi:</p><ol><li><b>Asosiy taʼlimning davlat kafolatlari</b> bozor mantigʻiga boʻysunmasligi kerak. Oʻzbekistonda Konstitutsiya va OʻRQ-637 bepul umumiy oʻrta taʼlimni kafolatlaydi.</li><li><b>Bozor vositalari qoʻshimcha sifatida foydali</b>: nodavlat sektorni rivojlantirish, davlat-xususiy sheriklik (ayniqsa maktabgacha taʼlimda), raqobatli grant moliyalashtirish.</li><li><b>Imkoniyatlar adolati</b>: maqsadli kvotalar va imtiyozlar (masalan, kam taʼminlangan oilalardan boʻlgan qizlar, nogironligi boʻlgan shaxslar uchun), taʼlim kreditlari.</li><li>Rivojlangan sifat nazorati tizimi bilan birga <b>OTMlarning akademik va moliyaviy mustaqilligi</b>.</li><li><b>Maʼlumotlarga asoslangan siyosat</b> va xalqaro tadqiqotlarda ishtirok (PISA, PIRLS, TIMSS).</li><li><b>Oʻz yoʻli</b>: jahon tajribasini mexanik koʻchirish emas, milliy kontekstga moslashtirish.</li></ol><div class="note">📌 Dastur tavsiya etgan mahalliy mualliflar (M.X. Umarova, Z.B. Fayzullayeva va boshqalar) asarlarida taʼkidlanadi: Yangi Oʻzbekiston taʼlim siyosati jahon tajribasiga ochiqlikni ijtimoiy adolat va inson kapitali ustuvorligi bilan uygʻunlashtiradi.</div>`]}
],

cs:{t:[`<p>Международный финансовый институт предлагает правительству страны льготный кредит на модернизацию образования при условии: (1) введения платы за обучение во всех государственных вузах, (2) сокращения бюджетного финансирования школ на 15%, (3) перехода к ваучерной системе в общем среднем образовании. Министерство должно подготовить позицию для переговоров.</p>`,`<p>Xalqaro moliya instituti hukumatga taʼlimni modernizatsiya qilish uchun imtiyozli kredit taklif qilmoqda, shartlari: (1) barcha davlat OTMlarida oʻqish uchun toʻlovni joriy etish, (2) maktablarni byudjetdan moliyalashtirishni 15% ga qisqartirish, (3) umumiy oʻrta taʼlimda vaucher tizimiga oʻtish. Vazirlik muzokaralar uchun pozitsiya tayyorlashi kerak.</p>`],

o:[['Принять все условия ради получения кредита','Отказаться от любого сотрудничества','Вести переговоры: сохранить бесплатное общее среднее образование и бюджет школ, допустить смешанную модель в вузах (гранты + контракт + образовательные кредиты), требовать оценки социальных последствий','Принять условия, но не выполнять их'],['Kredit olish uchun barcha shartlarni qabul qilish','Har qanday hamkorlikdan voz kechish','Muzokara olib borish: bepul umumiy oʻrta taʼlim va maktablar byudjetini saqlash, OTMlarda aralash modelga (grant + kontrakt + taʼlim kreditlari) yoʻl qoʻyish, ijtimoiy oqibatlarni baholashni talab qilish','Shartlarni qabul qilib, bajarmaslik']],
